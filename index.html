<style>
:root{--bg:#0e1013;--card:#171a1f;--card2:#1f232a;--line:#2a2f38;--txt:#eef1f5;--mut:#8b93a1;--acc:#ffd23f;--acc2:#1f8f5f;--red:#e5484d;--blue:#3e8bff;--grn:#5be39b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(150px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:6px 0 14px}h2{font-size:15px;margin:18px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.top{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding:8px 0 10px;z-index:5}
.pts{background:var(--acc);color:#111;font-weight:800;border-radius:999px;padding:6px 12px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.gap4{gap:4px}
.mut{color:var(--mut);font-size:13px}.b{font-weight:700}.sm{font-size:13px}.r{text-align:right}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--card2);color:var(--mut);text-transform:uppercase;white-space:nowrap}
.badge.open{background:#173d2b;color:var(--grn)}.badge.closed{background:#3d3317;color:var(--acc)}.badge.settled{background:#1c2a44;color:#8ab4ff}.badge.cancelled{background:#3d1a1c;color:#ff8a8d}.badge.susp{background:#3d1a1c;color:#ff8a8d}
.badge.bb{background:#2b1f45;color:#c4a8ff}.badge.y{background:var(--acc);color:#111}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.opt{font:inherit;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--txt);text-align:left;display:flex;justify-content:space-between;gap:6px;align-items:center;cursor:pointer}
.opt .o{color:var(--acc);font-weight:800;white-space:nowrap}.opt:disabled{cursor:default}
.opt.sel{background:var(--acc);border-color:var(--acc);color:#111}.opt.sel .o{color:#111}
.opt.win{border-color:var(--grn);background:#173d2b}.opt.lose{opacity:.35}.opt.lk{opacity:.6}.opt.mine{border-color:var(--acc)}
.gt{margin-top:8px}
.gh,.gr{display:grid;grid-template-columns:1fr 80px 80px;gap:6px;align-items:center}
.gh{font-size:11px;color:var(--mut);text-transform:uppercase;font-weight:700;padding:0 0 4px}.gh span:not(:first-child){text-align:center}
.gr{padding:4px 0;border-top:1px solid var(--line)}
.gl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ob{font:inherit;background:var(--card2);border:1px solid var(--line);color:var(--acc);font-weight:800;padding:8px 0;border-radius:8px;text-align:center;cursor:pointer;white-space:nowrap}
.ob:disabled{cursor:default}.ob.lk{color:var(--mut);background:#15181c}.ob.mine{border-color:var(--acc)}
.ob.sel{background:var(--acc);color:#111;border-color:var(--acc)}
.ob.win{border-color:var(--grn);background:#173d2b;color:var(--grn)}.ob.lose{opacity:.3}
.ob.boost,.opt.boost{border-color:#ff7a1a}.ob.boost{font-size:13px}.old{text-decoration:line-through;opacity:.55;font-size:11px;margin-right:2px;font-weight:600}
.ob.adm{color:var(--txt)}.ob.adm.lk{color:#ff8a8d}
button,.btn{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--card2);color:var(--txt);font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
.btn.pri{background:var(--acc);color:#111}.btn.ok{background:var(--acc2);color:#fff}.btn.no{background:var(--red);color:#fff}.btn.sm{padding:7px 10px;font-size:13px}.btn.full{width:100%}.btn.out{background:none;border:1px solid var(--line)}
input,select,textarea{font:inherit;width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.ck{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:14px;color:var(--txt)}.ck input{width:20px;height:20px;margin:1px 0 0;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;background:#12151a;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{position:relative;flex:1;max-width:160px;background:none;border-radius:0;padding:10px 4px 12px;color:var(--mut);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:20px}nav button.on{color:var(--acc)}
.nb{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 6px}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;background:none;padding:8px 10px;font-size:13px;color:var(--mut)}.seg button.on{background:var(--card2);color:var(--txt)}
.slipbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));width:calc(100% - 28px);max-width:612px;background:var(--acc);color:#111;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:800;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.5);border:0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.quick{display:flex;gap:6px;margin-top:8px}.quick button{flex:1;padding:8px 4px;font-size:13px}
.tbl{width:100%;border-collapse:collapse}.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}.tbl td:last-child{text-align:right}
.tk{border-left:4px solid var(--line)}.tk.won{border-left-color:var(--grn)}.tk.lost{border-left-color:var(--red)}.tk.open{border-left-color:var(--blue)}.tk.void,.tk.rejected,.tk.cashout{border-left-color:var(--mut)}
.tk.pending{background:#2a2410;border-color:var(--acc);border-left-color:var(--acc)}
.leg{display:grid;grid-template-columns:22px 1fr auto;gap:6px;padding:7px 0;border-top:1px solid var(--line);align-items:start}
.leg:first-child{border-top:0}
.pendbox{background:var(--acc);color:#111;font-weight:700;border-radius:10px;padding:11px 12px;display:flex;gap:10px;align-items:center;margin:10px 0}
.spin{width:18px;height:18px;border:3px solid rgba(0,0,0,.25);border-top-color:#111;border-radius:50%;animation:sp 0.9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:#ff8a8d;font-size:14px;margin-top:8px;min-height:1em}
.note{background:#16284a;color:#a9c7ff;border-radius:10px;padding:9px 12px;font-size:13px;margin-top:10px}
.warn{background:#3d1a1c;color:#ffb3b5;border-radius:10px;padding:9px 12px;font-size:13px;margin-top:10px}
.banner{background:#3d1a1c;color:#ffb3b5;border-radius:12px;padding:12px;margin-bottom:12px;font-weight:700;text-align:center}
.login{max-width:380px;margin:12vh auto 0}.logo{font-size:44px;text-align:center}
.optrow{display:grid;grid-template-columns:1fr 54px 70px 34px;gap:6px;margin-bottom:6px}.optrow input{padding:9px 7px}
.grow{display:grid;grid-template-columns:1fr 50px 62px 62px 34px;gap:5px;margin-bottom:6px}.grow input{padding:9px 6px}
.gh2{display:grid;grid-template-columns:1fr 50px 62px 62px 34px;gap:5px;font-size:11px;color:var(--mut);text-transform:uppercase;font-weight:700;margin-bottom:4px}
.oh2{display:grid;grid-template-columns:1fr 54px 70px 34px;gap:6px;font-size:11px;color:var(--mut);text-transform:uppercase;font-weight:700;margin-bottom:4px}
.grp{background:var(--card2);border-radius:10px;padding:10px;margin-top:8px}.grp input,.grp textarea{background:var(--card)}
.chk{width:100%;text-align:left;margin-top:6px;border:1px solid var(--line)}.chk.on{border-color:var(--grn);background:#173d2b;color:var(--grn)}
.lrow{background:var(--card2);border-radius:12px;padding:10px;margin-top:8px}.lrow.susp{outline:2px solid var(--red)}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.lcell .row{gap:4px}.lcell input{text-align:center;padding:8px 2px;font-weight:800}.lcell button{padding:8px 0;min-width:38px}
.tg{padding:6px 8px;font-size:13px;background:var(--card);border:1px solid var(--line)}.tg.on{background:var(--red);border-color:var(--red);color:#fff}.tg.bo.on{background:#ff7a1a;border-color:#ff7a1a}
.pend{border-color:var(--acc)}
.cd{font-variant-numeric:tabular-nums;color:var(--acc);font-weight:700}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--acc2);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.pos{color:var(--grn)}.neg{color:#ff8a8d}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi div{background:var(--card2);border-radius:10px;padding:10px}.kpi b{display:block;font-size:18px}
.chips{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}.chips button{padding:6px 10px;font-size:13px;border-radius:999px;white-space:nowrap}.chips button.on{background:var(--acc);color:#111}
</style>

<body>
<div id="app"><div class="empty">Načítám…</div></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>

<script type="module">
/* ================== NASTAVENÍ – VYPLŇ ================== */
const firebaseConfig = {
  apiKey: "AIzaSyB-S1-8YKW-FaeDWIwdotc-Z81gdeo0Gjs",
  authDomain: "riskobet-63c24.firebaseapp.com",
  projectId: "riskobet-63c24",
  storageBucket: "riskobet-63c24.firebasestorage.app",
  messagingSenderId: "208503709912",
  appId: "1:208503709912:web:3ce4e76847ad9d2d81b7ad"
};
const ADMIN_USER = "richard";      // přihlašovací jméno admina (musí sedět s firestore.rules)
const START_POINTS = 1000;         // startovní body (musí sedět s firestore.rules)
const DOMAIN = "sazkovka.app";     // jen technická koncovka pro Firebase
const APP_NAME = "Třídní sázkovka";
const AUTO_MS = 150000;
const MAX_LEGS = 8;
/* ====================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query, where, runTransaction, writeBatch, serverTimestamp, increment, Timestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const DEF_CFG = { approvalLimit:0, ntfyTopic:'', margin:0.08, bbMargin:0.15, cashout:true, cashMargin:0.10, dropEvery:0, dropPct:0.05, maxStake:0, maxWin:0, maxLegs:8, suspendAll:false };
const $app = document.getElementById('app'), $modal = document.getElementById('modal'), $sheet = document.getElementById('sheet');
const S = { user:null, profile:null, markets:[], myBets:[], allBets:[], users:[], cfg:{...DEF_CFG}, cfgLoaded:false,
  tab:'markets', adminSub:'events', feedFilter:'pending', authMode:'login', unsubs:[], registering:false, ctx:null,
  seen:new Set(), betsLoaded:false, slip:[], seenOdds:{}, slipAmt:'', slipSig:'' };
const WANT_ADMIN = new URLSearchParams(location.search).has('schvalit');

/* ================== POMOCNÉ ================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim().replace(/\s+/g,'.').replace(/[^a-z0-9._-]/g,'');
const emailOf = u => `${slug(u)}@${DOMAIN}`;
const isAdmin = () => !!S.user && S.user.email === emailOf(ADMIN_USER);
const fmtOdds = o => (o > 1) ? Number(o).toFixed(2).replace('.', ',') : '–';
const fmtN = n => Math.round(Number(n||0)).toLocaleString('cs-CZ');
const fmtS = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmtN(Math.abs(n));
const parseNum = v => parseFloat(String(v ?? '').replace(',', '.'));
const floor2 = x => Math.floor(x * 100 + 1e-7) / 100;
const ms = t => t?.toMillis ? t.toMillis() : null;
const fmtDate = t => { const m = ms(t); return m ? new Date(m).toLocaleString('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}) : ''; };
const toLocalInput = t => ms(t) ? new Date(ms(t) - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : '';
const M = id => S.markets.find(m => m.id === id);
const effStatus = m => (m.status === 'open' && ms(m.closesAt) && ms(m.closesAt) < Date.now()) ? 'closed' : m.status;
const isLive = m => ['open','closed'].includes(m.status);
const optAvail = (m, i) => { const o = m?.options?.[i]; return !!o && effStatus(m) === 'open' && !m.suspended && !S.cfg.suspendAll && !o.locked && o.odds > 1; };
const legTitle = m => m.kind === 'row' ? `${m.groupTitle} – ${m.rowLabel}` : m.title;
const leftMs = b => ms(b.createdAt) ? AUTO_MS - (Date.now() - ms(b.createdAt)) : AUTO_MS;
const betSt = b => (b.status === 'pending' && leftMs(b) <= 0) ? 'open' : b.status;
const possWin = b => Math.floor(b.amount * b.odds + 1e-9);
const effLimit = (k) => { const u = S.users.find(x => x.id === S.user?.uid) || S.profile || {}; return (u[k] > 0) ? u[k] : (S.cfg[k] || 0); };
const pct = f => Math.round((f || 0) * 1000) / 10;
const STATUS_TXT = { open:'Otevřeno', closed:'Uzavřeno', settled:'Vyhodnoceno', cancelled:'Zrušeno' };
const BET_TXT = { open:'Přijato', pending:'Čeká na schválení', won:'Výhra', lost:'Prohra', void:'Stornováno', rejected:'Zamítnuto', cashout:'Cash-out' };
const LEG_ICON = { open:'⏳', won:'✅', lost:'❌', void:'↩️' };

function toast(msg, bad){ const d=document.createElement('div'); d.className='toast'; if(bad) d.style.background='var(--red)'; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(), 2800); }
function openModal(html, ctx){ S.ctx = ctx || null; $sheet.innerHTML = html; $modal.classList.add('show'); }
function closeModal(){ $modal.classList.remove('show'); $sheet.innerHTML=''; S.ctx=null; render(); }
$modal.addEventListener('click', e => { if (e.target === $modal) closeModal(); });
const ls = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* ---- kurzy z pravděpodobnosti + kontrola surebetu ---- */
const oddsFromP = (p, m) => (p > 0 && p < 1) ? Math.max(1.01, floor2(1 / (p * (1 + m)))) : 0;
function surebetErr(kind, rows, opts){
  // rows: [{label, A:{odds,locked}, N:{odds,locked}}]  (tabulka)  /  options: [{label, odds, locked}] (jedna otázka)
  const av = o => o && !o.locked && o.odds > 1;
  if (kind === 'single') {
    const hi = rows.reduce((s,o) => s + (av(o) ? 1/o.odds : 1), 0);
    return hi < 1 - 1e-9 ? `Surebet! Součet 1/kurz všech možností je ${hi.toFixed(3)} (musí být ≥ 1). Sniž některé kurzy.` : '';
  }
  let sLo = 0, sHi = 0;
  for (const r of rows) {
    const hi = av(r.A) ? 1/r.A.odds : 1, lo = av(r.N) ? 1 - 1/r.N.odds : 0;
    if (lo > hi + 1e-9) return `Surebet u řádku „${r.label}“: 1/Ano + 1/Ne = ${(hi + 1 - lo).toFixed(3)} (musí být ≥ 1).`;
    sLo += lo; sHi += hi;
  }
  if (opts.exclusive) {
    if (sLo > 1 + 1e-9) return `Surebet! Kurzy na NE jsou dohromady moc vysoké (součet ${sLo.toFixed(3)} > 1). Sniž NE kurzy.`;
    if (!opts.nobody && sHi < 1 - 1e-9) return `Surebet! Součet 1/ANO je ${sHi.toFixed(3)} (musí být ≥ 1, když vždy někdo vyhraje).`;
  }
  return '';
}

/* ================== AUTH ================== */
function errTxt(e){
  const c = e?.code || '';
  if (c.includes('email-already-in-use')) return 'Tohle jméno už někdo má.';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) return 'Špatné jméno nebo heslo.';
  if (c.includes('weak-password')) return 'Heslo musí mít aspoň 6 znaků.';
  if (c.includes('permission-denied')) return 'Tohle teď nejde (sázky jsou zamčené, změnil se kurz nebo limit).';
  return e?.message || 'Něco se pokazilo.';
}
function renderLogin(){
  const reg = S.authMode === 'register';
  $app.innerHTML = `<div class="login">
    <div class="logo">🎲</div><h1 style="text-align:center">${esc(APP_NAME)}</h1>
    <div class="card">
      <div class="seg"><button class="${!reg?'on':''}" data-act="authmode" data-m="login">Přihlásit</button><button class="${reg?'on':''}" data-act="authmode" data-m="register">Nový účet</button></div>
      <label>Jméno</label><input id="lu" autocomplete="username" autocapitalize="none" placeholder="např. Honza">
      <label>Heslo</label><input id="lp" type="password" autocomplete="${reg?'new-password':'current-password'}" placeholder="min. 6 znaků">
      <button class="btn pri full" style="margin-top:14px" data-act="${reg?'register':'login'}">${reg?'Vytvořit účet':'Přihlásit se'}</button>
      <div class="err" id="lerr"></div>
    </div></div>`;
}
async function doLogin(register){
  const name = document.getElementById('lu').value.trim(), pw = document.getElementById('lp').value, $e = document.getElementById('lerr');
  if (!slug(name)) { $e.textContent = 'Zadej jméno.'; return; }
  $e.textContent = '';
  try {
    if (register) {
      S.registering = true;
      const cred = await createUserWithEmailAndPassword(auth, emailOf(name), pw);
      await setDoc(doc(db,'users',cred.user.uid), { name, username: slug(name), points: START_POINTS, createdAt: serverTimestamp() });
      S.registering = false;
    } else await signInWithEmailAndPassword(auth, emailOf(name), pw);
  } catch(e){ S.registering=false; $e.textContent = errTxt(e); }
}

onAuthStateChanged(auth, user => {
  S.unsubs.forEach(u => u()); S.unsubs = [];
  Object.assign(S, { user, profile:null, markets:[], myBets:[], allBets:[], users:[], seen:new Set(), betsLoaded:false, cfgLoaded:false });
  if (!user) { renderLogin(); return; }
  S.slip = ls.get('slip_' + user.uid) || []; S.seenOdds = {};
  if (isAdmin()) S.tab = 'admin';
  $app.innerHTML = '<div class="empty">Načítám…</div>';
  S.unsubs.push(onSnapshot(doc(db,'users',user.uid), snap => {
    if (!snap.exists()) {
      if (!S.registering) { const name = user.email.split('@')[0]; setDoc(doc(db,'users',user.uid), { name, username:name, points:START_POINTS, createdAt:serverTimestamp() }).catch(()=>{}); }
      return;
    }
    S.profile = { id: snap.id, ...snap.data() }; refresh();
  }));
  S.unsubs.push(onSnapshot(doc(db,'config','main'), snap => {
    S.cfg = { ...DEF_CFG, ...(snap.exists() ? snap.data() : {}) }; S.cfgLoaded = true;
    if (!snap.exists() && isAdmin()) setDoc(doc(db,'config','main'), DEF_CFG).catch(()=>{});
    refresh();
  }, () => {}));
  S.unsubs.push(onSnapshot(collection(db,'markets'), snap => {
    S.markets = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => (ms(b.createdAt)||Date.now()) - (ms(a.createdAt)||Date.now()) || (a.order??0) - (b.order??0));
    refresh();
  }));
  S.unsubs.push(onSnapshot(collection(db,'users'), snap => { S.users = snap.docs.map(d => ({ id:d.id, ...d.data() })); refresh(); }));
  const betsQ = isAdmin() ? collection(db,'bets') : query(collection(db,'bets'), where('uid','==',user.uid));
  S.unsubs.push(onSnapshot(betsQ, snap => {
    const all = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => (ms(b.createdAt)||Date.now()) - (ms(a.createdAt)||Date.now()));
    S.allBets = all; S.myBets = all.filter(b => b.uid === user.uid);
    if (isAdmin()) {
      const fresh = all.filter(b => betSt(b) === 'pending' && !S.seen.has(b.id));
      fresh.forEach(b => S.seen.add(b.id));
      if (S.betsLoaded && fresh.length) { toast(`⏳ Tiket ke schválení: ${fresh[0].name}`); try { navigator.vibrate?.([200,100,200]); } catch {} }
      housekeeping();
    }
    S.betsLoaded = true; refresh();
  }, e => console.error(e)));
});

// po změně dat: překresli stránku i otevřený tiket (bez ztráty rozepsaného)

/* ================== SKUPINY ================== */
function buildItems(markets){
  const groups = {}, items = [];
  for (const m of markets) {
    if (m.kind === 'row') {
      if (!groups[m.grp]) { groups[m.grp] = { type:'g', id:m.grp, title:m.groupTitle, category:m.category, closesAt:m.closesAt, ev:m.ev, bb:m.bb, exclusive:m.exclusive, nobody:m.nobody, rows:[] }; items.push(groups[m.grp]); }
      groups[m.grp].rows.push(m);
    } else items.push({ type:'s', id:m.id, m, rows:[m] });
  }
  Object.values(groups).forEach(g => g.rows.sort((a,b) => (a.order??0) - (b.order??0)));
  return items;
}
function itemStatus(it){
  const ss = it.rows.map(effStatus);
  return ss.includes('open') ? 'open' : ss.includes('closed') ? 'closed' : 'done';
}
const groupById = gid => buildItems(S.markets).find(i => i.type==='g' && i.id===gid);
const itemOf = m => m.kind === 'row' ? groupById(m.grp) : { type:'s', id:m.id, m, rows:[m] };
const pendingBets = () => S.allBets.filter(b => betSt(b) === 'pending');

const inSlip = (mid, i) => S.slip.some(s => s.m === mid && s.i === i);
function oddsInner(o){ return o.boostFrom > 1 ? `<span class="old">${fmtOdds(o.boostFrom)}</span>🔥${fmtOdds(o.odds)}` : fmtOdds(o.odds); }
function oddsBtn(m, i, adminMode, mineIdx){

}

function groupCard(g, adminMode){

}
function singleCard(it, adminMode){

    return `<button class="${cls}" ${attrs}><span>${esc(o.label)}</span><span class="o">${right}</span></button>`;

    ${done.length?`<h2>Vyhodnocené</h2>${done.map(i=>itemCard(i)).join('')}`:''}`;
}

/* ================== TIKET (SLIP) ================== */
function comboErr(m, i, slip){
  const o = m.options[i];
  if (slip.length >= Math.min(MAX_LEGS, S.cfg.maxLegs || MAX_LEGS)) return `Na tiketu může být max. ${Math.min(MAX_LEGS, S.cfg.maxLegs || MAX_LEGS)} sázek.`;
  if (o.boostFrom > 1 && slip.length) return 'Zvýšený kurz 🔥 jde vsadit jen samostatně.';
  for (const s of slip) {
    const lm = M(s.m); if (!lm) continue;
    if (lm.options[s.i]?.boostFrom > 1) return 'Na tiketu je zvýšený kurz 🔥 – ten jde vsadit jen samostatně.';
    if (lm.ev === m.ev && !(lm.bb && m.bb)) return 'Tyhle sázky nejde kombinovat na jeden tiket.';
    if (lm.grp === m.grp && m.exclusive && (i === 0 || s.i === 0)) return 'Tady může platit ANO jen u jednoho – ANO nejde kombinovat s dalším řádkem téže sázky.';
  }
  return '';
}
function pick(mid, i){
  const m = M(mid); if (!m || !optAvail(m, i)) return;
  const idx = S.slip.findIndex(s => s.m === mid);
  if (idx >= 0 && S.slip[idx].i === i) { S.slip.splice(idx, 1); }
  else {
    const rest = S.slip.filter(s => s.m !== mid);
    const err = comboErr(m, i, rest);
    if (err) { toast(err, true); return; }
    S.slip = [...rest, { m: mid, i }];
    S.seenOdds[`${mid}:${i}`] = m.options[i].odds;
  }
  ls.set('slip_' + S.user.uid, S.slip); render();
}
function slipData(){
  const legs = S.slip.map(s => {
    const m = M(s.m); if (!m) return { s, gone:true };
    const o = m.options[s.i], key = `${s.m}:${s.i}`;
    if (S.seenOdds[key] === undefined) S.seenOdds[key] = o.odds;
    return { s, m, o, key, avail: optAvail(m, s.i), odds: o.odds, seen: S.seenOdds[key], changed: S.seenOdds[key] !== o.odds };
  });
  const ok = legs.filter(l => !l.gone && l.avail);
  const prod = ok.reduce((p,l) => p * l.odds, 1);
  const evs = ok.map(l => l.m.ev), bb = new Set(evs).size < evs.length;
  const total = ok.length ? (bb ? floor2(1 + (prod - 1) * (1 - S.cfg.bbMargin)) : floor2(prod)) : 0;
  return { legs, ok, prod, bb, total, bad: legs.some(l => l.gone || !l.avail), changed: legs.some(l => l.changed && !l.gone) };
}
function renderSlip(){
  const d = slipData();
  const sig = JSON.stringify([d.legs.map(l => [l.s.m, l.s.i, l.odds, l.avail, l.seen]), d.total, S.profile?.points, S.cfg.suspendAll]);
  if (S.ctx?.type === 'slip' && sig === S.slipSig && $sheet.querySelector('#amt')) { updSlipTotals(); return; }
  S.slipSig = sig;
  if (!S.slip.length) { closeModal(); return; }
  const kind = d.ok.length > 1 ? (d.bb ? '<span class="badge bb">🧩 Betbuilder</span>' : '<span class="badge">AKO</span>') : '<span class="badge">SÓLO</span>';
  const legsHtml = d.legs.map(l => {
    if (l.gone) return `<div class="leg"><span>⚠️</span><div class="mut">Sázka už neexistuje</div><button class="btn sm out" data-act="unpick" data-m="${l.s.m}">✕</button></div>`;
    const ch = l.changed ? `<span class="${l.odds > l.seen ? 'pos' : 'neg'}" style="font-size:12px">${fmtOdds(l.seen)} → </span>` : '';
    return `<div class="leg"><span>${l.avail ? '🎯' : '🔒'}</span><div><div class="mut">${esc(legTitle(l.m))}</div><div class="b">${esc(l.o.label)} ${l.avail ? `@ ${ch}${fmtOdds(l.odds)}` : '<span class="neg">– teď nejde vsadit</span>'}</div></div><button class="btn sm out" data-act="unpick" data-m="${l.s.m}">✕</button></div>`;
  }).join('');
  const lowOdds = d.ok.length && d.total < 1.01;
  openModal(`<div class="row sp"><h1 style="margin:0">Tiket</h1><div class="row gap4">${kind}<button class="btn sm out" data-act="slipclear">Vymazat</button></div></div>
    <div style="margin-top:10px">${legsHtml}</div>
    ${d.bb ? `<div class="note">🧩 Betbuilder – kombinace z jedné události, kurz je upravený.</div>` : ''}
    <label>Vklad (máš ${fmtN(S.profile.points)} b)</label>
    <input id="amt" type="number" inputmode="numeric" min="1" step="1" placeholder="0" value="${esc(S.slipAmt)}">
    <div class="quick"><button data-act="q" data-v="10">10</button><button data-act="q" data-v="50">50</button><button data-act="q" data-v="100">100</button><button data-act="q" data-v="250">250</button><button data-act="q" data-v="all">Max</button></div>
    <div class="row sp" style="margin-top:14px"><span class="mut">Celkový kurz</span><span class="b">${d.total>1?fmtOdds(d.total):'–'}</span></div>
    <div class="row sp" style="margin-top:4px"><span class="mut">Možná výhra</span><span class="b" id="pw" style="font-size:20px;color:var(--acc)">0 b</span></div>
    <div id="slipmsg"></div>
    <div class="err" id="serr">${lowOdds ? 'Celkový kurz je moc nízký, tuhle kombinaci nejde vsadit.' : d.bad ? 'Některá sázka teď nejde vsadit – odeber ji.' : S.cfg.suspendAll ? 'Sázení je pozastavené.' : ''}</div>
    <div class="row" style="margin-top:8px"><button class="btn full" data-act="close">Zpět</button>
    ${d.changed ? `<button class="btn pri full" data-act="acceptodds">Přijmout nové kurzy</button>` : `<button class="btn pri full" data-act="place" ${d.bad||lowOdds||S.cfg.suspendAll?'disabled':''}>Vsadit</button>`}</div>`, { type:'slip', keep:true });
  const $a = document.getElementById('amt');
  $a.addEventListener('input', () => { S.slipAmt = $a.value; updSlipTotals(); });
  updSlipTotals();
}
function updSlipTotals(){
  const d = slipData(), a = parseInt(S.slipAmt) || 0, win = Math.floor(a * d.total + 1e-9);
  const pw = document.getElementById('pw'); if (pw) pw.textContent = fmtN(win) + ' b';
  const msgs = [], ms_ = effLimit('maxStake'), mw = effLimit('maxWin');
  if (ms_ && a > ms_) msgs.push(`<div class="warn">Max. vklad je ${fmtN(ms_)} b.</div>`);
  if (mw && win > mw) msgs.push(`<div class="warn">Max. výhra na tiket je ${fmtN(mw)} b.</div>`);
  const m = document.getElementById('slipmsg'); if (m) m.innerHTML = msgs.join('');
}

async function placeBet(){
  const $e = document.getElementById('serr'), d = slipData();
  const amount = parseInt(S.slipAmt);
  if (!amount || amount < 1) { $e.textContent = 'Zadej vklad.'; return; }
  if (amount > S.profile.points) { $e.textContent = 'Tolik bodů nemáš.'; return; }
  const msx = effLimit('maxStake'), mw = effLimit('maxWin');
  if (msx && amount > msx) { $e.textContent = `Max. vklad je ${fmtN(msx)} b.`; return; }
  if (mw && amount * d.total > mw + 0.5) { $e.textContent = `Max. výhra na tiket je ${fmtN(mw)} b.`; return; }
  const btn = $sheet.querySelector('[data-act="place"]'); if (btn) btn.disabled = true;
  const seen = { ...S.seenOdds }, slip = [...S.slip];
  const bref = doc(collection(db,'bets'));
  try {
    const res = await runTransaction(db, async tx => {
      const uref = doc(db,'users',S.user.uid), cref = doc(db,'config','main');
      const us = await tx.get(uref), cs = await tx.get(cref);
      const msnaps = []; for (const s of slip) msnaps.push(await tx.get(doc(db,'markets',s.m)));
      const c = { ...DEF_CFG, ...(cs.exists() ? cs.data() : {}) }, pts = us.data().points;
      if (c.suspendAll) throw new Error('Sázení je pozastavené.');
      if (amount > pts) throw new Error('Nemáš dost bodů.');
      const legs = [], mUpd = [];
      slip.forEach((s, k) => {
        const sn = msnaps[k]; if (!sn.exists()) throw new Error('Některá sázka už neexistuje.');
        const m = { id: sn.id, ...sn.data() }, o = m.options[s.i];
        if (m.status !== 'open' || m.suspended || o.locked || !(o.odds > 1) || (ms(m.closesAt) && ms(m.closesAt) < Date.now())) throw new Error(`„${legTitle(m)}“ teď nejde vsadit.`);
        if (o.odds !== seen[`${s.m}:${s.i}`]) { const e = new Error('ODDS'); e.odds = true; throw e; }
        legs.push({ m: m.id, i: s.i, o: o.odds, e: m.ev, g: m.grp, lbl: o.label, t: legTitle(m), st: 'open' });
        // počítadlo vsazených bodů + automatický pokles kurzu
        const tl = o.tl || 0; let odds = o.odds;
        if (c.dropEvery > 0 && c.dropPct > 0) { const n = Math.floor((tl + amount) / c.dropEvery) - Math.floor(tl / c.dropEvery); if (n > 0) odds = Math.max(1.01, floor2(odds * Math.pow(1 - c.dropPct, n))); }
        mUpd.push([sn.ref, m.options.map((x, k2) => k2 === s.i ? { ...x, tl: tl + amount, odds } : x)]);
      });
      const prod = legs.reduce((p,l) => p * l.o, 1), evs = legs.map(l => l.e), bb = new Set(evs).size < evs.length;
      const total = bb ? floor2(1 + (prod - 1) * (1 - c.bbMargin)) : floor2(prod);
      if (total < 1.01) throw new Error('Kurz je moc nízký.');
      const status = (c.approvalLimit > 0 && amount * total > c.approvalLimit) ? 'pending' : 'open';
      tx.update(uref, { points: pts - amount });
      tx.set(bref, { uid:S.user.uid, name:S.profile.name, no: 'T' + Math.random().toString(36).slice(2,8).toUpperCase(), legs, mids: legs.map(l=>l.m), ev: evs, grp: legs.map(l=>l.g), odds: total, bb, amount, status, payout: 0, createdAt: serverTimestamp() });
      mUpd.forEach(([ref, options]) => tx.update(ref, { options }));
      return { status, total, legs };
    });
    S.slip = []; S.slipAmt = ''; ls.set('slip_' + S.user.uid, []);
    if (res.status === 'pending') {
      ntfy('🎲 Tiket ke schválení', `${S.profile.name}: ${res.legs.map(l => `${l.t} – ${l.lbl}`).join(' + ')}\nKurz ${fmtOdds(res.total)} · vklad ${fmtN(amount)} b → výhra ${fmtN(amount*res.total)} b`);
      S.ctx = { type:'wait', keep:true, betId: bref.id }; renderWait();
    } else { closeModal(); toast('Tiket přijat ✅'); }
  } catch(e){
    if (e.odds) { if ($e) $e.textContent = 'Kurz se mezitím změnil – zkontroluj a potvrď nové kurzy.'; S.slipSig = ''; renderSlip(); return; }
    if ($e) $e.textContent = e.code ? errTxt(e) : e.message; if (btn) btn.disabled = false;
  }
}
function renderWait(){
  const b = S.myBets.find(x => x.id === S.ctx.betId), st = b ? betSt(b) : 'pending';
  let inner;
  if (st === 'pending') inner = `<div class="pendbox"><div class="spin"></div>Tiket schvaluje bookmaker. Počkej prosím.</div>`;
  else if (st === 'rejected') inner = `<div class="warn" style="font-size:15px;font-weight:700">❌ Bookmaker tiket zamítl. Body ti byly vráceny.</div>`;
  else inner = `<div class="note" style="background:#173d2b;color:var(--grn);font-size:15px;font-weight:700">✅ Tiket přijat!</div>`;
  $sheet.innerHTML = `<h1>Tiket</h1>${inner}${b ? ticketCard(b, false, true) : ''}<button class="btn full" style="margin-top:8px" data-act="close">${st === 'pending' ? 'Zavřít (tiket čeká dál)' : 'Hotovo'}</button>`;
  $modal.classList.add('show');
}

/* ================== TIKETY ================== */
function cashValue(b){
  if (!S.cfg.cashout || S.cfg.suspendAll || b.uid !== S.user?.uid) return 0;
  const st = betSt(b); if (st !== 'open') return 0;
  if (!b.legs.some(l => l.st === 'open') || b.legs.some(l => l.st === 'lost')) return 0;
  let den = 1;
  for (const l of b.legs) {
    if (l.st === 'won') continue;
    if (l.st === 'void') { den *= l.o; continue; }
    const m = M(l.m); if (!m || !optAvail(m, l.i)) return 0;
    den *= m.options[l.i].odds;
  }
  return Math.floor(b.amount * b.odds / den * (1 - S.cfg.cashMargin) + 1e-9);
}
function ticketCard(b, showName, plain){
  const st = betSt(b);

async function cashOut(bid, shown){
  if (!confirm(`Vyplatit tiket teď za ${fmtN(shown)} b?`)) return;
  try {
    const v = await runTransaction(db, async tx => {
      const bref = doc(db,'bets',bid), uref = doc(db,'users',S.user.uid), cref = doc(db,'config','main');
      const bs = await tx.get(bref), us = await tx.get(uref), cs = await tx.get(cref);
      const b = bs.data(), c = { ...DEF_CFG, ...(cs.exists() ? cs.data() : {}) };
      if (!c.cashout || c.suspendAll) throw new Error('Cash-out teď nejde.');
      if (!(b.status === 'open' || (b.status === 'pending' && leftMs({createdAt:b.createdAt}) <= 0))) throw new Error('Cash-out teď nejde.');
      let den = 1;
      for (const l of b.legs) {
        if (l.st === 'won') continue; if (l.st === 'void') { den *= l.o; continue; }
        if (l.st === 'lost') throw new Error('Tiket už prohrál.');
        const ms_ = await tx.get(doc(db,'markets',l.m)), m = ms_.data(), o = m.options[l.i];
        if (m.status !== 'open' || m.suspended || o.locked || !(o.odds > 1) || (ms(m.closesAt) && ms(m.closesAt) < Date.now())) throw new Error('Cash-out je teď zamčený.');
        den *= o.odds;
      }
      const val = Math.floor(b.amount * b.odds / den * (1 - c.cashMargin) + 1e-9);
      if (val < 1) throw new Error('Cash-out teď nejde.');
      if (val < shown) throw new Error(`Hodnota se změnila na ${fmtN(val)} b – zkus to znovu.`);
      tx.update(bref, { status:'cashout', payout: val, cashedAt: serverTimestamp() });
      tx.update(uref, { points: us.data().points + val, lastCash: bid });
      return val;
    });
    toast(`Vyplaceno ${fmtN(v)} b 💸`);
  } catch(e){ toast(e.code ? errTxt(e) : e.message, true); }
}

/* ---- riziko ---- */
function viewRisk(){
  const live = S.allBets.filter(b => ['open','pending'].includes(b.status));
  const items = buildItems(S.markets).filter(i => itemStatus(i) !== 'done');
  if (!items.length) return '<div class="empty">Žádné aktivní sázky.</div>';
  const singles = live.filter(b => b.legs.length === 1);
  return items.map(it => {
    const ids = new Set(it.rows.map(r=>r.id));
    const sb = singles.filter(b => ids.has(b.legs[0].m)), stake = sb.reduce((s,b)=>s+b.amount,0);
    const pay = (mid, i) => sb.filter(b => b.legs[0].m === mid && b.legs[0].i === i && b.legs[0].st === 'open').reduce((s,b)=>s+possWin(b),0);
    let scen = [];
    if (it.type === 's') scen = it.m.options.map((o,i) => [o.label, stake - pay(it.m.id, i)]);
    else if (it.exclusive) {
      const rows = it.rows.filter(isLive);
      scen = rows.map(r => [`${r.rowLabel} ANO`, stake - pay(r.id,0) - rows.filter(x=>x.id!==r.id).reduce((s,x)=>s+pay(x.id,1),0)]);
      if (it.nobody) scen.push(['Nikdo', stake - rows.reduce((s,x)=>s+pay(x.id,1),0)]);
    } else scen = it.rows.filter(isLive).flatMap(r => { const st = sb.filter(b=>b.legs[0].m===r.id).reduce((s,b)=>s+b.amount,0); return [[`${r.rowLabel} ANO`, st - pay(r.id,0)], [`${r.rowLabel} NE`, st - pay(r.id,1)]]; });
    const ako = live.filter(b => b.legs.length > 1 && b.legs.some(l => ids.has(l.m) && l.st === 'open'));
    const worst = scen.length ? Math.min(...scen.map(s=>s[1])) : 0;
    scen.sort((a,b) => a[1] - b[1]);
    return `<div class="card"><div class="row sp"><span class="b">${esc(it.type==='g'?it.title:it.m.title)}</span><span class="b ${worst<0?'neg':'pos'}">${fmtS(worst)}</span></div>
      <div class="mut">Sólo vsazeno ${fmtN(stake)} b · nejhorší výsledek ${fmtS(worst)} b</div>
      <table class="tbl" style="margin-top:6px">${scen.slice(0,12).map(([l,v]) => `<tr><td>${esc(l)}</td><td class="b ${v<0?'neg':'pos'}">${fmtS(v)} b</td></tr>`).join('')}</table>
      ${ako.length?`<div class="note">AKO/BB tiketů s touto sázkou: ${ako.length} · max. výplata ${fmtN(ako.reduce((s,b)=>s+possWin(b),0))} b</div>`:''}</div>`;
  }).join('');
}

async function settleMarkets(entries){
  const res = Object.fromEntries(entries.map(e => [e.mid, e.win])), ids = entries.map(e => e.mid), found = new Map();
  for (let i = 0; i < ids.length; i += 30) { const s = await getDocs(query(collection(db,'bets'), where('mids','array-contains-any', ids.slice(i,i+30)))); s.forEach(x => found.set(x.id, x)); }
  const ops = [], add = {}; let n = 0;
  found.forEach(s => {
    const b = s.data(); if (!['open','pending'].includes(b.status)) return; n++;
    const legs = b.legs.map(l => (l.m in res && l.st === 'open') ? { ...l, st: res[l.m] === null ? 'void' : (l.i === res[l.m] ? 'won' : 'lost') } : l);
    let upd = { legs };
    if (legs.some(l => l.st === 'lost')) upd = { legs, status:'lost', payout:0 };
    else if (legs.every(l => ['won','void'].includes(l.st))) {
      if (legs.every(l => l.st === 'void')) { upd = { legs, status:'void', payout:b.amount }; add[b.uid] = (add[b.uid]||0) + b.amount; }
      else { const vd = legs.filter(l => l.st === 'void').reduce((p,l) => p * l.o, 1), p = Math.floor(b.amount * Math.max(1, b.odds / vd) + 1e-9); upd = { legs, status:'won', payout:p }; add[b.uid] = (add[b.uid]||0) + p; }
    } else if (b.status === 'pending' && leftMs(b) <= 0) upd.status = 'open';
    ops.push([s.ref, upd]);
  });
  Object.entries(add).forEach(([uid,p]) => ops.push([doc(db,'users',uid), { points: increment(p) }]));
  entries.forEach(e => ops.push([doc(db,'markets',e.mid), { status: e.win === null ? 'cancelled' : 'settled', winnerIndex: e.win, settledAt: serverTimestamp() }]));
  for (let i = 0; i < ops.length; i += 450) { const bt = writeBatch(db); ops.slice(i,i+450).forEach(([r,d]) => bt.update(r,d)); await bt.commit(); }
  return n;
}

async function saveLive(){

/* ---- hráči ---- */
function openUserBets(uid){ const u = S.users.find(x=>x.id===uid), bs = S.allBets.filter(b=>b.uid===uid);
  openModal(`<h1>${esc(u.name)}</h1>${bs.length?bs.map(b=>ticketCard(b, false, true)).join(''):'<div class="empty">Žádné tikety.</div>'}<button class="btn full" data-act="close">Zavřít</button>`); }
function openPoints(uid){ const u = S.users.find(x=>x.id===uid);
  openModal(`<h1>Body – ${esc(u.name)}</h1><div class="mut">Aktuálně ${fmtN(u.points)} b</div>
    <label>Kolik bodů?</label><input id="pa" type="number" inputmode="numeric" placeholder="100">
    <div class="row" style="margin-top:12px"><button class="btn no full" data-act="padj" data-s="-1">− Odebrat</button><button class="btn ok full" data-act="padj" data-s="1">+ Přidat</button></div>
    <button class="btn full" style="margin-top:8px" data-act="close">Zavřít</button>`, { uid, keep:true }); }
function openLimits(uid){ const u = S.users.find(x=>x.id===uid);
  openModal(`<h1>Limity – ${esc(u.name)}</h1><div class="mut">0 = použije se výchozí limit z Nastavení.</div>
    <label>Max. vklad na tiket</label><input id="ul_s" type="number" inputmode="numeric" value="${u.maxStake||0}">
    <label>Max. výhra na tiket</label><input id="ul_w" type="number" inputmode="numeric" value="${u.maxWin||0}">
    <div class="row" style="margin-top:12px"><button class="btn full" data-act="close">Zrušit</button><button class="btn pri full" data-act="ulsave">Uložit</button></div>`, { uid, keep:true }); }

/* ================== EVENTY ================== */
document.addEventListener('input', e => {
  if (e.target.classList.contains('rp')) rowRecalc(e.target.closest('.grow'));
  if (e.target.classList.contains('op')) { const r = e.target.closest('.optrow'), p = parseNum(e.target.value)/100; if (p > 0 && p < 1) r.querySelector('.oo').value = fmtOdds(oddsFromP(p, S.cfg.margin)); }
});
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const a = t.dataset.act, d = t.dataset;
  switch (a) {
    case 'authmode': S.authMode = d.m; renderLogin(); break;
    case 'login': doLogin(false); break;
    case 'register': doLogin(true); break;
    case 'logout': if (confirm('Odhlásit se?')) signOut(auth); break;
    case 'tab': S.tab = d.t; render(); window.scrollTo(0,0); break;
    case 'asub': S.adminSub = d.s; render(); break;
    case 'ffilter': S.feedFilter = d.f; render(); break;
    case 'close': closeModal(); break;
    // tiket
    case 'pick': pick(d.m, +d.i); break;
    case 'unpick': S.slip = S.slip.filter(s => s.m !== d.m); ls.set('slip_' + S.user.uid, S.slip); S.slipSig = ''; if (S.slip.length) renderSlip(); else closeModal(); render(); break;
    case 'slipopen': S.slipSig = ''; renderSlip(); break;
    case 'slipclear': S.slip = []; ls.set('slip_' + S.user.uid, []); closeModal(); break;
    case 'acceptodds': S.slip.forEach(s => { const m = M(s.m); if (m) S.seenOdds[`${s.m}:${s.i}`] = m.options[s.i].odds; }); S.slipSig = ''; renderSlip(); break;
    case 'q': { const $a = document.getElementById('amt'); let v = d.v === 'all' ? S.profile.points : +d.v; const mx = effLimit('maxStake'); if (mx) v = Math.min(v, mx); $a.value = v; S.slipAmt = String(v); updSlipTotals(); break; }
    case 'place': placeBet(); break;
    case 'cash': cashOut(d.b, +d.v); break;
    case 'share': shareTicket(d.b); break;
    // admin – tikety
    case 'bapprove': approve(d.b); break;
    case 'breject': if (confirm('Zamítnout tiket a vrátit body?')) refundBet(d.b, 'rejected'); break;
    case 'storno': if (confirm('Stornovat tiket a vrátit hráči vklad?')) refundBet(d.b, 'void'); break;
    case 'suspall': try { await updateDoc(doc(db,'config','main'), { suspendAll: !S.cfg.suspendAll }); toast(S.cfg.suspendAll ? 'Sázení obnoveno ▶' : 'Vše pozastaveno ⏸'); } catch(err){ toast(errTxt(err), true); } break;
    // admin – sázky
    case 'newpick': openPick(); break;
    case 'gnew': openGroupForm(); break;
    case 'snew': openSingleForm(); break;
    case 'live': openLive(M(d.m)); break;
    case 'lstep': { const inp = t.parentElement.querySelector('.lo'), v = parseNum(inp.value) || 1.5, nv = Math.max(1.01, floor2(v + (+d.d) * stepOf(v))); inp.value = fmtOdds(nv); break; }
    case 'ltog': { const k = d.k;
      if (k === 'susp') { const r = t.closest('.lrow'), on = !r.dataset.susp; r.dataset.susp = on ? 1 : ''; r.classList.toggle('susp', on); t.classList.toggle('on', on); t.textContent = on ? '⏸ Pozastaveno' : '⏸ Pozastavit'; }
      else { const c = t.closest('.lcell');
        if (k === 'lock') { const on = !c.dataset.lock; c.dataset.lock = on ? 1 : ''; t.classList.toggle('on', on); }
        else { const on = !c.dataset.boost, inp = c.querySelector('.lo'); if (on) { c.dataset.boost = parseNum(inp.value) || ''; toast('🔥 Teď kurz zvyš a ulož'); } else { if (c.dataset.boost) inp.value = fmtOdds(parseNum(c.dataset.boost)); c.dataset.boost = ''; } t.classList.toggle('on', on); } }
      break; }
    case 'lsave': saveLive(); break;
    case 'isusp': { const it = itemFromKey(d); try { const bt = writeBatch(db); it.rows.filter(isLive).forEach(r => bt.update(doc(db,'markets',r.id), { suspended: d.v === '1' })); await bt.commit(); toast(d.v === '1' ? 'Pozastaveno ⏸' : 'Obnoveno ▶'); } catch(err){ toast(errTxt(err), true); } break; }
    case 'istatus': { const it = itemFromKey(d); try { const bt = writeBatch(db); it.rows.filter(isLive).forEach(r => bt.update(doc(db,'markets',r.id), { status: d.s })); await bt.commit(); toast(d.s === 'closed' ? 'Uzavřeno' : 'Otevřeno'); } catch(err){ toast(errTxt(err), true); } break; }
    case 'isettle': openSettle(itemFromKey(d)); break;
    case 'iedit': { const it = itemFromKey(d); it.type === 'g' ? openGroupForm(it.id) : openSingleForm(it.id); break; }
    case 'idup': { const it = itemFromKey(d); it.type === 'g' ? openGroupForm(it.id, true) : openSingleForm(it.id, true); break; }
    case 'icancel': { const it = itemFromKey(d); if (!confirm('Zrušit sázku? Tikety na ni budou vráceny (u AKO se tahle část nepočítá).')) break;
      try { const n = await settleMarkets(it.rows.filter(isLive).map(r => ({ mid:r.id, win:null }))); toast(`Zrušeno (${n} tiketů)`); } catch(err){ toast(errTxt(err), true); } break; }
    case 'idel': { const it = itemFromKey(d); if (!confirm('Smazat sázku z přehledu? (tikety zůstanou)')) break;
      try { const bt = writeBatch(db); it.rows.forEach(r => bt.delete(doc(db,'markets',r.id))); await bt.commit(); } catch(err){ toast(errTxt(err), true); } break; }
    case 'win': { const m = M(S.ctx.mid); if (!confirm(`Výsledek: „${m.options[+d.i].label}"?`)) break;
      try { const n = await settleMarkets([{ mid:m.id, win:+d.i }]); closeModal(); toast(`Vyhodnoceno (${n} tiketů)`); } catch(err){ toast(errTxt(err), true); } break; }
    case 'gtog': t.classList.toggle('on'); break;
    case 'gsettlego': { const g = groupById(S.ctx.gid), yes = new Set([...$sheet.querySelectorAll('.chk.on')].map(b => b.dataset.m)), live = g.rows.filter(isLive);
      if (g.exclusive && yes.size > 1 && !confirm('Tahle tabulka má mít ANO jen u jednoho. Opravdu víc?')) break;
      const names = live.filter(r => yes.has(r.id)).map(r => r.rowLabel);
      if (!confirm(names.length ? `ANO: ${names.join(', ')}. Ostatní NE. Potvrdit?` : 'Všude NE. Potvrdit?')) break;
      try { const n = await settleMarkets(live.map(r => ({ mid:r.id, win: yes.has(r.id) ? 0 : 1 }))); closeModal(); toast(`Vyhodnoceno (${n} tiketů)`); } catch(err){ toast(errTxt(err), true); } break; }
    // formuláře
    case 'rowdel': t.closest('.grow,.optrow').remove(); break;
    case 'gaddone': document.getElementById('grows').insertAdjacentHTML('beforeend', gRowHtml()); break;
    case 'gaddnames': gAdd(document.getElementById('f_names').value.split(/\n|,/).map(s=>s.trim())); document.getElementById('f_names').value=''; break;
    case 'gaddplayers': gAdd(S.users.filter(u=>u.id!==S.user.uid).sort((a,b)=>a.name.localeCompare(b.name,'cs')).map(u=>u.name)); break;
    case 'gaddnums': { const f = parseInt(document.getElementById('f_from').value), to = parseInt(document.getElementById('f_to').value);
      if (isNaN(f)||isNaN(to)||to<f||to-f>100) { toast('Zadej od a do', true); break; } gAdd(Array.from({length:to-f+1},(_,k)=>String(f+k))); break; }
    case 'geven': { const tot = parseNum(document.getElementById('f_tot').value) || 100, rows = [...$sheet.querySelectorAll('#grows .grow')].filter(r => !r.dataset.done);
      if (!rows.length) { toast('Nejdřív přidej řádky', true); break; } rows.forEach(r => { r.querySelector('.rp').value = String(Math.round(tot / rows.length * 10) / 10).replace('.', ','); rowRecalc(r); }); break; }
    case 'gsave': saveGroup(); break;
    case 'oaddone': document.getElementById('orows').insertAdjacentHTML('beforeend', oRowHtml()); break;
    case 'oaddnums': { const f = parseInt(document.getElementById('f_from').value), to = parseInt(document.getElementById('f_to').value);
      if (isNaN(f)||isNaN(to)||to<f||to-f>39) { toast('Zadej od a do (max 40)', true); break; } oAdd(Array.from({length:to-f+1},(_,k)=>String(f+k))); break; }
    case 'oaddplayers': oAdd(S.users.filter(u=>u.id!==S.user.uid).sort((a,b)=>a.name.localeCompare(b.name,'cs')).map(u=>u.name)); break;
    case 'ssave': saveSingle(); break;
    // hráči
    case 'ubets': openUserBets(d.u); break;
    case 'upts': openPoints(d.u); break;
    case 'ulim': openLimits(d.u); break;
    case 'ulsave': try { await updateDoc(doc(db,'users',S.ctx.uid), { maxStake: Math.max(0, parseInt(document.getElementById('ul_s').value)||0), maxWin: Math.max(0, parseInt(document.getElementById('ul_w').value)||0) }); closeModal(); toast('Limity uloženy'); } catch(err){ toast(errTxt(err), true); } break;
    case 'padj': { const v = parseInt(document.getElementById('pa').value); if (!v||v<1) break;
      try { await updateDoc(doc(db,'users',S.ctx.uid), { points: increment(v * +d.s) }); closeModal(); toast('Body upraveny'); } catch(err){ toast(errTxt(err), true); } break; }
    // nastavení
    case 'cgen': document.getElementById('s_nt').value = 'sazkovka-' + Math.random().toString(36).slice(2,10); break;
    case 'csave': saveSettings(); break;
    case 'ctest': { const topic = document.getElementById('s_nt').value.trim(); if (!topic) { toast('Nejdřív vyplň téma', true); break; }
      const old = S.cfg.ntfyTopic; S.cfg.ntfyTopic = topic; await ntfy('🎲 Test', 'Notifikace ze sázkovky fungují ✅'); S.cfg.ntfyTopic = old; toast('Odesláno – mrkni do ntfy'); break; }
  }
});
document.addEventListener('keydown', e => { if (e.key==='Enter' && !S.user && document.getElementById('lp')) doLogin(S.authMode==='register'); });
setInterval(() => { if (S.user && S.profile && !$modal.classList.contains('show')) render(); }, 30000);

/* ---- PWA manifest (ikona na ploše) ---- */
try {
  const mf = { name: APP_NAME, short_name: 'Sázkovka', start_url: location.pathname + location.search, display: 'standalone', background_color: '#0e1013', theme_color: '#0e1013',
    icons: [{ src: new URL('icon.png', location.href).href, sizes: '512x512', type: 'image/png' }] };
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type:'application/manifest+json' })); document.head.appendChild(l);
} catch {}
</script>
</body>
</html>
