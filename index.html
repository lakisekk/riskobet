:root{
  --bg:#000;--card:#131311;--card2:#1e1e1b;--card3:#2a2a26;--line:#2c2c28;
  --txt:#f5f3ea;--mut:#9d9b8f;--acc:#ffd400;--ink:#0b0a00;
  --grn:#3ddc84;--acc2:#1f9d57;--red:#ff5449;--blue:#6aa8ff;--org:#ff8a1f;
  --rs:9px;--rm:14px;--rl:22px;
  --ff:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.42 var(--ff);font-stretch:100%;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
#app{max-width:680px;margin:0 auto;padding:0 14px calc(104px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
h1{font-size:23px;line-height:1.15;margin:4px 0 14px;font-weight:800;font-stretch:82%;letter-spacing:-.01em}
h2{font-size:19px;line-height:1.2;margin:24px 0 10px;font-weight:800;font-stretch:80%;color:var(--txt);display:flex;align-items:center;gap:8px}
h2 .ic{color:var(--acc)}
h2 .cnt{font-size:13px;font-stretch:100%;font-weight:600;color:var(--mut)}
h3{margin:0;font-size:16.5px;line-height:1.25;font-weight:700;font-stretch:94%}
a{color:var(--acc)}

/* ---------- horní lišta ---------- */
.top{position:sticky;top:0;z-index:6;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 0 10px;margin-bottom:2px}
.logo{background:var(--acc);color:var(--ink);font-weight:900;font-stretch:125%;font-size:15px;letter-spacing:-.02em;padding:7px 13px 6px;transform:skewX(-9deg);border-radius:4px;line-height:1}
.logo span{display:block;transform:skewX(9deg)}
.top-r{display:flex;align-items:center;gap:4px}
.icb{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--txt);font-size:17px}
.icb.on{background:var(--card2);color:var(--acc)}
.icb .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
.bal{margin-left:4px;background:var(--card2);border-radius:999px;padding:7px 13px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.bal span{color:var(--mut);font-weight:600;margin-left:3px}

/* ---------- rail sportů ---------- */
.rail{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 10px;border-bottom:1px solid var(--line)}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 11px 9px;color:var(--mut);font-size:12.5px;font-weight:600;position:relative;min-width:62px}
.rail button .ic{font-size:21px}
.rail button.on{color:var(--txt)}
.rail button.on .ic{color:var(--acc)}
.rail button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--acc)}
.qbox{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:12px;padding:0 12px;margin-top:12px}
.qbox .ic{color:var(--mut)}
.qbox input{border:0;background:none;padding:12px 0}
.qbox input:focus{outline:0}
.chips{display:flex;gap:7px;margin:12px 0 4px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wr{flex-wrap:wrap}
.chips button{flex:none;padding:7px 13px;font-size:13.5px;font-weight:600;border-radius:999px;background:var(--card2);color:var(--mut);white-space:nowrap}
.chips button.on{background:var(--txt);color:#000}

/* ---------- karta události ---------- */
.ev,.card{background:var(--card);border-radius:var(--rm);padding:14px;margin-bottom:10px;border:1px solid transparent}
.ev.closing{border-color:var(--red)}
.ev-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.ev-meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;color:var(--mut);font-size:12.5px;font-weight:600;min-width:0}
.ev-meta .ic{font-size:14px;color:var(--txt)}
.ev-meta .sep{width:3px;height:3px;border-radius:50%;background:var(--mut);opacity:.6}
.fav{color:var(--mut);font-size:17px;padding:2px;margin:-4px -4px 0 0;width:30px;height:30px;display:grid;place-items:center}
.fav.on{color:var(--acc)}.fav.on .ic{fill:var(--acc)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--card3);color:var(--mut);white-space:nowrap;line-height:1.35}
.badge .ic{font-size:11px}
.badge.open{background:rgba(61,220,132,.14);color:var(--grn)}
.badge.closed{background:rgba(255,212,0,.13);color:var(--acc)}
.badge.settled{background:rgba(106,168,255,.14);color:var(--blue)}
.badge.cancelled,.badge.susp{background:rgba(255,84,73,.15);color:#ff8379}
.badge.bb{background:rgba(180,140,255,.15);color:#c9adff}
.badge.y{background:var(--acc);color:var(--ink)}
.badge.soon{background:var(--org);color:#1a0d00}
.badge.hot{background:var(--red);color:#fff}
.badge.pop{background:rgba(255,138,31,.15);color:#ffa95c}
.badge.new{background:rgba(106,168,255,.14);color:var(--blue)}
.badge.live{background:var(--red);color:#fff}
.badge.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
@keyframes pulse{50%{transform:scale(1.06)}}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.pulse,.badge.live::before,.spin{animation:none}}
.cd{font-variant-numeric:tabular-nums;font-weight:800}
.ev-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.lnk{color:var(--mut);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px;padding:4px 0}
.lnk.y{color:var(--acc)}
.lnk:hover{color:var(--txt)}

/* kurzy */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:7px;margin-top:11px}
.opt{font:inherit;background:var(--card2);border:1.5px solid transparent;border-radius:var(--rs);padding:11px 11px;color:var(--txt);text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:46px}
.opt>span:first-child{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.opt .o,.ob{color:var(--acc);font-weight:800;font-variant-numeric:tabular-nums;font-stretch:92%;font-size:15.5px;white-space:nowrap}
.ob{font-family:inherit;background:var(--card2);border:1.5px solid transparent;border-radius:var(--rs);min-height:44px;padding:4px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.ob small{display:block;font-size:11px;font-weight:600;color:var(--mut);font-stretch:100%}
.opt:not(:disabled):active,.ob:not(:disabled):active{transform:scale(.97)}
.opt.sel,.ob.sel{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.opt.sel .o,.ob.sel,.ob.sel small,.opt.sel .old,.ob.sel .old{color:var(--ink)}
.opt.mine,.ob.mine{border-color:rgba(255,212,0,.55)}
.opt.lk,.ob.lk{color:var(--mut);background:#191917}
.opt.lk .o,.ob.lk{color:#6d6b61}
.opt.win,.ob.win{background:rgba(61,220,132,.14);border-color:rgba(61,220,132,.5);color:var(--grn)}
.opt.win .o{color:var(--grn)}
.opt.lose,.ob.lose{opacity:.34}
.opt.boost,.ob.boost{border-color:var(--org)}
.ob.adm{color:var(--txt)}.ob.adm.lk{color:#ff8379}
.old{text-decoration:line-through;opacity:.6;font-size:11px;font-weight:600;margin-right:3px;color:var(--mut)}
.dn{color:#ff7a70}.up{color:var(--grn)}
.dn .ic,.up .ic{font-size:12px;margin-right:2px}
.gt{margin-top:10px}
.gh,.gr{display:grid;grid-template-columns:1fr 78px 78px;gap:7px;align-items:center}
.gh{font-size:12px;color:var(--mut);font-weight:600;padding-bottom:5px}.gh span:not(:first-child){text-align:center}
.gr{padding:3.5px 0}
.gl{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* zápas */
.mt-teams{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left}
.mt-teams b{font-size:16.5px;font-weight:700;font-stretch:94%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt-teams i{font-style:normal;font-weight:800;font-size:17px;color:var(--acc);font-variant-numeric:tabular-nums}
.mt-odds{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:7px;margin-top:11px}
.mt-hero{background:var(--card);border-radius:var(--rm);padding:18px 14px;margin:10px 0 14px;text-align:center}
.mt-hero .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:10px}
.mt-hero .vs b{font-size:19px;font-weight:800;font-stretch:84%;line-height:1.15}
.mt-hero .vs i{font-style:normal;font-weight:900;font-size:26px;color:var(--acc);font-variant-numeric:tabular-nums;font-stretch:84%}
.mt-hero .vs i.t{font-size:14px;color:var(--mut);font-weight:700}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--mut);font-weight:600;padding:10px 0 2px}

/* ---------- tlačítka, formuláře ---------- */
.btn{font:inherit;border:0;border-radius:11px;padding:12px 15px;background:var(--card2);color:var(--txt);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-align:center}
.btn:disabled{opacity:.45}
.btn.pri{background:var(--acc);color:var(--ink)}
.btn.ok{background:rgba(61,220,132,.16);color:var(--grn)}
.btn.no{background:rgba(255,84,73,.15);color:#ff8379}
.btn.sm{padding:8px 11px;font-size:13.5px;border-radius:9px}
.btn.full{width:100%}
.btn.out{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.btn.big{padding:15px;font-size:16.5px}
input,select,textarea{font:inherit;width:100%;background:var(--card2);color:var(--txt);border:1.5px solid transparent;border-radius:11px;padding:12px 12px;font-size:16px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc)}
input::placeholder,textarea::placeholder{color:#6d6b61}
textarea{min-height:84px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
label{display:block;font-size:13px;color:var(--mut);font-weight:600;margin:12px 0 5px}
.ck{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14.5px;color:var(--txt);font-weight:500}
.ck input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--acc)}
details.adv{margin-top:14px;border-top:1px solid var(--line);padding-top:4px}
details.adv summary{cursor:pointer;color:var(--mut);font-weight:700;font-size:14px;padding:10px 0;list-style:none;display:flex;align-items:center;gap:6px}
details.adv summary::-webkit-details-marker{display:none}
details.adv[open] summary .ic{transform:rotate(90deg)}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.gap4{gap:5px}
.mut{color:var(--mut);font-size:13px}.b{font-weight:700}.sm{font-size:13.5px}.r{text-align:right}
.pos{color:var(--grn)}.neg{color:#ff7a70}
.big{font-size:24px;font-weight:900;font-stretch:84%;color:var(--acc);font-variant-numeric:tabular-nums}
.err{color:#ff8379;font-size:14px;margin-top:8px;min-height:1em;font-weight:600}
.note{background:rgba(106,168,255,.12);color:#b7d3ff;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.note.g{background:rgba(61,220,132,.13);color:var(--grn)}.note.o{background:rgba(255,138,31,.14);color:#ffb673}
.warn{background:rgba(255,84,73,.14);color:#ffb0a9;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.banner{background:rgba(255,84,73,.14);color:#ffb0a9;border-radius:var(--rm);padding:13px;margin:12px 0 0;font-weight:700;display:flex;gap:9px;align-items:center}
.empty{text-align:center;color:var(--mut);padding:44px 16px}
.empty .ic{display:block;margin:0 auto 10px;font-size:34px;color:var(--card3)}
.empty b{display:block;color:var(--txt);font-size:16px;margin-bottom:3px}
.pts{background:var(--card2);color:var(--txt);font-weight:800;border-radius:999px;padding:4px 11px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- promo, hotovky ---------- */
.promo{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--acc);color:var(--ink);font-weight:800;font-stretch:90%;border-radius:var(--rm);padding:13px 14px;margin-top:12px;font-size:16px;line-height:1.2}
.promo .ic{font-size:22px}
.promo small{display:block;font-weight:600;opacity:.7;font-size:12px;font-stretch:100%;margin-top:2px}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>.combo{flex:0 0 86%;max-width:330px;scroll-snap-align:start;margin-bottom:0}
.combo{background:var(--card);border-radius:var(--rm);padding:14px;margin-bottom:10px;border:1px solid rgba(255,212,0,.35);display:flex;flex-direction:column}
.combo .ct{font-weight:800;font-stretch:88%;font-size:17px}
.cleg{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:13.5px;border-top:1px solid var(--line)}.cleg:first-child{border-top:0}
.cleg span:last-child{font-variant-numeric:tabular-nums;font-weight:700}
.combo .cfoot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:10px}

/* ---------- spodní menu ---------- */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:end}
nav button{position:relative;padding:9px 2px 10px;color:var(--mut);font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .ic{font-size:21px}
nav button.on{color:var(--txt)}nav button.on .ic{color:var(--acc)}
.nb{position:absolute;top:3px;left:calc(50% + 5px);background:var(--red);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 6px;min-width:18px}
nav .fab{padding:0 0 8px;color:var(--txt)}
nav .fab .disc{width:58px;height:58px;border-radius:50%;background:var(--card3);color:var(--mut);display:grid;place-items:center;margin-top:-22px;border:4px solid var(--bg);position:relative;font-size:24px}
nav .fab.has .disc{background:var(--acc);color:var(--ink)}
nav .fab .disc b{position:absolute;top:-4px;right:-6px;background:var(--txt);color:#000;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12.5px;font-weight:800;padding:0 5px;border:2px solid var(--bg)}
nav .fab em{font-style:normal;font-variant-numeric:tabular-nums}
nav .fab.has em{color:var(--acc);font-weight:800}

/* ---------- sheet ---------- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:93vh;overflow:auto;border-radius:var(--rl) var(--rl) 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line);border-bottom:0;overscroll-behavior:contain}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--card3);margin:0 auto 12px}
@media (min-width:720px){#modal{align-items:center}.sheet{border-radius:var(--rl);border-bottom:1px solid var(--line);max-height:88vh}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--txt);color:#000;padding:11px 16px;border-radius:12px;font-weight:700;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.6);max-width:90vw;text-align:center;font-size:14.5px}
.toast.bad{background:var(--red);color:#fff}

/* ---------- tiket ---------- */
.tk{background:var(--card);border-radius:var(--rm);margin-bottom:12px;border:1px solid transparent;overflow:hidden;padding:0}
.tk.pending,.tk.offer{border-color:var(--acc)}
.tk-a{padding:13px 14px 4px}.tk-b{padding:4px 14px 14px}
.tk-cut{position:relative;height:18px}
.tk-cut::before,.tk-cut::after{content:"";position:absolute;top:0;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.tk-cut::before{left:-10px}.tk-cut::after{right:-10px}
.tk-cut i{position:absolute;left:16px;right:16px;top:8px;border-top:2px dashed var(--line)}
.tk.pending .tk-cut::before,.tk.offer .tk-cut::before{box-shadow:inset -1px 0 0 var(--acc)}
.tk.pending .tk-cut::after,.tk.offer .tk-cut::after{box-shadow:inset 1px 0 0 var(--acc)}
.tk-no{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums;font-weight:600}
.leg{display:grid;grid-template-columns:20px 1fr auto;gap:9px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.leg:first-child{border-top:0}
.leg .st{font-size:16px;margin-top:2px;color:var(--mut)}
.leg .st.won{color:var(--grn)}.leg .st.lost{color:var(--red)}
.leg .lo{font-weight:800;font-variant-numeric:tabular-nums}
.leg .rm{width:30px;height:30px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--mut);font-size:14px}
.tk-sum{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--mut)}
.tk-sum b{color:var(--txt);font-variant-numeric:tabular-nums}
.tk-res{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-weight:800;font-size:16px}
.pendbox{background:var(--acc);color:var(--ink);font-weight:700;border-radius:10px;padding:11px 12px;display:flex;gap:10px;align-items:center;margin:10px 0}
.spin{width:18px;height:18px;border:3px solid rgba(0,0,0,.22);border-top-color:#111;border-radius:50%;animation:sp .9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.quick{display:flex;gap:6px;margin-top:8px}.quick button{flex:1;padding:9px 4px;font-size:13.5px;font-weight:700;border-radius:9px;background:var(--card2)}
.slip-tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.pend{border:1px solid var(--acc)}

/* ---------- účet ---------- */
.acct-h{display:flex;align-items:center;gap:14px;margin:14px 0 4px}
.ava{width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--ink);display:grid;place-items:center;font-weight:900;font-size:24px;font-stretch:84%}
.acct-h b{font-size:21px;font-weight:800;font-stretch:84%;display:block;line-height:1.15}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi>div{background:var(--card);border-radius:12px;padding:12px}
.kpi span{display:block}
.kpi b{display:block;font-size:20px;font-weight:800;font-stretch:86%;font-variant-numeric:tabular-nums;margin-top:2px}
.menu{background:var(--card);border-radius:var(--rm);overflow:hidden;margin-top:12px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-top:1px solid var(--line);font-weight:600}
.menu button:first-child{border-top:0}
.menu button .ic:first-child{font-size:19px;color:var(--acc)}
.menu button span{flex:1}.menu button small{display:block;color:var(--mut);font-weight:500;font-size:12.5px}
.menu button .ic:last-child{color:var(--mut)}
.msg{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.msg small{display:block;color:var(--mut);margin-top:4px}

/* ---------- admin ---------- */
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;margin:6px 0 14px;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:9px 10px;font-size:13.5px;font-weight:700;color:var(--mut);border-radius:9px;position:relative}
.seg button.on{background:var(--card3);color:var(--txt)}
.seg .nb{top:-2px;left:auto;right:-2px}
.adm-st{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:var(--rm);padding:13px 14px;margin-bottom:10px}
.adm-st i{width:11px;height:11px;border-radius:50%;background:var(--grn);flex:none;box-shadow:0 0 0 4px rgba(61,220,132,.18)}
.adm-st.off{background:rgba(255,84,73,.14)}.adm-st.off i{background:var(--red);box-shadow:0 0 0 4px rgba(255,84,73,.2)}
.adm-st span{flex:1;font-weight:700}.adm-st small{display:block;color:var(--mut);font-weight:500}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts button{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:13px 12px;font-weight:700;text-align:left;font-size:14.5px;line-height:1.2}
.acts button .ic{font-size:19px;color:var(--acc)}
.acts button.no{color:#ff8379}.acts button.no .ic{color:#ff8379}
.acts button.pri{background:var(--acc);color:var(--ink)}.acts button.pri .ic{color:var(--ink)}
.sheet .acts button:not(.pri){background:var(--card2)}
.arow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:12px;padding:12px;margin-bottom:7px}
.arow>.ic:first-child{font-size:20px;color:var(--mut)}
.arow .t{flex:1;min-width:0}.arow .t b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .t small{display:block;color:var(--mut);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .rk{width:22px;text-align:center;font-weight:800;color:var(--mut);font-variant-numeric:tabular-nums}
.sheet .arow{background:var(--card2)}
.pick{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--card);border-radius:var(--rm);padding:15px 14px;margin-bottom:8px}
.pick .ic:first-child{font-size:24px;color:var(--acc)}
.pick span{flex:1;font-weight:700;font-size:16px}.pick small{display:block;color:var(--mut);font-weight:500;font-size:13px}
.tbl{width:100%;border-collapse:collapse}.tbl td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top}.tbl tr:last-child td{border-bottom:0}.tbl td:last-child{text-align:right}
.grp{background:var(--card);border-radius:12px;padding:12px;margin-top:10px}.grp input,.grp textarea,.grp select{background:var(--card2)}
.card input,.card select,.card textarea{background:var(--card2)}
.optrow{display:grid;grid-template-columns:1fr 56px 74px 36px;gap:6px;margin-bottom:6px}.optrow input{padding:10px 8px}
.grow{display:grid;grid-template-columns:1fr 52px 64px 64px 36px;gap:5px;margin-bottom:6px}.grow input{padding:10px 6px}
.gh2{display:grid;grid-template-columns:1fr 52px 64px 64px 36px;gap:5px;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:4px}
.oh2{display:grid;grid-template-columns:1fr 56px 74px 36px;gap:6px;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:4px}
.chk{width:100%;text-align:left;margin-top:6px;box-shadow:inset 0 0 0 1px var(--line);justify-content:flex-start}
.chk.on{box-shadow:inset 0 0 0 1.5px var(--grn);background:rgba(61,220,132,.13);color:var(--grn)}
.lrow{background:var(--card);border-radius:12px;padding:11px;margin-top:8px}.lrow.susp{outline:2px solid var(--red)}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.lcell .row{gap:4px}.lcell input{text-align:center;padding:9px 2px;font-weight:800;background:var(--card2)}
.lcell button{padding:9px 0;min-width:40px;background:var(--card2);border-radius:9px;font-weight:800}
.tg{padding:7px 10px!important;font-size:13px;background:var(--card2);border-radius:9px;font-weight:700}
.tg.on{background:var(--red)!important;color:#fff}.tg.bo.on{background:var(--org)!important;color:#1a0d00}
.mkrow{background:var(--card);border-radius:12px;padding:11px 12px;margin-top:8px}
.mkrow .mkh{display:flex;align-items:center;gap:10px;font-weight:700}
.mkrow .mkh input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc);flex:none}
.mkrow .mkh .ln{width:74px;margin-left:auto;padding:8px;text-align:center}
.mkrow .mko{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:9px}
.mkrow .mko label{margin:0 0 3px;font-size:11.5px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mkrow .mko input{padding:9px 4px;text-align:center;font-weight:800;background:var(--card2)}
.mkrow.off .mko{display:none}.mkrow.off{opacity:.6}
.bars{display:flex;align-items:flex-end;gap:4px;height:130px;margin-top:12px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px;color:var(--mut);min-width:0}
.bars i{display:block;width:100%;border-radius:4px 4px 0 0;min-height:2px}.bars span{white-space:nowrap}

/* statistika sázek */
.vchart{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(96px,1fr);gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px}
.vbar{height:110px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-bottom:1px solid var(--line);gap:4px}
.vbar span{font-size:12px;font-weight:700}.vbar i{display:block;width:62%;border:1px solid var(--blue);background:rgba(106,168,255,.14);border-radius:5px 5px 0 0;border-bottom:0}
.vbar i.top{border-color:var(--acc);background:rgba(255,212,0,.25)}
.vl{text-align:center;font-weight:700;font-size:13px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vo{background:var(--card2);border-radius:8px;text-align:center;padding:6px 2px;margin-top:5px;font-weight:800;color:var(--acc);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.vs{text-align:center;margin-top:6px;font-size:11px;color:var(--mut);line-height:1.35}.vs b{display:block;color:var(--txt);font-size:13px;margin-bottom:3px}
.srow{padding:8px 0;border-top:1px solid var(--line)}.srow:first-child{border-top:0}
.sbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--card2);margin:5px 0}.sbar i{display:block}.sbar .a{background:var(--acc)}.sbar .n{background:var(--blue)}

.login{max-width:400px;margin:0 auto;padding-top:14vh}
.login .logo{display:inline-block;font-size:26px;padding:11px 20px 9px;border-radius:6px}
.login p{color:var(--mut);margin:18px 0 22px;font-size:16px}
.rules b{display:block;margin-top:14px;font-size:15.5px}.rules ul{margin:5px 0 0;padding-left:20px;color:#d6d4c8}.rules li{margin:4px 0;font-size:14.5px}

/* ===== 2.1: hravost a animace ===== */
.bal{border:0;color:var(--txt);font:inherit;font-weight:800;cursor:pointer;transition:background .3s}
.bal b{font-weight:800}
.bal.gain{animation:balGain 1.1s ease-out}.bal.loss{animation:balLoss .9s ease-out}
@keyframes balGain{0%{background:var(--card2)}20%{background:rgba(61,220,132,.35);transform:scale(1.08)}100%{background:var(--card2);transform:none}}
@keyframes balLoss{20%{background:rgba(255,212,0,.22)}100%{background:var(--card2)}}
.ob.pop,.opt.pop{animation:pickPop .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes pickPop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:none}}
.fab.bump .disc{animation:fabBump .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes fabBump{0%{transform:scale(1)}40%{transform:scale(1.22) rotate(-8deg)}100%{transform:none}}
/* změna kurzu: barevný záblesk + šipka, která poskočí */
.chg{animation:chgFlash 1.8s ease-out var(--fx,0ms) both}
.chg.up{--c:61,220,132}.chg.dn{--c:255,84,73}
@keyframes chgFlash{0%{box-shadow:inset 0 0 0 2px rgba(var(--c),.95);background-color:rgba(var(--c),.30)}70%{box-shadow:inset 0 0 0 2px rgba(var(--c),.35)}100%{box-shadow:inset 0 0 0 2px rgba(var(--c),0)}}
.fxa{display:inline-flex;margin-right:3px;vertical-align:-2px}
.chg.up .fxa{color:var(--grn);animation:arrUp .6s ease-out 3 var(--fx,0ms)}.chg.dn .fxa{color:var(--red);animation:arrDn .6s ease-out 3 var(--fx,0ms)}
@keyframes arrUp{0%{transform:translateY(5px);opacity:0}50%{opacity:1}100%{transform:none}}

function ladderDown(o){ if (!(o > 1) || S.cfg.ladder === false) return o; let lo = 1;

  if (live && it.rows[0].bb) out.push(`<span class="badge bb">${ic('puzzle')}Betbuilder</span>`);

}
function oddsMove(o){
  if (!(o.prev > 1) || o.prev === o.odds || !(o.odds > 1)) return fmtOdds(o.odds);
  return `${fmtOdds(o.prev)} <span class="${o.odds < o.prev ? 'dn' : 'up'}">${ic(o.odds < o.prev ? 'trending-down' : 'trending-up')}</span>${fmtOdds(o.odds)}`;
}
const mvArrow = o => (o.prev > 1 && o.prev !== o.odds && o.odds > 1 && ms(o.prevAt) > Date.now() - 2*3600e3) ? `<span class="${o.odds < o.prev ? 'dn' : 'up'}">${ic(o.odds < o.prev ? 'trending-down' : 'trending-up')}</span>` : '';
function statsBlock(it){
  if (it.type === 's') {
    const m = it.m, idx = orderIdx(m), tot = m.options.reduce((s,o) => s + (o.tl||0), 0), mx = Math.max(0, ...m.options.map(o => o.tl||0));
    return `<div class="vchart">${idx.map(i => { const o = m.options[i], p = tot ? Math.round((o.tl||0) / tot * 100) : 0;
      return `<div><div class="vbar"><span>${p} %</span><i class="${tot && mx && (o.tl||0) === mx ? 'top' : ''}" style="height:${Math.max(3, Math.round(p * 0.9))}px"></i></div>
        <div class="vl">${esc(o.label)}</div><div class="vo">${o.odds > 1 ? oddsMove(o) : ic('lock')}</div>${spark(o)}
        <div class="vs">Vsazeno<b>${fmtN(o.tl||0)} b</b>Tiketů<b>${o.n||0}×</b></div></div>`; }).join('')}</div>`;
  }
  const rows = sortRows(it).filter(r => r.status !== 'cancelled');
  return `<div style="margin-top:10px">${rows.map(r => { const a = r.options[0], n = r.options[1], ta = a.tl||0, tn = n.tl||0, t = ta + tn;
    const pa = t ? Math.round(ta / t * 100) : 0, pn = t ? 100 - pa : 0;
    return `<div class="srow"><div class="row sp sm"><b>${esc(r.rowLabel)}</b><span class="mut">ANO ${a.odds>1?oddsMove(a):ic('lock')} · NE ${n.odds>1?oddsMove(n):ic('lock')}</span></div>
      <div class="sbar">${t ? `<i class="a" style="width:${pa}%"></i><i class="n" style="width:${pn}%"></i>` : ''}</div>
      <div class="row sp sm mut"><span>ANO ${pa} % · ${fmtN(ta)} b · ${a.n||0}×</span><span>NE ${pn} % · ${fmtN(tn)} b · ${n.n||0}×</span></div></div>`; }).join('')}</div>`;
}
function spark(o){
  const h = (o.h || []).filter(x => x.o > 1); if (h.length < 2) return '';

  const pts = h.map((x, i) => `${(i / (h.length - 1) * W).toFixed(1)},${(H - 3 - (x.o - mn) / rg * (H - 6)).toFixed(1)}`).join(' ');
  const up = vs[vs.length-1] >= vs[0];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:26px;margin-top:4px" aria-label="vývoj kurzu"><polyline points="${pts}" fill="none" stroke="${up ? '#5be39b' : '#ff6b6b'}" stroke-width="2" stroke-linejoin="round"/></svg>`;
}
const statsToggle = it => { const inf = S.mtOpen && it.rows[0].mtId ? '' : infoOf(it), open = S.showStats.has(it.id);
  return `<div class="ev-foot"><button class="lnk" data-act="stats" data-k="${esc(it.id)}">${ic(inf ? 'info' : 'chart-column')}${open ? 'Skrýt' : inf ? 'Statistiky a info' : 'Statistika sázek'}</button></div>${open ? (inf ? `<div class="info">${infoHtml(inf)}</div>` : '') + statsBlock(it) : ''}`; };

/* ---- promo, hotovky ---- */
const activePromos = () => (S.cfg.promos||[]).filter(p => !ms(p.until) || ms(p.until) > Date.now());
const comboList = () => Object.entries(S.cfg.combos||{}).map(([id, c]) => ({ id, ...c })).sort((a,b) => (ms(b.createdAt)||0) - (ms(a.createdAt)||0));
function comboState(c){
  const legs = (c.legs||[]).map(l => ({ m: M(l.m), i: l.i }));
  const st = { legs, prod: 0, cap: 0, ok: false, why: '' };
  if (!c.active) { st.why = 'Vypnuto'; return st; }
  if (ms(c.until) && ms(c.until) < Date.now()) { st.why = 'Skončila'; return st; }
  if (legs.some(l => !l.m)) { st.why = 'Sázka už neexistuje'; return st; }
  st.prod = legs.reduce((p, l) => p * l.m.options[l.i].odds, 1); st.cap = fairCap(legs);
  if (legs.some(l => !optAvail(l.m, l.i))) { st.why = 'Teď zamčeno '; return st; }
  if (c.odds > st.cap + 1e-9) { st.why = 'Teď zamčeno '; return st; }
  if (c.perUser > 0 && S.myBets.filter(b => b.combo === c.id).length >= c.perUser) { st.why = 'Už jsi vsadil'; st.used = true; return st; }
  st.ok = true; return st;
}
function comboCard(c){
  const st = comboState(c);
  return `<article class="combo"><div class="row sp"><span class="ct">${esc(c.title)}</span>${ms(c.until) ? `<span class="mut">do ${fmtDate(c.until)}</span>` : ''}</div>
    <div style="margin-top:8px">${st.legs.map(l => l.m ? `<div class="cleg"><span><span class="mut">${esc(legTitle(l.m))}</span> ${esc(l.m.options[l.i].label)}</span><span>${fmtOdds(l.m.options[l.i].odds)}</span></div>` : '').join('')}</div>
    <div class="cfoot"><span class="mut">${st.prod > 1 ? `<span class="old" style="font-size:14px">${fmtOdds(floor2(st.prod))}</span><br>` : ''}Vylepšený kurz${c.maxStake ? `, max. vklad ${fmtN(c.maxStake)} b` : ''}</span><span class="big">${fmtOdds(c.odds)}</span></div>
    <button class="btn ${st.ok ? 'pri' : ''} full" style="margin-top:10px" ${st.ok ? `data-act="cbuse" data-c="${c.id}"` : 'disabled'}>${st.ok ? 'Přidat na tiket' : st.why}</button></article>`;

function checkResults(){

  const key = 'seenRes_' + S.user.uid, last = ls.get(key);
  if (last == null) { ls.set(key, Date.now()); return; }
  const fresh = S.myBets.filter(b => ['won','lost','void'].includes(b.status) && ms(b.settledAt) > last);
  if (!fresh.length) return;
  ls.set(key, Math.max(Date.now(), ...fresh.map(b => ms(b.settledAt))));
  const won = fresh.filter(b => b.status === 'won'), sum = fresh.reduce((s,b) => s + (b.payout||0), 0);
  try { navigator.vibrate?.(won.length ? [100,60,100,60,200] : [200]); } catch {}

  openModal(`<h1 style="text-align:center;font-size:30px;margin-top:10px">${won.length ? 'Výhra!' : 'Tikety jsou vyhodnocené'}</h1>
    ${sum > 0 ? `<div style="text-align:center;margin-bottom:14px"><span class="big winpop" style="font-size:40px">+${fmtN(sum)} b</span></div>` : ''}
    ${fresh.map(b => ticketCard(b, false, true)).join('')}

}

function errTxt(e){

  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) return 'Špatné jméno nebo heslo.';
  if (c.includes('weak-password')) return 'Heslo musí mít aspoň 6 znaků.';
  if (c.includes('permission-denied')) return 'Tohle teď nejde (sázky jsou zamčené, změnil se kurz nebo limit).';

}

  const name = document.getElementById('lu').value.trim(), pw = document.getElementById('lp').value, $e = document.getElementById('lerr');

onAuthStateChanged(auth, user => {
  S.unsubs.forEach(u => u()); S.unsubs = [];

function buildItems(markets){
  const groups = {}, items = [];
  for (const m of markets) {
    if (m.kind === 'row') {
      if (!groups[m.grp]) { groups[m.grp] = { type:'g', id:m.grp, title:m.groupTitle, category:m.category, closesAt:m.closesAt, ev:m.ev, bb:m.bb, exclusive:m.exclusive, nobody:m.nobody, rows:[] }; items.push(groups[m.grp]); }
      groups[m.grp].rows.push(m);
    } else items.push({ type:'s', id:m.id, m, rows:[m] });
  }
  Object.values(groups).forEach(g => g.rows.sort((a,b) => (a.order??0) - (b.order??0)));
  return items;
}
function itemStatus(it){
  const ss = it.rows.map(effStatus);
  return ss.includes('open') ? 'open' : ss.includes('closed') ? 'closed' : 'done';
}
const groupById = gid => buildItems(S.markets).find(i => i.type==='g' && i.id===gid);

const inSlip = (mid, i) => S.slip.some(s => s.m === mid && s.i === i);
function oddsInner(o){ return o.boostFrom > 1 ? `<span class="old">${fmtOdds(o.boostFrom)}</span>${fmtOdds(o.odds)}` : mvArrow(o) + fmtOdds(o.odds); }
function oddsBtn(m, i, adm, mineIdx, lab){
  const o = m.options[i], sm = lab ? `<small>${esc(lab)}</small>` : '';
  if (m.status === 'settled') return `<button class="ob ${m.winnerIndex===i?'win':'lose'}" disabled>${sm}<span>${fmtOdds(o.odds)}</span></button>`;
  if (m.status === 'cancelled') return `<button class="ob lk" disabled>${sm}<span>–</span></button>`;
  if (adm) { const lk = o.locked || !(o.odds > 1);
    return `<button class="ob adm ${lk?'lk':''} ${o.boostFrom>1?'boost':''}${fxCls(m.id,i)}"${fxStyle(m.id,i)} data-act="live" data-m="${m.id}">${sm}<span>${lk ? ic('lock') : ''}${o.odds > 1 ? oddsInner(o) : ''}</span></button>`; }
  if (!optAvail(m, i)) return `<button class="ob lk" disabled aria-label="Zamčeno">${sm}<span>${ic('lock')}</span></button>`;
  const c = ['ob']; if (inSlip(m.id, i)) c.push('sel'); else if (mineIdx?.has(i)) c.push('mine'); if (o.boostFrom > 1) c.push('boost');
  if (S.justPicked === m.id + ':' + i) c.push('pop');
  return `<button class="${c.join(' ')}${fxCls(m.id,i)}"${fxStyle(m.id,i)} data-act="pick" data-m="${m.id}" data-i="${i}">${sm}<span>${fxArrow(m.id,i)}${oddsInner(o)}</span></button>`;
}

function groupCard(g, adm){
  const ids = new Set(g.rows.map(r => r.id));
  const mine = adm ? [] : S.myBets.filter(b => ['open','pending'].includes(b.status)).flatMap(b => b.legs.filter(l => ids.has(l.m)));
  const heads = g.rows[0]?.options || [{label:'Ano'},{label:'Ne'}];
  const rows = sortRows(g).map(r => { const mi = new Set(mine.filter(l => l.m === r.id).map(l => l.i));
    return `<div class="gr"><span class="gl">${esc(r.rowLabel)}${r.status==='cancelled' ? ' <span class="mut">(zrušeno)</span>' : ''}${adm && r.suspended && isLive(r) ? ' ' + ic('pause') : ''}</span>${oddsBtn(r,0,adm,mi)}${oddsBtn(r,1,adm,mi)}</div>`; }).join('');

function singleCard(it, adm, bare){
  const m = it.m;
  const mi = adm ? new Set() : new Set(S.myBets.filter(b => ['open','pending'].includes(b.status)).flatMap(b => b.legs.filter(l => l.m === m.id).map(l => l.i)));
  const opts = orderIdx(m).map(i => { const o = m.options[i];
    let cls = 'opt', attrs = 'disabled', right = fmtOdds(o.odds);
    if (m.status === 'settled') cls += m.winnerIndex === i ? ' win' : ' lose';
    else if (m.status === 'cancelled') { cls += ' lk'; right = '–'; }
    else if (adm) { attrs = `data-act="live" data-m="${m.id}"`; const lk = o.locked || !(o.odds > 1); right = (lk ? ic('lock') : '') + (o.odds > 1 ? oddsInner(o) : ''); if (lk) cls += ' lk'; if (o.boostFrom > 1) cls += ' boost'; }
    else if (!optAvail(m, i)) { cls += ' lk'; right = ic('lock'); }
    else { attrs = `data-act="pick" data-m="${m.id}" data-i="${i}"`; right = fxArrow(m.id,i) + oddsInner(o); if (inSlip(m.id,i)) cls += ' sel'; else if (mi.has(i)) cls += ' mine'; if (o.boostFrom > 1) cls += ' boost'; if (S.justPicked === m.id + ':' + i) cls += ' pop'; }
    if (m.status !== 'settled' && m.status !== 'cancelled') cls += fxCls(m.id, i);
    return `<button class="${cls}" ${attrs}${fxStyle(m.id,i)}><span>${esc(o.label)}</span><span class="o">${right}</span></button>`;
  }).join('');
  const sus = bare && isLive(m) && m.suspended ? `<div class="tags"><span class="badge susp">${ic('lock')}Pozastaveno</span></div>` : '';
  return `<article class="ev ${closingCls(it)}">${bare ? '' : evTop(it, adm)}<h3>${esc(bare ? (m.mname || m.title) : m.title)}</h3>${bare ? sus : tagRow(it)}
    <div class="opts">${opts}</div>${statsToggle(it)}</article>`;
}
const itemCard = (it, adminMode) => it.type === 'g' ? groupCard(it, adminMode) : singleCard(it, adminMode);

function popCalc(items){

/* ================== TIKET (SLIP) ================== */
function comboErr(m, i, slip){
  const o = m.options[i];
  if (slip.length >= Math.min(MAX_LEGS, S.cfg.maxLegs || MAX_LEGS)) return `Na tiketu může být max. ${Math.min(MAX_LEGS, S.cfg.maxLegs || MAX_LEGS)} sázek.`;
  if (o.boostFrom > 1 && slip.length) return 'Zvýšený kurz jde vsadit jen samostatně.';
  for (const s of slip) {
    const lm = M(s.m); if (!lm) continue;
    if (lm.options[s.i]?.boostFrom > 1) return 'Na tiketu je zvýšený kurz – ten jde vsadit jen samostatně.';
    if (lm.ev === m.ev && !(lm.bb && m.bb)) return 'Tyhle sázky nejde kombinovat na jeden tiket.';
    if (m.fam && lm.grp === m.grp) return 'Tyhle dvě sázky spolu souvisí, na jeden tiket nejdou.';
    if (lm.grp === m.grp && m.exclusive && (i === 0 || s.i === 0)) return 'Tady může platit ANO jen u jednoho – ANO nejde kombinovat s dalším řádkem téže sázky.';
  }
  return '';
}
function pick(mid, i){
  const m = M(mid); if (!m || !optAvail(m, i)) return;
  const qb = qbPrefs();
  if (qb.on && !isAdmin() && !S.slip.length) { quickBet(mid, i, qb.amt); return; }
  const idx = S.slip.findIndex(s => s.m === mid);
  if (idx >= 0 && S.slip[idx].i === i) { S.slip.splice(idx, 1); }
  else {
    let rest = S.slip.filter(s => s.m !== mid);
    let err = comboErr(m, i, rest);
    if (err) {
      // jako ve skutečné sázkovce: sázku, která se s novou nesnese, vyměníme
      const clash = rest.filter(s => comboErr(m, i, [s]));
      const rest2 = rest.filter(s => !clash.includes(s));
      if (clash.length && !comboErr(m, i, rest2)) {
        const lab = clash.map(s => M(s.m)?.options[s.i]?.label).filter(Boolean).join(', ');
        rest = rest2; err = ''; toast(`Vyměněno: ${lab} → ${m.options[i].label}. ${clash.length > 1 ? 'Ty sázky' : 'Ta sázka'} nejde kombinovat s touhle.`);
      }
    }
    if (err) { toast(err, true); buzz(60); return; }
    S.slip = [...rest, { m: mid, i }];
    S.seenOdds[`${mid}:${i}`] = m.options[i].odds;
    S.justPicked = `${mid}:${i}`; buzz(12);
  }
  S.slipCombo = null; ls.set('slipc_' + S.user.uid, null);
  ls.set('slip_' + S.user.uid, S.slip); render();
}
function akoPct(n){ const c = S.cfg; return n >= c.akoN2 ? c.akoP2 : n >= c.akoN1 ? c.akoP1 : 0; }
function slipData(){
  const legs = S.slip.map(s => {
    const m = M(s.m); if (!m) return { s, gone:true };
    const o = m.options[s.i], key = `${s.m}:${s.i}`;
    if (S.seenOdds[key] === undefined) S.seenOdds[key] = o.odds;
    return { s, m, o, key, avail: optAvail(m, s.i), odds: o.odds, seen: S.seenOdds[key], changed: S.seenOdds[key] !== o.odds };
  });
  const ok = legs.filter(l => !l.gone && l.avail);
  const prod = ok.reduce((p,l) => p * l.odds, 1);
  const evs = ok.map(l => l.m.ev), bb = new Set(evs).size < evs.length;
  let total = ok.length ? (bb ? floor2(1 + (prod - 1) * (1 - S.cfg.bbMargin)) : floor2(prod)) : 0;
  let combo = null, comboErr = '', bonus = 0, ins = false;
  const cb = S.slipCombo ? S.cfg.combos?.[S.slipCombo] : null;
  if (cb && cb.legs.length === S.slip.length && cb.legs.every((l, k) => l.m === S.slip[k].m && l.i === S.slip[k].i)) {
    combo = { id: S.slipCombo, ...cb }; const st = comboState(combo);
    if (st.ok) total = cb.odds; else comboErr = `Hotovka: ${st.why}`;
  } else if (S.slipCombo) { S.slipCombo = null; }
  if (!combo && !bb && ok.length === legs.length && S.cfg.akoOn && ok.length >= 2 && ok.every(l => l.odds >= S.cfg.akoMin) && !ok.some(l => l.o.boostFrom > 1)) {
    const pc = akoPct(ok.length);
    if (pc > 0) { const t = floor2(Math.min(prod * (1 + pc), fairCap(ok.map(l => ({ m:l.m, i:l.s.i }))))); if (t > total) { bonus = pc; total = t; } }
  }
  if (!combo && !bb && S.cfg.insOn && ok.length >= S.cfg.insMinLegs && ok.every(l => l.odds >= S.cfg.insMinOdds)) ins = true;
  return { legs, ok, prod, bb, total, combo, comboErr, bonus, ins, bad: legs.some(l => l.gone || !l.avail) || !!comboErr, changed: legs.some(l => l.changed && !l.gone) };
}

function updSlipTotals(){
  const d = slipData(), msgs = [], ms_ = effLimit('maxStake'), mw = effLimit('maxWin');
  if (S.slipMode === 'solo' && S.slip.length > 1) {
    let tot = 0, win = 0;
    d.legs.forEach(l => { if (l.gone || !l.avail) return; const a = parseInt(S.soloAmt[l.s.m]) || 0; tot += a; win += Math.floor(a * l.odds + 1e-9);
      const w = document.querySelector(`[data-solo-w="${l.s.m}"]`); if (w) w.textContent = a ? `výhra ${fmtN(Math.floor(a * l.odds + 1e-9))} b` : '';
      if (ms_ && a > ms_) msgs.push(`<div class="warn">Max. vklad je ${fmtN(ms_)} b.</div>`); });
    const st = document.getElementById('soloTot'); if (st) st.textContent = fmtN(tot) + ' b';
    const pw = document.getElementById('pw'); if (pw) pw.textContent = fmtN(win) + ' b';
    if (tot > S.profile.points) msgs.push(`<div class="warn">Tolik bodů nemáš (máš ${fmtN(S.profile.points)} b).</div>`);
  } else {
    const a = parseInt(S.slipAmt) || 0, win = Math.floor(a * d.total + 1e-9);
    const pw = document.getElementById('pw'); if (pw) pw.textContent = fmtN(win) + ' b';
    if (d.combo?.maxStake && a > d.combo.maxStake) msgs.push(`<div class="warn">Max. vklad na hotovku je ${fmtN(d.combo.maxStake)} b.</div>`);
    if (effLimit('boostMax') && d.ok.length === 1 && d.ok[0].o.boostFrom > 1 && a > effLimit('boostMax')) msgs.push(`<div class="warn">Max. vklad na zvýšený kurz je ${fmtN(effLimit('boostMax'))} b.</div>`);
    if (ms_ && a > ms_) msgs.push(`<div class="warn">Max. vklad je ${fmtN(ms_)} b.</div>`);
    const mle = a ? marketLimitErr(S.slip, a) : ''; if (mle) msgs.push(`<div class="warn">${esc(mle)}</div>`);
    if (mw && win > mw) msgs.push(`<div class="warn">Max. výhra na tiket je ${fmtN(mw)} b.</div>`);
  }
  if (isBlocked(me())) msgs.push(`<div class="warn">Sázení máš momentálně pozastavené${ms(me().blockUntil) ? ' do ' + fmtDate(me().blockUntil) : ''}.</div>`);
  const m = document.getElementById('slipmsg'); if (m) m.innerHTML = msgs.join('');
}

// jedno podání tiketu (AKO / sólo / hotovka) – vrací { status, total, legs, id } nebo hází chybu
async function placeCore(slip, amount, comboId){
  const seen = { ...S.seenOdds };
  let bref = doc(collection(db,'bets'));
  const cbx = comboId ? S.cfg.combos?.[comboId] : null;
  if (comboId && cbx?.perUser > 0) {
    let k = 0; while (k < cbx.perUser && S.myBets.some(b => b.id === `c_${comboId}_${S.user.uid}_${k}`)) k++;
    if (k >= cbx.perUser) throw new Error('Tuhle hotovku už jsi vsadil maximálněkrát.');
    bref = doc(db, 'bets', `c_${comboId}_${S.user.uid}_${k}`);
  }
  const res = await runTransaction(db, async tx => {
    const uref = doc(db,'users',S.user.uid), cref = doc(db,'config','main');
    const us = await tx.get(uref), cs = await tx.get(cref);
    const msnaps = []; for (const s of slip) msnaps.push(await tx.get(doc(db,'markets',s.m)));
    const c = { ...DEF_CFG, ...(cs.exists() ? cs.data() : {}) }, ud = us.data(), pts = ud.points;
    if (c.suspendAll) throw new Error('Sázení je pozastavené.');
    if (isBlocked(ud)) throw new Error('Sázení máš momentálně pozastavené.');
    if (amount > pts) throw new Error('Nemáš dost bodů.');
    const legs = [], mUpd = [], oldOpts = {}, newOpts = {}, fresh = [];
    slip.forEach((s, k) => {
      const sn = msnaps[k]; if (!sn.exists()) throw new Error('Některá sázka už neexistuje.');
      const m = { id: sn.id, ...sn.data() }, o = m.options[s.i];
      if (m.status !== 'open' || m.suspended || o.locked || !(o.odds > 1) || (ms(m.closesAt) && ms(m.closesAt) < Date.now())) throw new Error(`„${legTitle(m)}“ teď nejde vsadit.`);
      if (seen[`${s.m}:${s.i}`] !== undefined && o.odds !== seen[`${s.m}:${s.i}`]) { const e = new Error('ODDS'); e.odds = true; throw e; }
      legs.push({ m: m.id, i: s.i, o: o.odds, e: m.ev, g: m.grp, lbl: o.label, t: legTitle(m), st: 'open', f: o.fo || o.odds });
      const tl = o.tl || 0; let odds = o.odds;
      if (c.dropEvery > 0 && c.dropPct > 0) { const n = Math.floor((tl + amount) / c.dropEvery) - Math.floor(tl / c.dropEvery); if (n > 0) odds = Math.max(1.01, floor2(odds * Math.pow(1 - c.dropPct, n))); }
      fresh.push({ m, i: s.i });
      const nOpts = m.options.map((x, k2) => k2 === s.i ? { ...x, tl: tl + amount, pw: (x.pw || 0) + Math.floor(amount * o.odds), n: (x.n || 0) + 1, odds,
        ...(odds !== o.odds ? { prev: o.odds, prevAt: Timestamp.fromDate(new Date()), h: [...(x.h || []), { t: Date.now(), o: odds }].slice(-20) } : {}) } : x);
      oldOpts[m.id] = m.options; newOpts[m.id] = nOpts; mUpd.push([sn.ref, nOpts]);
    });
    const prod = legs.reduce((p,l) => p * l.o, 1), evs = legs.map(l => l.e), bb = new Set(evs).size < evs.length;
    let total = bb ? floor2(1 + (prod - 1) * (1 - c.bbMargin)) : floor2(prod), bonus = 0, cb = null;
    if (comboId) {
      cb = c.combos?.[comboId];
      if (!cb || !cb.active || (ms(cb.until) && ms(cb.until) < Date.now())) throw new Error('Hotovka už neplatí.');
      if (cb.legs.length !== legs.length || cb.legs.some((l, k) => l.m !== legs[k].m || l.i !== legs[k].i)) throw new Error('Hotovka se změnila.');
      if (cb.maxStake && amount > cb.maxStake) throw new Error(`Max. vklad na hotovku je ${fmtN(cb.maxStake)} b.`);
      if (cb.odds > fairCap(fresh) + 1e-9) throw new Error('Hotovka je teď zamčená.');
      total = cb.odds;
    } else if (!bb && c.akoOn && legs.length >= 2 && legs.every(l => l.o >= c.akoMin)) {
      const pc = legs.length >= c.akoN2 ? c.akoP2 : legs.length >= c.akoN1 ? c.akoP1 : 0;
      if (pc > 0) { const t = floor2(Math.min(prod * (1 + pc), fairCap(fresh))); if (t > total) { bonus = pc; total = t; } }
    }
    if (total < 1.01) throw new Error('Kurz je moc nízký.');
    const alim = ud.apprLimit > 0 ? ud.apprLimit : c.approvalLimit;
    const status = (ud.apprAll === true || (alim > 0 && amount * total > alim)) ? 'pending' : 'open';
    tx.update(uref, { points: pts - amount });
    const bdata = { uid:S.user.uid, name:S.profile.name, no: 'T' + Math.random().toString(36).slice(2,8).toUpperCase(), legs, mids: legs.map(l=>l.m), ev: evs, grp: legs.map(l=>l.g), odds: total, bb, amount, status, payout: 0, createdAt: serverTimestamp() };
    if (cb) { bdata.combo = comboId; bdata.ctitle = cb.title; }
    if (bonus) bdata.bonus = bonus;
    tx.set(bref, bdata);
    // pomocný záznam: Firebase ověří 4.–6. sázku zvlášť (limit výpočtů v pravidlech)
    if (legs.length > 3) tx.set(doc(db, 'betx', bref.id + '_1'), { b: bref.id, n: 1 });
    mUpd.forEach(([ref, options]) => tx.update(ref, { options }));
    return { status, total, legs, oldOpts, newOpts, id: bref.id };
  });
  try { riskCheck(res.oldOpts, res.newOpts); } catch {}
  if (res.status === 'pending') ntfy('🎲 Tiket ke schválení', `${S.profile.name}: ${res.legs.map(l => `${l.t} – ${l.lbl}`).join(' + ')}\nKurz ${fmtOdds(res.total)} · vklad ${fmtN(amount)} b → výhra ${fmtN(amount*res.total)} b`);
  return res;
}
function preChecks(slipLegs, amount, d){
  if (!amount || amount < 1) return 'Zadej vklad.';
  if (amount > S.profile.points) return 'Tolik bodů nemáš.';
  const msx = effLimit('maxStake'), mw = effLimit('maxWin');
  if (msx && amount > msx) return `Max. vklad je ${fmtN(msx)} b.`;

function cashValue(b){
  if (!S.cfg.cashout || S.cfg.suspendAll || b.uid !== S.user?.uid || me().cashMode === 'off') return 0;
  const st = betSt(b); if (st !== 'open') return 0;
  if (!b.legs.some(l => l.st === 'open') || b.legs.some(l => l.st === 'lost')) return 0;
  let den = 1;
  for (const l of b.legs) {
    if (l.st === 'won') continue;
    if (l.st === 'void') { den *= l.o; continue; }
    const m = M(l.m); if (!m || !optAvail(m, l.i)) return 0;
    den *= m.options[l.i].odds;
  }
  const cm = me().cashMode === 'bad' ? (me().cashM ?? 0.3) : S.cfg.cashMargin;
  return Math.floor(b.amount * b.odds / den * (1 - cm) + 1e-9);
}

async function cashOut(bid, shown){
  if (!confirm(`Vyplatit tiket teď za ${fmtN(shown)} b?`)) return;
  try {
    const v = await runTransaction(db, async tx => {
      const bref = doc(db,'bets',bid), uref = doc(db,'users',S.user.uid), cref = doc(db,'config','main');
      const bs = await tx.get(bref), us = await tx.get(uref), cs = await tx.get(cref);
      const b = bs.data(), c = { ...DEF_CFG, ...(cs.exists() ? cs.data() : {}) };
      if (!c.cashout || c.suspendAll) throw new Error('Cash-out teď nejde.');
      if (!(b.status === 'open' || (b.status === 'pending' && leftMs({createdAt:b.createdAt}) <= 0))) throw new Error('Cash-out teď nejde.');
      let den = 1;
      for (const l of b.legs) {
        if (l.st === 'won') continue; if (l.st === 'void') { den *= l.o; continue; }
        if (l.st === 'lost') throw new Error('Tiket už prohrál.');
        const ms_ = await tx.get(doc(db,'markets',l.m)), m = ms_.data(), o = m.options[l.i];
        if (m.status !== 'open' || m.suspended || o.locked || !(o.odds > 1) || (ms(m.closesAt) && ms(m.closesAt) < Date.now())) throw new Error('Cash-out je teď zamčený.');
        den *= o.odds;
      }
      const ud = us.data(); if (ud.cashMode === 'off') throw new Error('Cash-out teď nejde.');
      const val = Math.floor(b.amount * b.odds / den * (1 - (ud.cashMode === 'bad' ? (ud.cashM ?? 0.3) : c.cashMargin)) + 1e-9);
      if (val < 1) throw new Error('Cash-out teď nejde.');
      if (val < shown) throw new Error(`Hodnota se změnila na ${fmtN(val)} b – zkus to znovu.`);
      tx.update(bref, { status:'cashout', payout: val, cashedAt: serverTimestamp() });
      tx.update(uref, { points: us.data().points + val, lastCash: bid });
      return val;
    });
    toast(`Vyplaceno ${fmtN(v)} b `);
  } catch(e){ toast(e.code ? errTxt(e) : e.message, true); }
}

async function answerOffer(bid, yes){

    await runTransaction(db, async tx => {
      const bref = doc(db,'bets',bid), uref = doc(db,'users',S.user.uid);
      const bs = await tx.get(bref), us = await tx.get(uref), b = bs.data();
      if (b.status !== 'offer') throw new Error('Nabídka už neplatí.');

        tx.update(bref, { status:'open', amount: b.offerAmount, odds: b.offerOdds });

      else { tx.update(bref, { status:'rejected', payout: b.amount }); tx.update(uref, { points: pts + b.amount, lastOffer: bid }); }
    });
    toast(yes ? 'Nabídka přijata ' : 'Nabídka odmítnuta, body vráceny'); if (S.ctx?.type === 'wait') closeModal();

}

async function sendOffer(){

function viewRisk(){
  const live = S.allBets.filter(b => ['open','pending'].includes(b.status));
  const items = buildItems(S.markets).filter(i => itemStatus(i) !== 'done');
  if (!items.length) return `<div class="empty">${ic('shield')}<b>Žádné aktivní sázky</b></div>`;
  const singles = live.filter(b => b.legs.length === 1);
  const cards = items.map(it => {
    const ids = new Set(it.rows.map(r=>r.id));
    const sb = singles.filter(b => ids.has(b.legs[0].m)), stake = sb.reduce((s,b)=>s+b.amount,0);
    const pay = (mid, i) => sb.filter(b => b.legs[0].m === mid && b.legs[0].i === i && b.legs[0].st === 'open').reduce((s,b)=>s+possWin(b),0);
    let scen = [];
    if (it.type === 's') scen = it.m.options.map((o,i) => [o.label, stake - pay(it.m.id, i)]);
    else if (it.exclusive) {
      const rows = it.rows.filter(isLive);
      scen = rows.map(r => [`${r.rowLabel}`, stake - pay(r.id,0) - rows.filter(x=>x.id!==r.id).reduce((s,x)=>s+pay(x.id,1),0)]);
      if (it.nobody) scen.push(['Nikdo', stake - rows.reduce((s,x)=>s+pay(x.id,1),0)]);
    } else scen = it.rows.filter(isLive).flatMap(r => { const st = sb.filter(b=>b.legs[0].m===r.id).reduce((s,b)=>s+b.amount,0); return [[`${r.rowLabel}: ${r.options[0].label}`, st - pay(r.id,0)], [`${r.rowLabel}: ${r.options[1].label}`, st - pay(r.id,1)]]; });
    const ako = live.filter(b => b.legs.length > 1 && b.legs.some(l => ids.has(l.m) && l.st === 'open'));
    const worst = scen.length ? Math.min(...scen.map(s=>s[1])) : 0, mx = Math.max(1, ...scen.map(s => Math.abs(s[1])));
    return { worst, html: `<div class="card"><div class="row sp"><span class="b">${esc(it.type==='g'?it.title:it.m.title)}</span><span class="b ${worst<0?'neg':'pos'}" style="white-space:nowrap">${fmtS(worst)} b</span></div>
      <div class="mut sm">Sólo vsazeno ${fmtN(stake)} b. Pruh ukazuje tvůj zisk (zeleně) nebo ztrátu (červeně) podle výsledku.</div>
      <div class="liab">${scen.slice(0, 14).map(([l, v]) => `<div class="lb"><span class="lbl">${esc(l)}</span><span class="bar"><i class="${v < 0 ? 'n' : 'p'}" style="width:${Math.max(2, Math.round(Math.abs(v) / mx * 50))}%"></i></span><b class="${v<0?'neg':'pos'}">${fmtS(v)}</b></div>`).join('')}</div>
      ${ako.length?`<div class="note">AKO a betbuilder tiketů s touto sázkou: ${ako.length}, max. výplata ${fmtN(ako.reduce((s,b)=>s+possWin(b),0))} b</div>`:''}</div>` };
  }).sort((a, b) => a.worst - b.worst);
  return cards.map(c => c.html).join('');
}

  const done = bs.filter(b => ['won','lost','cashout'].includes(b.status)), live = bs.filter(b => ['open','pending'].includes(b.status));

  const profit = dTurn - paid, liab = live.reduce((s,b)=>s+possWin(b),0);
  const byU = {}; done.forEach(b => { byU[b.name] = (byU[b.name]||0) + b.amount - (b.payout||0); });
  const typeOf = b => b.combo ? 'Hotovky' : b.legs.length === 1 ? 'Sólo' : b.bb ? 'Betbuildery' : 'AKO';
  const agg = key => { const o = {}; bs.forEach(b => { const k = key(b), r = (o[k] = o[k] || { n:0, t:0, dt:0, p:0 }); r.n++; r.t += b.amount; if (['won','lost','cashout'].includes(b.status)) { r.dt += b.amount; r.p += b.amount - (b.payout||0); } }); return o; };

  const arr = Object.values(days).sort((a,b) => a.t - b.t).slice(-14), mx = Math.max(1, ...arr.map(x => Math.abs(x.v)));

  return `<h2>Pokladna bookmakera</h2><div class="card"><div class="row sp"><span class="mut">Celkový zisk</span><b class="${profit<0?'neg':'pos'}" style="font-size:20px">${fmtS(profit)} b</b></div>${bars}<div class="mut" style="margin-top:6px">Zisk po dnech (posledních 14 dní)</div></div>
    <div class="kpi">
      <div><span class="mut">Zisk bookmakera</span><b class="${profit<0?'neg':'pos'}">${fmtS(profit)} b</b></div>

    <h2>Podle typu tiketu</h2><div class="card"><table class="tbl">${aggTbl(agg(typeOf)) || '<tr><td class="mut">Zatím nic</td></tr>'}</table><div class="mut" style="margin-top:6px">Vpravo tvůj zisk a marže (hold).</div></div>

      await updateDoc(doc(db,'markets',m.id), { options: withFair(m.options) }).catch(()=>{});

async function settleMarkets(entries){
  const res = Object.fromEntries(entries.map(e => [e.mid, e.win])), ids = entries.map(e => e.mid), found = new Map();
  for (let i = 0; i < ids.length; i += 30) { const s = await getDocs(query(collection(db,'bets'), where('mids','array-contains-any', ids.slice(i,i+30)))); s.forEach(x => found.set(x.id, x)); }
  const ops = [], add = {}, notes = []; let n = 0, c = S.cfg;
  const insQ = b => c.insOn && !b.combo && !b.bb && b.legs.length >= c.insMinLegs && b.legs.every(l => l.o >= c.insMinOdds);
  found.forEach(s => {
    const b = s.data(); if (!['open','pending'].includes(b.status)) return; n++;
    const legs = b.legs.map(l => (l.m in res && l.st === 'open') ? { ...l, st: res[l.m] === null ? 'void' : (l.i === res[l.m] ? 'won' : 'lost') } : l);
    let upd = { legs };
    const lostN = legs.filter(l => l.st === 'lost').length, openN = legs.filter(l => l.st === 'open').length;
    if (lostN === 1 && insQ(b)) {
      if (openN > 0) upd = { legs, ...(b.status === 'pending' && leftMs(b) <= 0 ? { status:'open' } : {}) };
      else { const r = c.insMax > 0 ? Math.min(b.amount, c.insMax) : b.amount; upd = { legs, status:'lost', payout:r, ins:true, settledAt: serverTimestamp() }; add[b.uid] = (add[b.uid]||0) + r; notes.push([b.uid, 'Pojištění tiketu', `Tiket #${b.no} nevyšel o jednu sázku, vracíme ${fmtN(r)} b.`]); }
    }
    else if (lostN > 0) { upd = { legs, status:'lost', payout:0, settledAt: serverTimestamp() }; notes.push([b.uid, 'Tiket nevyšel', `#${b.no}: ${legs.filter(l => l.st === 'lost').map(l => l.lbl).join(', ')}`]); }
    else if (legs.every(l => ['won','void'].includes(l.st))) {
      if (legs.every(l => l.st === 'void')) { upd = { legs, status:'void', payout:b.amount, settledAt: serverTimestamp() }; add[b.uid] = (add[b.uid]||0) + b.amount; notes.push([b.uid, 'Vklad vrácen', `Tiket #${b.no}: vracíme ${fmtN(b.amount)} b.`]); }
      else { const vd = legs.filter(l => l.st === 'void').reduce((p,l) => p * l.o, 1), p = Math.floor(b.amount * Math.max(1, b.odds / vd) + 1e-9); upd = { legs, status:'won', payout:p, settledAt: serverTimestamp() }; add[b.uid] = (add[b.uid]||0) + p; notes.push([b.uid, `Výhra ${fmtN(p)} b!`, `Tiket #${b.no} vyšel za kurz ${fmtOdds(b.odds)}.`]); }
    } else if (b.status === 'pending' && leftMs(b) <= 0) upd.status = 'open';
    ops.push([s.ref, upd]);
  });
  Object.entries(add).forEach(([uid,p]) => ops.push([doc(db,'users',uid), { points: increment(p) }]));
  entries.forEach(e => ops.push([doc(db,'markets',e.mid), { status: e.win === null ? 'cancelled' : 'settled', winnerIndex: e.win, settledAt: serverTimestamp() }]));
  for (let i = 0; i < ops.length; i += 450) { const bt = writeBatch(db); ops.slice(i,i+450).forEach(([r,d]) => bt.update(r,d)); await bt.commit(); }
  notes.forEach(([uid, t, m]) => pushUser(uid, t, m, t.startsWith('Výhra') ? 'tada' : 'ticket'));
  return n;
}
async function unsettleMarkets(ids){
  const set = new Set(ids), found = new Map();
  for (let i = 0; i < ids.length; i += 30) { const s = await getDocs(query(collection(db,'bets'), where('mids','array-contains-any', ids.slice(i,i+30)))); s.forEach(x => found.set(x.id, x)); }
  const ops = [], sub = {}; let n = 0;
  found.forEach(s => {
    const b = s.data(); if (['rejected','cashout'].includes(b.status) || b.voidedAt) return;
    if (!b.legs.some(l => set.has(l.m) && l.st !== 'open')) return; n++;
    const legs = b.legs.map(l => set.has(l.m) ? { ...l, st:'open' } : l);
    let status = b.status, payout = b.payout || 0;
    if (['won','void'].includes(b.status) || (b.status === 'lost' && payout > 0)) { sub[b.uid] = (sub[b.uid]||0) + payout; payout = 0; status = 'open'; }
    if (legs.some(l => l.st === 'lost')) status = 'lost'; else if (status === 'lost') status = 'open';
    ops.push([s.ref, { legs, status, payout, settledAt: null }]);
  });
  Object.entries(sub).forEach(([uid, p]) => ops.push([doc(db,'users',uid), { points: increment(-p) }]));
  ids.forEach(id => ops.push([doc(db,'markets',id), { status:'closed', winnerIndex:null, settledAt:null }]));
  for (let i = 0; i < ops.length; i += 450) { const bt = writeBatch(db); ops.slice(i,i+450).forEach(([r,d]) => bt.update(r,d)); await bt.commit(); }
  return n;
}

async function saveGroup(){
  const $e = document.getElementById('ferr'), title = document.getElementById('f_t').value.trim(), com = readCommon();
  const exclusive = document.getElementById('f_ex').checked, nobody = document.getElementById('f_nb').checked;
  const rows = []; let bad = '';
  $sheet.querySelectorAll('#grows .grow').forEach(r => {
    const label = r.querySelector('.rl').value.trim(), a = floor2(parseNum(r.querySelector('.ra').value) || 0), n = floor2(parseNum(r.querySelector('.rn').value) || 0), p = (parseNum(r.querySelector('.rp').value) || 0) / 100;

    if ((a && a < 1.01) || (n && n < 1.01)) bad = 'Kurz musí být aspoň 1,01 (prázdný = zamčeno ).';
    rows.push({ id: r.dataset.id, done: !!r.dataset.done, label, a, n, p });
  });
  if (!title) bad = 'Napiš otázku.'; else if (!rows.length) bad = 'Přidej aspoň jeden řádek.';
  if (bad) { $e.textContent = bad; return; }
  const live = rows.filter(r => !r.done);
  const err = surebetErr('group', live.map(r => ({ label:r.label, A:{ odds:r.a }, N:{ odds:r.n } })), { exclusive, nobody });
  if (err) { $e.textContent = err; return; }
  const gid = S.ctx.gid || doc(collection(db,'markets')).id, ev = com.evName ? 'ev:' + slug(com.evName) : 'g:' + gid;
  try {
    const bt = writeBatch(db);

      if (r.id) {
        const old = M(r.id); if (!old) return;

    });
    await bt.commit(); logA(S.ctx.gid ? 'Úprava sázky' : 'Nová sázka', `${title} (${rows.length} řádků)`); closeModal(); toast('Uloženo ');
  } catch(e){ $e.textContent = errTxt(e); }
}

function playerStats(uid){
  const bs = S.allBets.filter(b => b.uid === uid && !['rejected','void'].includes(b.status));
  const done = bs.filter(b => ['won','lost','cashout'].includes(b.status)), won = done.filter(b => b.status === 'won').length;
  const staked = done.reduce((s,b) => s + stakeOf(b), 0), paid = done.reduce((s,b) => s + paidOf(b), 0), profit = paid - staked, roi = staked ? profit / staked : 0;
  const cats = {}; bs.forEach(b => b.legs.forEach(l => { const c = M(l.m)?.category || l.t.split(' – ')[0]; cats[c] = (cats[c]||0) + 1; }));
  return { n: bs.length, done: done.length, won, staked, paid, profit, roi,
    avgOdds: bs.length ? bs.reduce((s,b) => s + b.odds, 0) / bs.length : 0, avgStake: bs.length ? bs.reduce((s,b) => s + stakeOf(b), 0) / bs.length : 0,
    best: done.reduce((m,b) => Math.max(m, paidOf(b) - stakeOf(b)), 0), ako: bs.length ? bs.filter(b => b.legs.length > 1).length / bs.length : 0,
    sharp: done.length >= 5 && profit > 0 && (roi > 0.2 || won / done.length > 0.6), cats };
}

function mkResult(m, r){
  const sp = sportOf(m), ln = m.ln ?? 0;
  switch (m.mk) {
    case '1x2': return r.h > r.a ? 0 : r.h < r.a ? 2 : 1;
    case 'ml': if (sp === 'mma') return r.w === 'h' ? 0 : r.w === 'a' ? 1 : null;
      return r.h > r.a ? 0 : r.h < r.a ? 1 : r.otw === 'h' ? 0 : r.otw === 'a' ? 1 : null;
    case 'dnb': return r.h > r.a ? 0 : r.h < r.a ? 1 : null;
    case 'ou': { const t = r.h + r.a; return t > ln ? 0 : t < ln ? 1 : null; }
    case 'btts': return r.h > 0 && r.a > 0 ? 0 : 1;
    case 'hcp': { const d = r.h + ln - r.a; return d > 0 ? 0 : d < 0 ? 1 : null; }
    case 'sets': { const i = m.options.findIndex(o => o.label === `${r.h}:${r.a}`); return i >= 0 ? i : undefined; }
    case 'method': return ({ ko:0, sub:1, dec:2 })[r.method];
    case 'dist': return r.method === 'dec' ? 0 : 1;
    case 'rnd': return r.method !== 'dec' && r.round === 1 ? 0 : 1;
    case 'ht': return r.hh == null ? undefined : r.hh > r.ha ? 0 : r.hh < r.ha ? 2 : 1;
    case 'p1': return r.p1h == null ? undefined : r.p1h > r.p1a ? 0 : r.p1h < r.p1a ? 2 : 1;
    case 'htft': { if (r.hh == null) return undefined; const g = (x, y) => x > y ? '1' : x < y ? '2' : 'X', i = m.options.findIndex(o => o.s === `${g(r.hh, r.ha)}/${g(r.h, r.a)}`); return i >= 0 ? i : undefined; }
    case 'cs': { const i = m.options.findIndex(o => o.label === `${r.h}:${r.a}`); return i >= 0 ? i : m.options.findIndex(o => o.label === 'Jiný výsledek'); }
    case 'cor': return r.cor == null ? undefined : r.cor > ln ? 0 : r.cor < ln ? 1 : null;
    case 'crd': return r.crd == null ? undefined : r.crd > ln ? 0 : r.crd < ln ? 1 : null;
    case 'fg': return r.h + r.a === 0 ? 2 : undefined;
    case 'fs': return r.h + r.a === 0 ? (m.options.findIndex(o => /bez gólu|nikdo/i.test(o.label)) >= 0 ? m.options.findIndex(o => /bez gólu|nikdo/i.test(o.label)) : undefined) : undefined;
    case 'set1': return r.s1 === 'h' ? 0 : r.s1 === 'a' ? 1 : undefined;
    case 'rnds': { if (r.method === 'dec') return 0; const t = r.round - 1 + (r.t != null ? r.t / 5 : 0.5); if (r.t == null && Math.abs(t - ln) < 1) return undefined; return t > ln ? 0 : 1; }
  }
  return undefined;
}

function measStats(s){
  const v = s.vals.map(x => x.v), n = v.length; if (!n) return { n: 0 };
  const mean = v.reduce((a,b) => a + b, 0) / n, sd = Math.sqrt(v.reduce((a,b) => a + (b - mean) ** 2, 0) / Math.max(1, n - 1)), so = [...v].sort((a,b) => a - b);
  return { n, mean, sd, med: n % 2 ? so[(n-1)/2] : (so[n/2-1] + so[n/2]) / 2, min: so[0], max: so[n-1] };
}
function erf(x){ const s = x < 0 ? -1 : 1; x = Math.abs(x); const t = 1 / (1 + 0.3275911 * x);
  return s * (1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x)); }
function pOver(s, st, line){
  let p;
  if (s.type === 'count') { const lam = Math.max(0.05, st.mean), k = Math.floor(line); let cdf = 0, term = Math.exp(-lam); for (let i = 0; i <= k; i++) { cdf += term; term *= lam / (i + 1); } p = 1 - cdf; }
  else { const sd = Math.max(st.sd || 0, Math.abs(st.mean) * 0.1, 0.5); p = 1 - 0.5 * (1 + erf((line - st.mean) / sd / Math.SQRT2)); }
  return Math.min(0.97, Math.max(0.03, p));
}
function measLines(s, st){
  if (s.type === 'count') { const b = Math.max(0, Math.floor(st.mean)) + 0.5; return [b - 1, b, b + 1].filter(x => x > 0); }
  const step = st.mean < 10 ? 1 : st.mean < 60 ? 5 : st.mean < 300 ? 10 : 30, b = Math.round(st.med / step) * step;
  return [b - step, b, b + step].filter(x => x > 0).map(x => x + 0.5);
}

function openCash(bid){

  const keep = sel >= 1 ? 0 : Math.max(1, b.amount - Math.max(1, Math.round(b.amount * sel))), part = sel >= 1 ? v : Math.floor(v * (b.amount - keep) / b.amount);

    <div class="card" style="background:var(--card2);margin-top:12px;text-align:center"><div class="mut">Dostaneš teď</div><div class="big" style="font-size:36px">${fmtN(part)} b</div>
      ${keep ? `<div class="mut" style="margin-top:6px">Dál hraje ${fmtN(keep)} b, možná výhra ${fmtN(Math.floor(keep * b.odds + 1e-9))} b</div>` : '<div class="mut" style="margin-top:6px">Tiket se tím uzavře.</div>'}</div>
    <div class="err" id="cash_e"></div>
    <div class="row" style="margin-top:12px"><button class="btn full" data-act="close">Zpět</button><button class="btn ok full" data-act="cashgo" data-b="${bid}" data-v="${part}" data-k="${keep}">Vyplatit ${fmtN(part)} b</button></div>`, { keep:true, type:'cash', bid, frac: sel });
}
async function cashPart(bid, shown, keep){
  try {
    const v = await runTransaction(db, async tx => {
      const bref = doc(db,'bets',bid), uref = doc(db,'users',S.user.uid), cref = doc(db,'config','main');
      const bs = await tx.get(bref), us = await tx.get(uref), cs = await tx.get(cref);
      const b = bs.data(), c = { ...DEF_CFG, ...(cs.exists() ? cs.data() : {}) }, ud = us.data();
      if (!c.cashout || c.suspendAll || ud.cashMode === 'off') throw new Error('Cash-out teď nejde.');
      if (!(b.status === 'open' || (b.status === 'pending' && leftMs({createdAt:b.createdAt}) <= 0))) throw new Error('Cash-out teď nejde.');
      let den = 1;
      for (const l of b.legs) {
        if (l.st === 'won') continue; if (l.st === 'void') { den *= l.o; continue; }
        if (l.st === 'lost') throw new Error('Tiket už prohrál.');
        const m = (await tx.get(doc(db,'markets',l.m))).data(), o = m.options[l.i];
        if (m.status !== 'open' || m.suspended || o.locked || !(o.odds > 1) || (ms(m.closesAt) && ms(m.closesAt) < Date.now())) throw new Error('Cash-out je teď zamčený.');
        den *= o.odds;
      }
      const cm = ud.cashMode === 'bad' ? (ud.cashM ?? 0.3) : c.cashMargin;
      if (!keep) {
        const val = Math.floor(b.amount * b.odds / den * (1 - cm) + 1e-9);
        if (val < 1) throw new Error('Cash-out teď nejde.');
        if (val < shown) throw new Error(`Hodnota se změnila na ${fmtN(val)} b, zkus to znovu.`);
        tx.update(bref, { status:'cashout', payout: val, cashedAt: serverTimestamp() });
        tx.update(uref, { points: ud.points + val, lastCash: bid });
        return val;
      }
      if (!(keep >= 1 && keep < b.amount)) throw new Error('Tiket se mezitím změnil.');
      const val = Math.floor((b.amount - keep) * b.odds / den * (1 - cm) + 1e-9);
      if (val < 1) throw new Error('Na částečný výběr je tiket moc malý.');
      if (val < shown) throw new Error(`Hodnota se změnila na ${fmtN(val)} b, zkus to znovu.`);
      tx.update(bref, { amount: keep, cashed: (b.cashed || 0) + val, a0: b.a0 || b.amount, cashedAt: serverTimestamp() });
      tx.update(uref, { points: ud.points + val, lastCash: bid });
      return val;
    });
    closeModal(); confetti(.4); toast(`Vyplaceno ${fmtN(v)} b`);
  } catch(e){ const $e = document.getElementById('cash_e'); const t = e.code ? errTxt(e) : e.message; if ($e) $e.textContent = t; else toast(t, true); }
}

const commNew = () => S.tab !== 'comm' && S.feed.some(f => ms(f.t) > (ls.get('commSeen_' + S.user.uid) || 0) && f.uid !== S.user.uid);
function feedLegSt(l){
  const m = M(l.m); if (!m) return l.st || 'open';
  if (m.status === 'cancelled') return 'void';
  if (m.status === 'settled') return m.winnerIndex === l.i ? 'won' : 'lost';
  return 'open';
}
function feedCard(f){
  const sts = f.legs.map(feedLegSt), st = sts.includes('lost') ? 'lost' : sts.every(x => x !== 'open') ? (sts.every(x => x === 'void') ? 'void' : 'won') : 'open';
  const liked = (f.likes || []).includes(S.user.uid), mine = f.uid === S.user.uid;
  const li = { won:'circle-check', lost:'circle-x', void:'undo-2', open:'circle-dot' };
  const badge = { won:['open','Vyšel'], lost:['cancelled','Nevyšel'], void:['settled','Vráceno'], open:['closed','Ve hře'] }[st];
  const win = Math.floor(f.amount * f.odds + 1e-9);
  return `<article class="feed ${st}"><div class="row sp"><div class="row"><span class="ava sm">${esc((f.name || '?')[0].toUpperCase())}</span><div><b>${esc(f.name)}</b><div class="mut sm">${whenTxt(ms(f.t) || Date.now())}</div></div></div><span class="badge ${badge[0]}">${badge[1]}</span></div>
    ${f.text ? `<p class="feed-t">${esc(f.text)}</p>` : ''}
    <div class="feed-legs">${f.legs.map((l, k) => `<div class="leg"><span class="st ${sts[k]}">${ic(li[sts[k]])}</span><div><div class="mut">${esc(l.t)}</div><div class="b">${esc(l.lbl)}</div></div><span class="lo">${fmtOdds(l.o)}</span></div>`).join('')}</div>
    <div class="feed-sum"><span>Kurz <b>${fmtOdds(f.odds)}</b></span><span>Vklad <b>${fmtN(f.amount)} b</b></span><span>${st === 'won' ? 'Vyhrál' : 'Výhra'} <b class="${st === 'won' ? 'pos' : ''}">${fmtN(win)} b</b></span></div>
    <div class="feed-act"><button class="like ${liked ? 'on' : ''}" data-act="like" data-f="${f.id}" aria-label="Oheň">${ic('flame')}<span>${(f.likes || []).length || ''}</span></button>
      ${st === 'open' && !mine ? `<button class="btn sm pri" data-act="copytk" data-f="${f.id}">${ic('copy')}Vsadit taky</button>` : '<span></span>'}

}

function copyTicket(fid){
  const f = S.feed.find(x => x.id === fid); if (!f) return;
  let added = 0, skip = 0;
  for (const l of f.legs) { const m = M(l.m);
    if (!m || !optAvail(m, l.i) || S.slip.some(s => s.m === l.m)) { skip++; continue; }
    if (comboErr(m, l.i, S.slip)) { skip++; continue; }
    S.slip.push({ m: l.m, i: l.i }); S.seenOdds[`${l.m}:${l.i}`] = m.options[l.i].odds; added++; }
  ls.set('slip_' + S.user.uid, S.slip); S.slipMode = 'ako';
  if (!added) { toast('Tyhle sázky už teď vsadit nejde.', true); return; }
  toast(skip ? `Přidáno ${added} z ${f.legs.length} sázek, zbytek už nejde` : `Přidáno na tiket (${added})`);
  renderSlip();
}

// ---- podezřelé sázení: víc hráčů najednou na outsidera, nebo nezvykle velký vklad ----
function suspList(){
  const now = Date.now(), out = [], recent = S.allBets.filter(b => ['open','pending','offer'].includes(b.status) && now - (ms(b.createdAt) || now) < 45 * 60e3);
  const by = {};
  recent.forEach(b => b.legs.forEach(l => { const k = l.m + ':' + l.i; (by[k] = by[k] || { l, users: new Set(), sum: 0, bets: [] }); by[k].users.add(b.uid); by[k].sum += b.amount; by[k].bets.push(b); }));
  Object.entries(by).forEach(([k, x]) => { if (x.users.size >= 3 && x.l.o >= 3) out.push({ k, txt: `${x.users.size} hráčů za poslední půlhodinu na „${x.l.lbl}“ (kurz ${fmtOdds(x.l.o)})`, sub: x.l.t, sum: x.sum }); });
  recent.forEach(b => { const prev = S.allBets.filter(y => y.uid === b.uid && y.id !== b.id && !['rejected','void'].includes(y.status));
    if (prev.length < 3) return; const avg = prev.reduce((s, y) => s + stakeOf(y), 0) / prev.length;
    if (b.amount >= 4 * avg && b.amount >= 100 && b.odds >= 2.5) out.push({ k: 'big:' + b.id, txt: `${b.name} vsadil ${fmtN(b.amount)} b (běžně kolem ${fmtN(Math.round(avg))} b) za kurz ${fmtOdds(b.odds)}`, sub: b.legs.map(l => l.lbl).join(' + '), sum: b.amount }); });
  return out;
}
function suspBlock(){
  const L = suspList(); if (!L.length) return '';
  L.forEach(x => { const key = 'susp_' + x.k; if (!ls.get(key)) { ls.set(key, 1); ntfy('⚠️ Podezřelé sázení', `${x.txt}\n${x.sub}`); } });
  return `<h2 style="margin-top:16px">${ic('triangle-alert')}Podezřelé sázení</h2>${L.map(x => `<div class="card warnc"><b>${esc(x.txt)}</b><div class="mut sm">${esc(x.sub)}</div></div>`).join('')}

}

function cleanMarket(m){
  const { id, createdAt, settledAt, status, winnerIndex, suspended, score, special, ...rest } = m;
  const day = tplDay(ms(m.closesAt) || ms(m.startAt) || Date.now());
  return { ...rest, options: m.options.map(o => ({ label:o.label, odds:o.boostFrom > 1 ? o.boostFrom : o.odds, p:o.p || 0, ...(o.s ? { s:o.s } : {}), ...(o.locked ? { locked:true } : {}) })),
    closesAt: ms(m.closesAt) ? ms(m.closesAt) - day : null, startAt: ms(m.startAt) ? ms(m.startAt) - day : null };
}
async function saveTpl(){
  const name = document.getElementById('tn_n').value.trim(), keys = [...$sheet.querySelectorAll('.tn_i:checked')].map(x => x.value), $e = document.getElementById('tn_e');
  if (!name) { $e.textContent = 'Napiš název šablony.'; return; }
  if (!keys.length) { $e.textContent = 'Vyber aspoň jednu sázku.'; return; }
  const all = dispItems(), rows = keys.flatMap(k => (all.find(i => itemKey(i) === k)?.rows || [])).map(cleanMarket);
  const id = Math.random().toString(36).slice(2, 9);
  S.tpl = { ...(S.tpl || {}), [id]: { name, t: Date.now(), items: rows } };
  try { await setDoc(doc(db,'admin','templates'), { list: S.tpl }); toast('Šablona uložena'); openTpls(); }
  catch(e){ $e.textContent = errTxt(e); }
}
async function useTpl(id){
  const t = S.tpl[id], dv = document.getElementById('tp_d')?.value; if (!t) return;
  const day = dv ? +new Date(dv + 'T00:00') : tplDay(Date.now());
  const remap = {}, nid = old => remap[old] || (remap[old] = doc(collection(db,'markets')).id);
  const ops = t.items.map(m => {
    const id = doc(collection(db,'markets')).id, d = { ...m };
    if (m.kind === 'row') { d.grp = nid('g' + m.grp); d.ev = m.ev?.startsWith('g:') ? 'g:' + d.grp : m.ev; }
    else if (m.mtId) { const mt = nid('mt' + m.mtId); d.mtId = mt; d.ev = 'mt:' + mt; d.grp = `${mt}|${m.fam || 'x' + Math.random().toString(36).slice(2, 6)}`; }
    else { d.grp = id; d.ev = m.ev?.startsWith('m:') ? 'm:' + id : m.ev; }
    d.closesAt = m.closesAt != null ? Timestamp.fromDate(new Date(day + m.closesAt)) : null;
    if (m.startAt != null) d.startAt = Timestamp.fromDate(new Date(day + m.startAt)); else delete d.startAt;
    if (m.inplay) d.closesAt = null;
    d.options = withFair(m.options.map(o => ({ ...o, tl:0 })));
    return [id, { ...d, status:'open', suspended:false, winnerIndex:null, score:null, special:false, createdAt: serverTimestamp() }];
  });
  if (ops.some(([, d]) => ms(d.closesAt) && ms(d.closesAt) < Date.now()) && !confirm('Některé uzávěrky už na zvolený den proběhly. Vypsat přesto?')) return;
  try { for (let i = 0; i < ops.length; i += 400) { const bt = writeBatch(db); ops.slice(i, i + 400).forEach(([id, d]) => bt.set(doc(db,'markets',id), d)); await bt.commit(); }
    logA('Šablona dne', `${t.name}: ${ops.length} sázek`); closeModal(); toast(`Vypsáno ${ops.length} sázek`); }
  catch(e){ toast(errTxt(e), true); }
}

// ---- vložení kurzů z Tipsportu ----
function pasteOdds(){
  const t = document.getElementById('mf_paste').value; if (!t.trim()) { toast('Nejdřív vlož text.', true); return; }
  const tm = /^\s*([^\n\d]{2,40}?)\s+[-–]\s+([^\n\d]{2,40}?)\s*$/m.exec(t);
  if (tm) { if (!document.getElementById('mf_h').value) document.getElementById('mf_h').value = tm[1].trim(); if (!document.getElementById('mf_a').value) document.getElementById('mf_a').value = tm[2].trim(); }
  // kurzy = desetinná čísla; hranice („Více než 2,5“, „+1,5“) a data/časy se přeskočí
  const nums = [...t.matchAll(/(?<![\d.,:])(\d{1,3}[.,]\d{1,2})(?![\d.,:])/g)]
    .filter(m => !/(více|méně|vice|mene|over|under|nad|pod|než|nez|handicap|hcp|[+\-−])\s*(než|nez)?\s*$/i.test(t.slice(Math.max(0, m.index - 14), m.index)))
    .map(m => parseNum(m[1])).filter(x => x >= 1.01 && x < 1000);
  const ins = [...$sheet.querySelectorAll('#mf_mk .mkrow')].filter(r => r.querySelector('.mkon').checked).flatMap(r => [...r.querySelectorAll('.mo')]);
  let k = 0; for (const el of ins) { if (k >= nums.length) break; el.value = fln(nums[k++]); }
  toast(k ? `Načteno ${k} kurzů${nums.length > k ? `, ${nums.length - k} navíc nepoužito` : ''}. Zkontroluj je.` : 'V textu jsem nenašel žádné kurzy.', !k);
}
