<script type="module">
/* ================== NASTAVENÍ – VYPLŇ ================== */
const firebaseConfig = {
  apiKey: "AIzaSyB-S1-8YKW-FaeDWIwdotc-Z81gdeo0Gjs",
  authDomain: "riskobet-63c24.firebaseapp.com",
  projectId: "riskobet-63c24",
  storageBucket: "riskobet-63c24.firebasestorage.app",
  messagingSenderId: "208503709912",
  appId: "1:208503709912:web:3ce4e76847ad9d2d81b7ad"
};
const ADMIN_USER = "richard";      // přihlašovací jméno admina (musí sedět s firestore.rules)
const START_POINTS = 1000;         // startovní body (musí sedět s firestore.rules)
const DOMAIN = "sazkovka.app";     // jen technická koncovka pro Firebase
const APP_NAME = "Třídní sázkovka";
const AUTO_MS = 150000;
const MAX_LEGS = 8;
/* ====================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query, where, runTransaction, writeBatch, serverTimestamp, increment, Timestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const DEF_CFG = { approvalLimit:0, ntfyTopic:'', margin:0.08, bbMargin:0.15, cashout:true, cashMargin:0.10, dropEvery:0, dropPct:0.05, maxStake:0, maxWin:0, maxLegs:8, suspendAll:false, bells:'8:00,8:55,9:55,10:50,11:45,12:40,13:35,14:30', riskAlert:0, quick:[], akoOn:false, akoN1:4, akoP1:0.05, akoN2:6, akoP2:0.10, akoMin:1.2, insOn:false, insMinLegs:4, insMinOdds:1.3, insMax:0, boostMax:0, combos:{}, promos:[], maxMarket:0, autoSuspend:0, liveDelay:5, ladder:true, offerTtl:3 };
const $app = document.getElementById('app'), $modal = document.getElementById('modal'), $sheet = document.getElementById('sheet');
const S = { user:null, profile:null, markets:[], myBets:[], allBets:[], users:[], cfg:{...DEF_CFG}, cfgLoaded:false,
  tab:'markets', adminSub:'events', feedFilter:'pending', authMode:'login', unsubs:[], registering:false, ctx:null,
  seen:new Set(), betsLoaded:false, slip:[], seenOdds:{}, slipAmt:'', slipSig:'', catFilter: 'all', showStats: new Set(), archive:false, archCat:'all', slipCombo:null };
const WANT_ADMIN = new URLSearchParams(location.search).has('schvalit');

/* ================== POMOCNÉ ================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim().replace(/\s+/g,'.').replace(/[^a-z0-9._-]/g,'');
const emailOf = u => `${slug(u)}@${DOMAIN}`;
const isAdmin = () => !!S.user && S.user.email === emailOf(ADMIN_USER);
const fmtOdds = o => (o > 1) ? Number(o).toFixed(2).replace('.', ',') : '–';
const fmtN = n => Math.round(Number(n||0)).toLocaleString('cs-CZ');
const fmtS = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmtN(Math.abs(n));
const parseNum = v => parseFloat(String(v ?? '').replace(',', '.'));
const floor2 = x => Math.floor(x * 100 + 1e-7) / 100;
const ms = t => t?.toMillis ? t.toMillis() : null;
const fmtDate = t => { const m = ms(t); return m ? new Date(m).toLocaleString('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}) : ''; };
const toLocalInput = t => ms(t) ? new Date(ms(t) - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : '';
const M = id => S.markets.find(m => m.id === id);
const effStatus = m => (m.status === 'open' && ms(m.closesAt) && ms(m.closesAt) < Date.now()) ? 'closed' : m.status;
const isLive = m => ['open','closed'].includes(m.status);
const boostExpired = o => o?.boostFrom > 1 && ms(o.boostUntil) && ms(o.boostUntil) < Date.now();
const optAvail = (m, i) => { const o = m?.options?.[i]; return !!o && effStatus(m) === 'open' && !m.suspended && !S.cfg.suspendAll && !o.locked && o.odds > 1 && !boostExpired(o); };
const legTitle = m => m.kind === 'row' ? `${m.groupTitle} – ${m.rowLabel}` : m.title;
const leftMs = b => ms(b.createdAt) ? AUTO_MS - (Date.now() - ms(b.createdAt)) : AUTO_MS;
const betSt = b => (b.status === 'pending' && leftMs(b) <= 0) ? 'open' : b.status;
const possWin = b => Math.floor(b.amount * b.odds + 1e-9);
const me = () => S.users.find(x => x.id === S.user?.uid) || S.profile || {};
const effLimit = (k) => { const u = me(); return (u[k] > 0) ? u[k] : Math.floor((S.cfg[k] || 0) * (u.factor > 0 ? u.factor : 1)); };
const isBlocked = u => u?.block === 'view' && (!ms(u.blockUntil) || ms(u.blockUntil) > Date.now());
const pct = f => Math.round((f || 0) * 1000) / 10;
const STATUS_TXT = { open:'Otevřeno', closed:'Uzavřeno', settled:'Vyhodnoceno', cancelled:'Zrušeno' };
const BET_TXT = { offer:'Protinabídka', open:'Přijato', pending:'Čeká na schválení', won:'Výhra', lost:'Prohra', void:'Stornováno', rejected:'Zamítnuto', cashout:'Cash-out' };
const LEG_ICON = { open:'⏳', won:'✅', lost:'❌', void:'↩️' };

function toast(msg, bad){ const d=document.createElement('div'); d.className='toast'; if(bad) d.style.background='var(--red)'; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(), 2800); }
function openModal(html, ctx){ S.ctx = ctx || null; $sheet.innerHTML = html; $modal.classList.add('show'); }
function closeModal(){ $modal.classList.remove('show'); $sheet.innerHTML=''; S.ctx=null; render(); setTimeout(checkResults, 50); }
$modal.addEventListener('click', e => { if (e.target === $modal) closeModal(); });
const ls = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* ---- kurzy z pravděpodobnosti + kontrola surebetu ---- */
// standardní stupnice kurzů (jako u sázkovek): kurz se vždy zaokrouhlí dolů na běžnou hodnotu
const LADDER = [[2,0.01],[3,0.02],[4,0.05],[6,0.1],[10,0.2],[20,0.5],[30,1],[50,2],[100,5],[1000,10]];
function ladderDown(o){ if (!(o > 1) || S.cfg.ladder === false) return o; let lo = 1;
  for (const [hi, st] of LADDER) { if (o <= hi + 1e-9) return Math.max(1.01, Math.round((lo + Math.floor((o - lo) / st + 1e-9) * st) * 100) / 100); lo = hi; }
  return Math.floor(o); }
function ladderStep(o, dir){
  if (S.cfg.ladder === false) return Math.max(1.01, floor2(o + dir * (o < 1.5 ? 0.01 : o < 3 ? 0.05 : o < 6 ? 0.1 : 0.25)));
  const v = ladderDown(o); if (dir < 0 && v < o - 1e-9) return v;

  return e?.message || 'Něco se pokazilo.';
}

/* ================== SKUPINY ================== */
function buildItems(markets){
  const groups = {}, items = [];
  for (const m of markets) {
    if (m.kind === 'row') {
      if (!groups[m.grp]) { groups[m.grp] = { type:'g', id:m.grp, title:m.groupTitle, category:m.category, closesAt:m.closesAt, ev:m.ev, bb:m.bb, exclusive:m.exclusive, nobody:m.nobody, rows:[] }; items.push(groups[m.grp]); }
      groups[m.grp].rows.push(m);
    } else items.push({ type:'s', id:m.id, m, rows:[m] });
  }
  Object.values(groups).forEach(g => g.rows.sort((a,b) => (a.order??0) - (b.order??0)));
  return items;
}
function itemStatus(it){
  const ss = it.rows.map(effStatus);
  return ss.includes('open') ? 'open' : ss.includes('closed') ? 'closed' : 'done';

/* ================== TIKET (SLIP) ================== */
function comboErr(m, i, slip){
  const o = m.options[i];
  if (slip.length >= Math.min(MAX_LEGS, S.cfg.maxLegs || MAX_LEGS)) return `Na tiketu může být max. ${Math.min(MAX_LEGS, S.cfg.maxLegs || MAX_LEGS)} sázek.`;
  if (o.boostFrom > 1 && slip.length) return 'Zvýšený kurz 🔥 jde vsadit jen samostatně.';
  for (const s of slip) {
    const lm = M(s.m); if (!lm) continue;
    if (lm.options[s.i]?.boostFrom > 1) return 'Na tiketu je zvýšený kurz 🔥 – ten jde vsadit jen samostatně.';
    if (lm.ev === m.ev && !(lm.bb && m.bb)) return 'Tyhle sázky nejde kombinovat na jeden tiket.';
    if (lm.grp === m.grp && m.exclusive && (i === 0 || s.i === 0)) return 'Tady může platit ANO jen u jednoho – ANO nejde kombinovat s dalším řádkem téže sázky.';
  }
  return '';
}
function pick(mid, i){
  const m = M(mid); if (!m || !optAvail(m, i)) return;
  const idx = S.slip.findIndex(s => s.m === mid);
  if (idx >= 0 && S.slip[idx].i === i) { S.slip.splice(idx, 1); }
  else {
    const rest = S.slip.filter(s => s.m !== mid);
    const err = comboErr(m, i, rest);
    if (err) { toast(err, true); return; }
    S.slip = [...rest, { m: mid, i }];
    S.seenOdds[`${mid}:${i}`] = m.options[i].odds;
  }
  S.slipCombo = null; ls.set('slipc_' + S.user.uid, null);
  ls.set('slip_' + S.user.uid, S.slip); render();
}
function akoPct(n){ const c = S.cfg; return n >= c.akoN2 ? c.akoP2 : n >= c.akoN1 ? c.akoP1 : 0; }
function slipData(){
  const legs = S.slip.map(s => {
    const m = M(s.m); if (!m) return { s, gone:true };
    const o = m.options[s.i], key = `${s.m}:${s.i}`;
    if (S.seenOdds[key] === undefined) S.seenOdds[key] = o.odds;
    return { s, m, o, key, avail: optAvail(m, s.i), odds: o.odds, seen: S.seenOdds[key], changed: S.seenOdds[key] !== o.odds };
  });
  const ok = legs.filter(l => !l.gone && l.avail);
  const prod = ok.reduce((p,l) => p * l.odds, 1);
  const evs = ok.map(l => l.m.ev), bb = new Set(evs).size < evs.length;
  let total = ok.length ? (bb ? floor2(1 + (prod - 1) * (1 - S.cfg.bbMargin)) : floor2(prod)) : 0;
  let combo = null, comboErr = '', bonus = 0, ins = false;
  const cb = S.slipCombo ? S.cfg.combos?.[S.slipCombo] : null;
  if (cb && cb.legs.length === S.slip.length && cb.legs.every((l, k) => l.m === S.slip[k].m && l.i === S.slip[k].i)) {
    combo = { id: S.slipCombo, ...cb }; const st = comboState(combo);
    if (st.ok) total = cb.odds; else comboErr = `Hotovka: ${st.why}`;
  } else if (S.slipCombo) { S.slipCombo = null; }
  if (!combo && !bb && ok.length === legs.length && S.cfg.akoOn && ok.length >= 2 && ok.every(l => l.odds >= S.cfg.akoMin) && !ok.some(l => l.o.boostFrom > 1)) {
    const pc = akoPct(ok.length);
    if (pc > 0) { const t = floor2(Math.min(prod * (1 + pc), fairCap(ok.map(l => ({ m:l.m, i:l.s.i }))))); if (t > total) { bonus = pc; total = t; } }
  }
  if (!combo && !bb && S.cfg.insOn && ok.length >= S.cfg.insMinLegs && ok.every(l => l.odds >= S.cfg.insMinOdds)) ins = true;
  return { legs, ok, prod, bb, total, combo, comboErr, bonus, ins, bad: legs.some(l => l.gone || !l.avail) || !!comboErr, changed: legs.some(l => l.changed && !l.gone) };
}
function renderSlip(){
  const d = slipData();
  const sig = JSON.stringify([d.legs.map(l => [l.s.m, l.s.i, l.odds, l.avail, l.seen]), d.total, S.profile?.points, S.cfg.suspendAll, d.comboErr, d.bonus]);
  if (S.ctx?.type === 'slip' && sig === S.slipSig && $sheet.querySelector('#amt')) { updSlipTotals(); return; }
  S.slipSig = sig;
  if (!S.slip.length) { closeModal(); return; }
  const kind = d.combo ? '<span class="badge soon">🔥 Hotovka</span>' : d.ok.length > 1 ? (d.bb ? '<span class="badge bb">🧩 Betbuilder</span>' : '<span class="badge">AKO</span>') : '<span class="badge">SÓLO</span>';
  const legsHtml = d.legs.map(l => {
    if (l.gone) return `<div class="leg"><span>⚠️</span><div class="mut">Sázka už neexistuje</div><button class="btn sm out" data-act="unpick" data-m="${l.s.m}">✕</button></div>`;
    const ch = l.changed ? `<span class="${l.odds > l.seen ? 'pos' : 'neg'}" style="font-size:12px">${fmtOdds(l.seen)} → </span>` : '';

async function placeBet(){

  if (effLimit('boostMax') && d.ok.length === 1 && d.ok[0].o.boostFrom > 1 && amount > effLimit('boostMax')) { $e.textContent = `Max. vklad na zvýšený kurz je ${fmtN(effLimit('boostMax'))} b.`; return; }
  if (isBlocked(me())) { $e.textContent = 'Sázení máš momentálně pozastavené.'; return; }

  }

    const res = await runTransaction(db, async tx => {
      const uref = doc(db,'users',S.user.uid), cref = doc(db,'config','main');
      const us = await tx.get(uref), cs = await tx.get(cref);
      const msnaps = []; for (const s of slip) msnaps.push(await tx.get(doc(db,'markets',s.m)));
      const c = { ...DEF_CFG, ...(cs.exists() ? cs.data() : {}) }, pts = us.data().points;
      const ud = us.data();
      if (c.suspendAll) throw new Error('Sázení je pozastavené.');
      if (isBlocked(ud)) throw new Error('Sázení máš momentálně pozastavené.');
      if (amount > pts) throw new Error('Nemáš dost bodů.');
      const legs = [], mUpd = [], oldOpts = {}, newOpts = {}, fresh = [];
      slip.forEach((s, k) => {
        const sn = msnaps[k]; if (!sn.exists()) throw new Error('Některá sázka už neexistuje.');
        const m = { id: sn.id, ...sn.data() }, o = m.options[s.i];
        if (m.status !== 'open' || m.suspended || o.locked || !(o.odds > 1) || (ms(m.closesAt) && ms(m.closesAt) < Date.now())) throw new Error(`„${legTitle(m)}“ teď nejde vsadit.`);
        if (o.odds !== seen[`${s.m}:${s.i}`]) { const e = new Error('ODDS'); e.odds = true; throw e; }
        legs.push({ m: m.id, i: s.i, o: o.odds, e: m.ev, g: m.grp, lbl: o.label, t: legTitle(m), st: 'open' });
        // počítadlo vsazených bodů + automatický pokles kurzu
        const tl = o.tl || 0; let odds = o.odds;
        if (c.dropEvery > 0 && c.dropPct > 0) { const n = Math.floor((tl + amount) / c.dropEvery) - Math.floor(tl / c.dropEvery); if (n > 0) odds = Math.max(1.01, floor2(odds * Math.pow(1 - c.dropPct, n))); }
        fresh.push({ m, i: s.i });
        const nOpts = m.options.map((x, k2) => k2 === s.i ? { ...x, tl: tl + amount, pw: (x.pw || 0) + Math.floor(amount * o.odds), n: (x.n || 0) + 1, odds,
          ...(odds !== o.odds ? { prev: o.odds, prevAt: Timestamp.fromDate(new Date()), h: [...(x.h || []), { t: Date.now(), o: odds }].slice(-20) } : {}) } : x);
        oldOpts[m.id] = m.options; newOpts[m.id] = nOpts; mUpd.push([sn.ref, nOpts]);
      });
      const prod = legs.reduce((p,l) => p * l.o, 1), evs = legs.map(l => l.e), bb = new Set(evs).size < evs.length;

      if (comboId) {

        if (cb.legs.length !== legs.length || cb.legs.some((l, k) => l.m !== legs[k].m || l.i !== legs[k].i)) throw new Error('Hotovka se změnila.');
        if (cb.maxStake && amount > cb.maxStake) throw new Error(`Max. vklad na hotovku je ${fmtN(cb.maxStake)} b.`);
        if (cb.odds > fairCap(fresh) + 1e-9) throw new Error('Hotovka je teď zamčená.');
        total = cb.odds;
      } else if (!bb && c.akoOn && legs.length >= 2 && legs.every(l => l.o >= c.akoMin)) {
        const pc = legs.length >= c.akoN2 ? c.akoP2 : legs.length >= c.akoN1 ? c.akoP1 : 0;
        if (pc > 0) { const t = floor2(Math.min(prod * (1 + pc), fairCap(fresh))); if (t > total) { bonus = pc; total = t; } }
      }
      if (total < 1.01) throw new Error('Kurz je moc nízký.');
      const alim = ud.apprLimit > 0 ? ud.apprLimit : c.approvalLimit;
      const status = (ud.apprAll === true || (alim > 0 && amount * total > alim)) ? 'pending' : 'open';
      tx.update(uref, { points: pts - amount });
      const bdata = { uid:S.user.uid, name:S.profile.name, no: 'T' + Math.random().toString(36).slice(2,8).toUpperCase(), legs, mids: legs.map(l=>l.m), ev: evs, grp: legs.map(l=>l.g), odds: total, bb, amount, status, payout: 0, createdAt: serverTimestamp() };
      if (cb) { bdata.combo = comboId; bdata.ctitle = cb.title; }

      return { status, total, legs, oldOpts, newOpts };
    });

    try { riskCheck(res.oldOpts, res.newOpts); } catch {}
    if (res.status === 'pending') {
      ntfy('🎲 Tiket ke schválení', `${S.profile.name}: ${res.legs.map(l => `${l.t} – ${l.lbl}`).join(' + ')}\nKurz ${fmtOdds(res.total)} · vklad ${fmtN(amount)} b → výhra ${fmtN(amount*res.total)} b`);

  } catch(e){

/* ================== TIKETY ================== */
function cashValue(b){
  if (!S.cfg.cashout || S.cfg.suspendAll || b.uid !== S.user?.uid || me().cashMode === 'off') return 0;
  const st = betSt(b); if (st !== 'open') return 0;
  if (!b.legs.some(l => l.st === 'open') || b.legs.some(l => l.st === 'lost')) return 0;
  let den = 1;
  for (const l of b.legs) {
    if (l.st === 'won') continue;
    if (l.st === 'void') { den *= l.o; continue; }
    const m = M(l.m); if (!m || !optAvail(m, l.i)) return 0;
    den *= m.options[l.i].odds;
  }
  const cm = me().cashMode === 'bad' ? (me().cashM ?? 0.3) : S.cfg.cashMargin;
  return Math.floor(b.amount * b.odds / den * (1 - cm) + 1e-9);
}

      ${!showName && b.uid === S.user?.uid ? `<div class="row" style="margin-top:8px"><button class="btn no full" data-act="offno" data-b="${b.id}">Odmítnout</button><button class="btn ok full" data-act="offyes" data-b="${b.id}">Přijmout</button></div>` : '<div class="mut" style="color:#333">Čeká se na hráče…</div>'}</div>` : ''}

async function cashOut(bid, shown){
  if (!confirm(`Vyplatit tiket teď za ${fmtN(shown)} b?`)) return;
  try {
    const v = await runTransaction(db, async tx => {
      const bref = doc(db,'bets',bid), uref = doc(db,'users',S.user.uid), cref = doc(db,'config','main');
      const bs = await tx.get(bref), us = await tx.get(uref), cs = await tx.get(cref);
      const b = bs.data(), c = { ...DEF_CFG, ...(cs.exists() ? cs.data() : {}) };
      if (!c.cashout || c.suspendAll) throw new Error('Cash-out teď nejde.');
      if (!(b.status === 'open' || (b.status === 'pending' && leftMs({createdAt:b.createdAt}) <= 0))) throw new Error('Cash-out teď nejde.');
      let den = 1;
      for (const l of b.legs) {
        if (l.st === 'won') continue; if (l.st === 'void') { den *= l.o; continue; }
        if (l.st === 'lost') throw new Error('Tiket už prohrál.');
        const ms_ = await tx.get(doc(db,'markets',l.m)), m = ms_.data(), o = m.options[l.i];
        if (m.status !== 'open' || m.suspended || o.locked || !(o.odds > 1) || (ms(m.closesAt) && ms(m.closesAt) < Date.now())) throw new Error('Cash-out je teď zamčený.');
        den *= o.odds;
      }
      const ud = us.data(); if (ud.cashMode === 'off') throw new Error('Cash-out teď nejde.');
      const val = Math.floor(b.amount * b.odds / den * (1 - (ud.cashMode === 'bad' ? (ud.cashM ?? 0.3) : c.cashMargin)) + 1e-9);
      if (val < 1) throw new Error('Cash-out teď nejde.');
      if (val < shown) throw new Error(`Hodnota se změnila na ${fmtN(val)} b – zkus to znovu.`);
      tx.update(bref, { status:'cashout', payout: val, cashedAt: serverTimestamp() });
      tx.update(uref, { points: us.data().points + val, lastCash: bid });
      return val;
    });
    toast(`Vyplaceno ${fmtN(v)} b 💸`);
  } catch(e){ toast(e.code ? errTxt(e) : e.message, true); }
}

async function answerOffer(bid, yes){
  try {
    await runTransaction(db, async tx => {
      const bref = doc(db,'bets',bid), uref = doc(db,'users',S.user.uid);
      const bs = await tx.get(bref), us = await tx.get(uref), b = bs.data();
      if (b.status !== 'offer') throw new Error('Nabídka už neplatí.');
      const pts = us.data().points;
      if (yes) { const refund = b.amount - b.offerAmount;
        tx.update(bref, { status:'open', amount: b.offerAmount, odds: b.offerOdds });
        if (refund > 0) tx.update(uref, { points: pts + refund, lastOffer: bid }); }
      else { tx.update(bref, { status:'rejected', payout: b.amount }); tx.update(uref, { points: pts + b.amount, lastOffer: bid }); }
    });

/* ---- riziko ---- */
function viewRisk(){
  const live = S.allBets.filter(b => ['open','pending'].includes(b.status));
  const items = buildItems(S.markets).filter(i => itemStatus(i) !== 'done');
  if (!items.length) return '<div class="empty">Žádné aktivní sázky.</div>';
  const singles = live.filter(b => b.legs.length === 1);
  return items.map(it => {
    const ids = new Set(it.rows.map(r=>r.id));
    const sb = singles.filter(b => ids.has(b.legs[0].m)), stake = sb.reduce((s,b)=>s+b.amount,0);
    const pay = (mid, i) => sb.filter(b => b.legs[0].m === mid && b.legs[0].i === i && b.legs[0].st === 'open').reduce((s,b)=>s+possWin(b),0);
    let scen = [];
    if (it.type === 's') scen = it.m.options.map((o,i) => [o.label, stake - pay(it.m.id, i)]);
    else if (it.exclusive) {
      const rows = it.rows.filter(isLive);
      scen = rows.map(r => [`${r.rowLabel} ANO`, stake - pay(r.id,0) - rows.filter(x=>x.id!==r.id).reduce((s,x)=>s+pay(x.id,1),0)]);
      if (it.nobody) scen.push(['Nikdo', stake - rows.reduce((s,x)=>s+pay(x.id,1),0)]);
    } else scen = it.rows.filter(isLive).flatMap(r => { const st = sb.filter(b=>b.legs[0].m===r.id).reduce((s,b)=>s+b.amount,0); return [[`${r.rowLabel} ANO`, st - pay(r.id,0)], [`${r.rowLabel} NE`, st - pay(r.id,1)]]; });
    const ako = live.filter(b => b.legs.length > 1 && b.legs.some(l => ids.has(l.m) && l.st === 'open'));
    const worst = scen.length ? Math.min(...scen.map(s=>s[1])) : 0;
    scen.sort((a,b) => a[1] - b[1]);
    return `<div class="card"><div class="row sp"><span class="b">${esc(it.type==='g'?it.title:it.m.title)}</span><span class="b ${worst<0?'neg':'pos'}">${fmtS(worst)}</span></div>
      <div class="mut">Sólo vsazeno ${fmtN(stake)} b · nejhorší výsledek ${fmtS(worst)} b</div>
      <table class="tbl" style="margin-top:6px">${scen.slice(0,12).map(([l,v]) => `<tr><td>${esc(l)}</td><td class="b ${v<0?'neg':'pos'}">${fmtS(v)} b</td></tr>`).join('')}</table>
      ${ako.length?`<div class="note">AKO/BB tiketů s touto sázkou: ${ako.length} · max. výplata ${fmtN(ako.reduce((s,b)=>s+possWin(b),0))} b</div>`:''}</div>`;
  }).join('');
}
/* ---- statistiky ---- */
function viewStats(){
  const bs = S.allBets.filter(b => !['rejected','void'].includes(b.status));
  const done = bs.filter(b => ['won','lost','cashout'].includes(b.status)), live = bs.filter(b => ['open','pending'].includes(b.status));
  const turn = bs.reduce((s,b)=>s+b.amount,0), dTurn = done.reduce((s,b)=>s+b.amount,0), paid = done.reduce((s,b)=>s+(b.payout||0),0);
  const profit = dTurn - paid, liab = live.reduce((s,b)=>s+possWin(b),0);
  const byU = {}; done.forEach(b => { byU[b.name] = (byU[b.name]||0) + b.amount - (b.payout||0); });
  const typeOf = b => b.combo ? '🔥 Hotovky' : b.legs.length === 1 ? '🎯 Sólo' : b.bb ? '🧩 Betbuildery' : '🎫 AKO';
  const agg = key => { const o = {}; bs.forEach(b => { const k = key(b), r = (o[k] = o[k] || { n:0, t:0, dt:0, p:0 }); r.n++; r.t += b.amount; if (['won','lost','cashout'].includes(b.status)) { r.dt += b.amount; r.p += b.amount - (b.payout||0); } }); return o; };
  const aggTbl = o => Object.entries(o).sort((a,b) => b[1].t - a[1].t).map(([k, r]) => `<tr><td>${esc(k)}<div class="mut">${r.n} tiketů · obrat ${fmtN(r.t)} b</div></td><td class="b ${r.p<0?'neg':'pos'}">${fmtS(r.p)} b<div class="mut">${r.dt ? (r.p / r.dt * 100).toFixed(0) : 0} %</div></td></tr>`).join('');
  const byE = {}; done.forEach(b => { const k = b.legs.length>1 ? (b.bb?'🧩 Betbuildery':'AKO tikety') : b.legs[0].t.split(' – ')[0]; byE[k] = (byE[k]||0) + b.amount - (b.payout||0); });
  const tbl = o => Object.entries(o).sort((a,b)=>a[1]-b[1]).map(([k,v]) => `<tr><td>${esc(k)}</td><td class="b ${v<0?'neg':'pos'}">${fmtS(v)} b</td></tr>`).join('');
  const days = {}; done.forEach(b => { const t = ms(b.settledAt) || ms(b.cashedAt) || ms(b.createdAt) || Date.now(), k = new Date(t).toDateString(); (days[k] = days[k] || { t, v:0 }).v += b.amount - (b.payout||0); });
  const arr = Object.values(days).sort((a,b) => a.t - b.t).slice(-14), mx = Math.max(1, ...arr.map(x => Math.abs(x.v)));
  let cum = 0; const cumArr = arr.map(x => (cum += x.v));
  const bars = arr.length ? `<div class="bars">${arr.map((x, i) => `<div title="Stav po dni: ${fmtS(cumArr[i])} b"><span class="${x.v<0?'neg':'pos'}">${fmtS(x.v)}</span><i style="height:${Math.round(Math.abs(x.v)/mx*90)}px;background:${x.v<0?'var(--red)':'var(--acc2)'}"></i><span>${new Date(x.t).getDate()}.${new Date(x.t).getMonth()+1}.</span></div>`).join('')}</div>` : '<div class="mut" style="margin-top:8px">Zatím žádné vyhodnocené tikety.</div>';
  return `<h2>💰 Pokladna bookmakera</h2><div class="card"><div class="row sp"><span class="mut">Celkový zisk</span><b class="${profit<0?'neg':'pos'}" style="font-size:20px">${fmtS(profit)} b</b></div>${bars}<div class="mut" style="margin-top:6px">Zisk po dnech (posledních 14 dní)</div></div>
    <div class="kpi">
      <div><span class="mut">Zisk bookmakera</span><b class="${profit<0?'neg':'pos'}">${fmtS(profit)} b</b></div>
      <div><span class="mut">Marže (hold)</span><b>${dTurn ? (profit/dTurn*100).toFixed(1) : '0'} %</b></div>
      <div><span class="mut">Obrat celkem</span><b>${fmtN(turn)} b</b></div>
      <div><span class="mut">Ve hře (max. výplata)</span><b>${fmtN(liab)} b</b></div>
      <div><span class="mut">Tiketů</span><b>${bs.length}</b></div>
      <div><span class="mut">AKO / BB podíl</span><b>${bs.length ? Math.round(bs.filter(b=>b.legs.length>1).length/bs.length*100) : 0} %</b></div></div>
    <h2>Podle typu tiketu</h2><div class="card"><table class="tbl">${aggTbl(agg(typeOf)) || '<tr><td class="mut">Zatím nic</td></tr>'}</table><div class="mut" style="margin-top:6px">Vpravo tvůj zisk a marže (hold).</div></div>
    <h2>Podle hráčů</h2><div class="card"><table class="tbl">${aggTbl(agg(b => b.name)) || '<tr><td class="mut">Zatím nic</td></tr>'}</table></div>
    <h2>Zisk podle sázek</h2><div class="card"><table class="tbl">${tbl(byE) || '<tr><td class="mut">Zatím nic</td></tr>'}</table></div>`;
}

async function housekeeping(){

  try { for (const b of S.allBets.filter(b => b.status === 'pending' && leftMs(b) <= 0)) await updateDoc(doc(db,'bets',b.id), { status:'open', autoAccepted:true }).catch(()=>{});
    for (const m of S.markets.filter(m => isLive(m) && m.options.some(o => o.odds > 1 && o.fo === undefined) && !m.options.some(boostExpired)))
      await updateDoc(doc(db,'markets',m.id), { options: withFair(m.options) }).catch(()=>{});
    const ttl = (S.cfg.offerTtl || 3) * 60000;
    for (const b of S.allBets.filter(b => b.status === 'offer' && ms(b.offerAt) && Date.now() - ms(b.offerAt) > ttl)) {
      const bt = writeBatch(db); bt.update(doc(db,'bets',b.id), { status:'rejected', payout:b.amount, voidedAt: serverTimestamp(), unc:true });
      bt.update(doc(db,'users',b.uid), { points: increment(b.amount) }); uncountOps(b, b.ca ?? b.amount, true).forEach(([r, d]) => bt.update(r, d));

    for (const b of S.allBets.filter(b => ['rejected','void'].includes(b.status) && !b.unc)) {
      const bt = writeBatch(db); bt.update(doc(db,'bets',b.id), { unc:true }); uncountOps(b, b.ca ?? b.amount, true).forEach(([r, d]) => bt.update(r, d));
      await bt.commit().catch(()=>{}); }
    for (const m of S.markets.filter(m => isLive(m) && m.options.some(boostExpired)))
      await updateDoc(doc(db,'markets',m.id), { options: withFair(m.options.map(o => boostExpired(o) ? { ...o, odds: o.boostFrom, boostFrom: 0, boostUntil: null } : o), m.options) }).catch(()=>{});
  } finally { hkBusy = false; }
}

async function settleMarkets(entries){
  const res = Object.fromEntries(entries.map(e => [e.mid, e.win])), ids = entries.map(e => e.mid), found = new Map();
  for (let i = 0; i < ids.length; i += 30) { const s = await getDocs(query(collection(db,'bets'), where('mids','array-contains-any', ids.slice(i,i+30)))); s.forEach(x => found.set(x.id, x)); }
  const ops = [], add = {}; let n = 0, c = S.cfg;
  const insQ = b => c.insOn && !b.combo && !b.bb && b.legs.length >= c.insMinLegs && b.legs.every(l => l.o >= c.insMinOdds);
  found.forEach(s => {
    const b = s.data(); if (!['open','pending'].includes(b.status)) return; n++;
    const legs = b.legs.map(l => (l.m in res && l.st === 'open') ? { ...l, st: res[l.m] === null ? 'void' : (l.i === res[l.m] ? 'won' : 'lost') } : l);
    let upd = { legs };
    const lostN = legs.filter(l => l.st === 'lost').length, openN = legs.filter(l => l.st === 'open').length;
    if (lostN === 1 && insQ(b)) {
      if (openN > 0) upd = { legs, ...(b.status === 'pending' && leftMs(b) <= 0 ? { status:'open' } : {}) };
      else { const r = c.insMax > 0 ? Math.min(b.amount, c.insMax) : b.amount; upd = { legs, status:'lost', payout:r, ins:true, settledAt: serverTimestamp() }; add[b.uid] = (add[b.uid]||0) + r; }
    }
    else if (lostN > 0) upd = { legs, status:'lost', payout:0, settledAt: serverTimestamp() };
    else if (legs.every(l => ['won','void'].includes(l.st))) {
      if (legs.every(l => l.st === 'void')) { upd = { legs, status:'void', payout:b.amount, settledAt: serverTimestamp() }; add[b.uid] = (add[b.uid]||0) + b.amount; }
      else { const vd = legs.filter(l => l.st === 'void').reduce((p,l) => p * l.o, 1), p = Math.floor(b.amount * Math.max(1, b.odds / vd) + 1e-9); upd = { legs, status:'won', payout:p, settledAt: serverTimestamp() }; add[b.uid] = (add[b.uid]||0) + p; }
    } else if (b.status === 'pending' && leftMs(b) <= 0) upd.status = 'open';
    ops.push([s.ref, upd]);
  });
  Object.entries(add).forEach(([uid,p]) => ops.push([doc(db,'users',uid), { points: increment(p) }]));
  entries.forEach(e => ops.push([doc(db,'markets',e.mid), { status: e.win === null ? 'cancelled' : 'settled', winnerIndex: e.win, settledAt: serverTimestamp() }]));
  for (let i = 0; i < ops.length; i += 450) { const bt = writeBatch(db); ops.slice(i,i+450).forEach(([r,d]) => bt.update(r,d)); await bt.commit(); }
  return n;
}
async function unsettleMarkets(ids){
  const set = new Set(ids), found = new Map();
  for (let i = 0; i < ids.length; i += 30) { const s = await getDocs(query(collection(db,'bets'), where('mids','array-contains-any', ids.slice(i,i+30)))); s.forEach(x => found.set(x.id, x)); }
  const ops = [], sub = {}; let n = 0;
  found.forEach(s => {
    const b = s.data(); if (['rejected','cashout'].includes(b.status) || b.voidedAt) return;
    if (!b.legs.some(l => set.has(l.m) && l.st !== 'open')) return; n++;
    const legs = b.legs.map(l => set.has(l.m) ? { ...l, st:'open' } : l);
    let status = b.status, payout = b.payout || 0;
    if (['won','void'].includes(b.status) || (b.status === 'lost' && payout > 0)) { sub[b.uid] = (sub[b.uid]||0) + payout; payout = 0; status = 'open'; }
    if (legs.some(l => l.st === 'lost')) status = 'lost'; else if (status === 'lost') status = 'open';
    ops.push([s.ref, { legs, status, payout, settledAt: null }]);
  });
  Object.entries(sub).forEach(([uid, p]) => ops.push([doc(db,'users',uid), { points: increment(-p) }]));
  ids.forEach(id => ops.push([doc(db,'markets',id), { status:'closed', winnerIndex:null, settledAt:null }]));
  for (let i = 0; i < ops.length; i += 450) { const bt = writeBatch(db); ops.slice(i,i+450).forEach(([r,d]) => bt.update(r,d)); await bt.commit(); }
  return n;
}

  const chg = upd.flatMap(u => u.options.map((o, i) => { const po = u.r.options[i]; const lab = it.type === 'g' ? `${u.r.rowLabel} ${o.label}` : o.label;

  try { const bt = writeBatch(db); upd.forEach(u => bt.update(doc(db,'markets',u.r.id), { options: withFair(u.options, u.r.options), suspended: u.suspended })); await bt.commit();
    if (chg.length) logA('Kurzy', `${it.type==='g'?it.title:it.m.title}: ${chg.join(', ')}`); closeModal(); toast('Kurzy uloženy ⚡'); }

async function saveGroup(){
  const $e = document.getElementById('ferr'), title = document.getElementById('f_t').value.trim(), com = readCommon();

  const rows = []; let bad = '';

  if (err) { $e.textContent = err; return; }
  const gid = S.ctx.gid || doc(collection(db,'markets')).id, ev = com.evName ? 'ev:' + slug(com.evName) : 'g:' + gid;

    const bt = writeBatch(db);

      if (r.id) {
        const old = M(r.id); if (!old) return;

    });

  } catch(e){ $e.textContent = errTxt(e); }
}

  const bs = S.allBets.filter(b => b.uid === uid && !['rejected','void'].includes(b.status));
  const done = bs.filter(b => ['won','lost','cashout'].includes(b.status)), won = done.filter(b => b.status === 'won').length;
  const staked = done.reduce((s,b) => s + b.amount, 0), paid = done.reduce((s,b) => s + (b.payout||0), 0), profit = paid - staked, roi = staked ? profit / staked : 0;
  const cats = {}; bs.forEach(b => b.legs.forEach(l => { const c = M(l.m)?.category || l.t.split(' – ')[0]; cats[c] = (cats[c]||0) + 1; }));
  return { n: bs.length, done: done.length, won, staked, paid, profit, roi,
    avgOdds: bs.length ? bs.reduce((s,b) => s + b.odds, 0) / bs.length : 0, avgStake: bs.length ? bs.reduce((s,b) => s + b.amount, 0) / bs.length : 0,
    best: done.reduce((m,b) => Math.max(m, (b.payout||0) - b.amount), 0), ako: bs.length ? bs.filter(b => b.legs.length > 1).length / bs.length : 0,
    sharp: done.length >= 5 && profit > 0 && (roi > 0.2 || won / done.length > 0.6), cats };
}

function cbOptions(){ const m = M(document.getElementById('cb_m').value), sel = document.getElementById('cb_i');
  sel.innerHTML = m ? m.options.map((o, i) => `<option value="${i}">${esc(o.label)} – ${fmtOdds(o.odds)}</option>`).join('') : ''; }
function cbRefresh(){
  const legs = S.ctx.legs.map(l => ({ m: M(l.m), i: l.i })).filter(l => l.m);
  document.getElementById('cb_legs').innerHTML = legs.map((l, k) => `<div class="leg"><span>${k+1}.</span><div><div class="mut">${esc(legTitle(l.m))}</div><div class="b">${esc(l.m.options[l.i].label)} @ ${fmtOdds(l.m.options[l.i].odds)}</div></div><button class="btn sm out" data-act="cbrm" data-k="${k}">✕</button></div>`).join('') || '<div class="mut">Přidej aspoň 2 sázky.</div>';
  const prod = legs.reduce((p, l) => p * l.m.options[l.i].odds, 1), cap = legs.length ? floor2(fairCap(legs)) : 0;
  document.getElementById('cb_info').innerHTML = legs.length ? `Běžný kurz <b>${fmtOdds(floor2(prod))}</b> · max. bez surebetu <b>${fmtOdds(cap)}</b>` : 'Vyber sázky.';
  const o = document.getElementById('cb_o'); if (!o.value && legs.length >= 2) o.placeholder = fmtOdds(ladderDown(Math.min(cap, floor2(prod * 1.1))));
}
function comboLegErr(legs){
  for (let a = 0; a < legs.length; a++) for (let b = a + 1; b < legs.length; b++) {
    const x = legs[a], y = legs[b];
    if (x.m.id === y.m.id) return 'Stejná sázka je tam dvakrát.';
    if (x.m.grp === y.m.grp && x.m.exclusive && (x.i === 0 || y.i === 0)) return `„${x.m.groupTitle}“: ANO nejde kombinovat s dalším řádkem.`;
  }
  return '';
}
async function saveCombo(){
  const $e = document.getElementById('cb_err'), title = document.getElementById('cb_t').value.trim();
  const legs = S.ctx.legs.map(l => ({ m: M(l.m), i: l.i })).filter(l => l.m);
  const ov = document.getElementById('cb_o'); const odds = floor2(parseNum(ov.value || ov.placeholder) || 0);
  if (!title) { $e.textContent = 'Napiš název.'; return; }
  if (legs.length < 2) { $e.textContent = 'Hotovka potřebuje aspoň 2 sázky.'; return; }
  if (legs.length > MAX_LEGS) { $e.textContent = `Max. ${MAX_LEGS} sázek.`; return; }
  const le = comboLegErr(legs); if (le) { $e.textContent = le; return; }
  if (!(odds >= 1.01)) { $e.textContent = 'Zadej kurz.'; return; }
  const cap = floor2(fairCap(legs));
  if (odds > cap) { $e.textContent = `Surebet! Kurz může být max. ${fmtOdds(cap)} (férový kurz bez marže).`; return; }
  const id = S.ctx.cid || Math.random().toString(36).slice(2, 10), old = S.ctx.cid ? S.cfg.combos[S.ctx.cid] : null, dur = S.ctx.dur;
  const until = dur === 'keep' ? (old?.until || null) : untilOf(dur);
  const data = { title, legs: legs.map(l => ({ m: l.m.id, i: l.i })), mids: legs.map(l => l.m.id), idx: legs.map(l => l.i), odds,
    active: old ? old.active : true, until, maxStake: Math.max(0, parseInt(document.getElementById('cb_ms').value) || 0), perUser: Math.max(0, parseInt(document.getElementById('cb_pu').value) || 0),
    createdAt: old?.createdAt || Timestamp.fromDate(new Date()) };
  try { await updateDoc(doc(db,'config','main'), { combos: { ...(S.cfg.combos||{}), [id]: data } }); logA('Hotovka', `${title} @ ${fmtOdds(odds)}`); toast('Hotovka uložena 🔥'); openCombos(); }
  catch(e){ $e.textContent = errTxt(e); }
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const a = t.dataset.act, d = t.dataset;
  switch (a) {
    case 'authmode': S.authMode = d.m; renderLogin(); break;
    case 'rules': e.preventDefault(); if (!S.user) { const keepU = document.getElementById('lu')?.value || '', keepP = document.getElementById('lp')?.value || '';
        openModal(RULES_HTML + `<button class="btn pri full" style="margin-top:12px" data-act="rulesok">Rozumím</button>`, { keep:true, login:{ keepU, keepP } }); }
      else openModal(RULES_HTML + `<button class="btn full" style="margin-top:12px" data-act="close">Zavřít</button>`); break;
    case 'rulesok': { $modal.classList.remove('show'); S.ctx = null; const c = document.getElementById('lrules'); if (c) c.checked = true; break; }
    case 'cat': S.catFilter = d.c; render(); break;
    case 'acat': S.archCat = d.c; render(); break;
    case 'archive': S.archive = d.v === '1'; render(); window.scrollTo(0,0); break;
    case 'stats': { const k = d.k; S.showStats.has(k) ? S.showStats.delete(k) : S.showStats.add(k); ls.set('stats_open', [...S.showStats]); render(); break; }
    case 'promo': if (d.c) { S.catFilter = d.c; S.archive = false; render(); window.scrollTo(0,0); } break;
    case 'irec': { const it = itemFromKey(d), v = !it.rows[0].rec; try { const bt = writeBatch(db); it.rows.forEach(r => bt.update(doc(db,'markets',r.id), { rec: v })); await bt.commit(); toast(v ? '⭐ Doporučeno' : 'Doporučení zrušeno'); } catch(err){ toast(errTxt(err), true); } break; }
    case 'isort': { const it = itemFromKey(d), cur = it.rows[0].optSort || '', nx = cur === '' ? 'asc' : cur === 'asc' ? 'desc' : '';
      try { const bt = writeBatch(db); it.rows.forEach(r => bt.update(doc(db,'markets',r.id), { optSort: nx })); await bt.commit(); } catch(err){ toast(errTxt(err), true); } break; }
    case 'bu': $sheet.querySelectorAll('[data-act=bu]').forEach(b => b.classList.toggle('on', b === t)); S.ctx.bu = d.v; break;
    case 'promos': openPromos(); break;
    case 'prdur': $sheet.querySelectorAll('[data-act=prdur]').forEach(b => b.classList.toggle('on', b === t)); S.ctx.prdur = d.v; break;
    case 'pradd': { const text = document.getElementById('pr_t').value.trim(); if (!text) { toast('Napiš text', true); break; }
      const list = [...(S.cfg.promos||[]), { id: Math.random().toString(36).slice(2,8), text, cat: document.getElementById('pr_c').value, until: untilOf(S.ctx.prdur) }];
      try { await updateDoc(doc(db,'config','main'), { promos: list }); toast('📣 Banner přidán'); closeModal(); } catch(err){ toast(errTxt(err), true); } break; }
    case 'prdel': { const list = [...(S.cfg.promos||[])]; list.splice(+d.i, 1); try { await updateDoc(doc(db,'config','main'), { promos: list }); S.cfg.promos = list; openPromos(); } catch(err){ toast(errTxt(err), true); } break; }
    case 'combos': openCombos(); break;
    case 'cbnew': openComboForm(); break;
    case 'cbedit': openComboForm(d.c); break;
    case 'cbdur': $sheet.querySelectorAll('[data-act=cbdur]').forEach(b => b.classList.toggle('on', b === t)); S.ctx.dur = d.v; break;
    case 'cbadd': { const mid = document.getElementById('cb_m').value, i = parseInt(document.getElementById('cb_i').value); if (!mid || isNaN(i)) { toast('Vyber sázku', true); break; }
      const legs = [...S.ctx.legs.filter(l => l.m !== mid), { m: mid, i }], err = comboLegErr(legs.map(l => ({ m: M(l.m), i: l.i })));

    case 'qstore': { const it = itemFromKey(d), m = it.m; const l = [...quickList(), { title: m.title, minutes: 5, category: m.category || 'Live', options: m.options.map(o => ({ label:o.label, odds:o.odds })) }];
      await saveQuickList(l); toast('⚡ Uloženo do rychlých sázek'); break; }
    case 'lbulk': { const f = +d.f; $sheet.querySelectorAll(d.i === 'all' ? '.lcell' : `.lcell[data-i="${d.i}"]`).forEach(c => { if (c.dataset.lock) return; const inp = c.querySelector('.lo'), v = parseNum(inp.value); if (v > 1) inp.value = fmtOdds(Math.max(1.01, ladderDown(floor2(v * f)))); }); toast('Posunuto – zkontroluj a ulož'); break; }
    case 'uprof': openProfile(d.u); break;
    case 'iunsettle': { const it = itemFromKey(d); if (!confirm('Vrátit vyhodnocení? Výhry se hráčům odečtou (body můžou jít i do mínusu), sázka se uzavře a můžeš ji vyhodnotit znovu.')) break;
      try { const n = await unsettleMarkets(it.rows.filter(r => ['settled','cancelled'].includes(r.status)).map(r => r.id)); logA('Vráceno vyhodnocení', `${it.type==='g'?it.title:it.m.title} (${n} tiketů)`); toast(`Vráceno (${n} tiketů) – teď vyhodnoť znovu`); } catch(err){ toast(errTxt(err), true); } break; }
    case 'inext': openGroupForm(d.g, 'next'); break;
    case 'login': doLogin(false); break;
    case 'register': doLogin(true); break;
    case 'logout': if (confirm('Odhlásit se?')) signOut(auth); break;
    case 'tab': S.tab = d.t; render(); window.scrollTo(0,0); break;
    case 'asub': S.adminSub = d.s; if (d.s === 'log') S.logRows = null; render(); break;
    case 'ffilter': S.feedFilter = d.f; render(); break;
    case 'close': closeModal(); break;
    // tiket
    case 'pick': pick(d.m, +d.i); break;
    case 'unpick': S.slipCombo = null; ls.set('slipc_' + S.user.uid, null); S.slip = S.slip.filter(s => s.m !== d.m); ls.set('slip_' + S.user.uid, S.slip); S.slipSig = ''; if (S.slip.length) renderSlip(); else closeModal(); render(); break;
    case 'slipopen': S.slipSig = ''; renderSlip(); break;
    case 'slipclear': S.slipCombo = null; ls.set('slipc_' + S.user.uid, null); S.slip = []; ls.set('slip_' + S.user.uid, []); closeModal(); break;
    case 'acceptodds': S.slip.forEach(s => { const m = M(s.m); if (m) S.seenOdds[`${s.m}:${s.i}`] = m.options[s.i].odds; }); S.slipSig = ''; renderSlip(); break;
    case 'q': { const $a = document.getElementById('amt'); let v = d.v === 'all' ? S.profile.points : +d.v; const mx = effLimit('maxStake'); if (mx) v = Math.min(v, mx); $a.value = v; S.slipAmt = String(v); updSlipTotals(); break; }
    case 'place': placeBet(); break;
    case 'cash': cashOut(d.b, +d.v); break;
    case 'share': shareTicket(d.b); break;
    // admin – tikety
    case 'bapprove': approve(d.b); break;
    case 'breject': if (confirm('Zamítnout tiket a vrátit body?')) refundBet(d.b, 'rejected'); break;
    case 'storno': if (confirm('Stornovat tiket a vrátit hráči vklad?')) refundBet(d.b, 'void'); break;
    case 'suspall': try { logA(S.cfg.suspendAll ? 'Sázení obnoveno' : 'Vše pozastaveno', ''); await updateDoc(doc(db,'config','main'), { suspendAll: !S.cfg.suspendAll }); toast(S.cfg.suspendAll ? 'Sázení obnoveno ▶' : 'Vše pozastaveno ⏸'); } catch(err){ toast(errTxt(err), true); } break;
    // admin – sázky
    case 'newpick': openPick(); break;
    case 'gnew': openGroupForm(); break;
    case 'snew': openSingleForm(); break;
    case 'live': openLive(M(d.m)); break;
    case 'lstep': { const inp = t.parentElement.querySelector('.lo'), v = parseNum(inp.value) || 1.5; inp.value = fmtOdds(ladderStep(v, +d.d)); break; }
    case 'ltog': { const k = d.k;
      if (k === 'susp') { const r = t.closest('.lrow'), on = !r.dataset.susp; r.dataset.susp = on ? 1 : ''; r.classList.toggle('susp', on); t.classList.toggle('on', on); t.textContent = on ? '⏸ Pozastaveno' : '⏸ Pozastavit'; }
      else { const c = t.closest('.lcell');
        if (k === 'lock') { const on = !c.dataset.lock; c.dataset.lock = on ? 1 : ''; t.classList.toggle('on', on); }
        else { const on = !c.dataset.boost, inp = c.querySelector('.lo'); if (on) { c.dataset.boost = parseNum(inp.value) || ''; toast('🔥 Teď kurz zvyš a ulož'); } else { if (c.dataset.boost) inp.value = fmtOdds(parseNum(c.dataset.boost)); c.dataset.boost = ''; } t.classList.toggle('on', on); } }
      break; }
    case 'lsave': saveLive(); break;
    case 'isusp': { const it = itemFromKey(d); try { const bt = writeBatch(db); it.rows.filter(isLive).forEach(r => bt.update(doc(db,'markets',r.id), { suspended: d.v === '1' })); await bt.commit(); toast(d.v === '1' ? 'Pozastaveno ⏸' : 'Obnoveno ▶'); } catch(err){ toast(errTxt(err), true); } break; }
    case 'istatus': { const it = itemFromKey(d); try { const bt = writeBatch(db); it.rows.filter(isLive).forEach(r => bt.update(doc(db,'markets',r.id), { status: d.s })); await bt.commit(); toast(d.s === 'closed' ? 'Uzavřeno' : 'Otevřeno'); } catch(err){ toast(errTxt(err), true); } break; }
    case 'isettle': openSettle(itemFromKey(d)); break;
    case 'iedit': { const it = itemFromKey(d); it.type === 'g' ? openGroupForm(it.id) : openSingleForm(it.id); break; }
    case 'idup': { const it = itemFromKey(d); it.type === 'g' ? openGroupForm(it.id, true) : openSingleForm(it.id, true); break; }
    case 'icancel': { const it = itemFromKey(d); if (!confirm('Zrušit sázku? Tikety na ni budou vráceny (u AKO se tahle část nepočítá).')) break;
      try { const n = await settleMarkets(it.rows.filter(isLive).map(r => ({ mid:r.id, win:null }))); logA('Zrušena sázka', `${it.type==='g'?it.title:it.m.title} (${n} tiketů vráceno)`); toast(`Zrušeno (${n} tiketů)`); } catch(err){ toast(errTxt(err), true); } break; }
    case 'idel': { const it = itemFromKey(d); if (!confirm('Smazat sázku z přehledu? (tikety zůstanou)')) break;
      try { const bt = writeBatch(db); it.rows.forEach(r => bt.delete(doc(db,'markets',r.id))); await bt.commit(); } catch(err){ toast(errTxt(err), true); } break; }
    case 'win': { const m = M(S.ctx.mid); if (!confirm(`Výsledek: „${m.options[+d.i].label}"?`)) break;
      try { const n = await settleMarkets([{ mid:m.id, win:+d.i }]); logA('Vyhodnoceno', `${m.title}: ${m.options[+d.i].label} (${n} tiketů)`); closeModal(); toast(`Vyhodnoceno (${n} tiketů)`); } catch(err){ toast(errTxt(err), true); } break; }
    case 'gtog': t.classList.toggle('on'); break;
    case 'gsettlego': { const g = groupById(S.ctx.gid), yes = new Set([...$sheet.querySelectorAll('.chk.on')].map(b => b.dataset.m)), live = g.rows.filter(isLive);
      if (g.exclusive && yes.size > 1 && !confirm('Tahle tabulka má mít ANO jen u jednoho. Opravdu víc?')) break;
      const names = live.filter(r => yes.has(r.id)).map(r => r.rowLabel);
      if (!confirm(names.length ? `ANO: ${names.join(', ')}. Ostatní NE. Potvrdit?` : 'Všude NE. Potvrdit?')) break;
      try { const n = await settleMarkets(live.map(r => ({ mid:r.id, win: yes.has(r.id) ? 0 : 1 }))); logA('Vyhodnoceno', `${g.title}: ANO ${names.join(', ') || 'nikdo'} (${n} tiketů)`); closeModal(); toast(`Vyhodnoceno (${n} tiketů)`); } catch(err){ toast(errTxt(err), true); } break; }
    // formuláře
    case 'rowdel': t.closest('.grow,.optrow').remove(); break;
    case 'gaddone': document.getElementById('grows').insertAdjacentHTML('beforeend', gRowHtml()); break;
    case 'gaddnames': gAdd(document.getElementById('f_names').value.split(/\n|,/).map(s=>s.trim())); document.getElementById('f_names').value=''; break;
    case 'gaddplayers': gAdd(S.users.filter(u=>u.id!==S.user.uid).sort((a,b)=>a.name.localeCompare(b.name,'cs')).map(u=>u.name)); break;
    case 'gaddnums': { const f = parseInt(document.getElementById('f_from').value), to = parseInt(document.getElementById('f_to').value);
      if (isNaN(f)||isNaN(to)||to<f||to-f>100) { toast('Zadej od a do', true); break; } gAdd(Array.from({length:to-f+1},(_,k)=>String(f+k))); break; }
    case 'geven': { const tot = parseNum(document.getElementById('f_tot').value) || 100, rows = [...$sheet.querySelectorAll('#grows .grow')].filter(r => !r.dataset.done);
      if (!rows.length) { toast('Nejdřív přidej řádky', true); break; } rows.forEach(r => { r.querySelector('.rp').value = String(Math.round(tot / rows.length * 10) / 10).replace('.', ','); rowRecalc(r); }); break; }
    case 'gsave': saveGroup(); break;
    case 'oaddone': document.getElementById('orows').insertAdjacentHTML('beforeend', oRowHtml()); break;
    case 'oaddnums': { const f = parseInt(document.getElementById('f_from').value), to = parseInt(document.getElementById('f_to').value);
      if (isNaN(f)||isNaN(to)||to<f||to-f>39) { toast('Zadej od a do (max 40)', true); break; } oAdd(Array.from({length:to-f+1},(_,k)=>String(f+k))); break; }
    case 'oaddplayers': oAdd(S.users.filter(u=>u.id!==S.user.uid).sort((a,b)=>a.name.localeCompare(b.name,'cs')).map(u=>u.name)); break;
    case 'ssave': saveSingle(); break;
    // hráči
    case 'ubets': openUserBets(d.u); break;
    case 'upts': openPoints(d.u); break;
    case 'ulim': openLimits(d.u); break;
    case 'ulsave': saveLimits(); break;
    case 'ulbd': $sheet.querySelectorAll('[data-act=ulbd]').forEach(b => b.classList.toggle('on', b === t)); S.ctx.bd = d.v; break;
    case 'usharp': if (confirm('Nastavit jako ostrého hráče? Limity 30 %, přísnější schvalování a nevýhodný cash-out.')) makeSharp(d.u); break;
    case 'boffer': openOffer(d.b); break;
    case 'offsend': sendOffer(); break;
    case 'offyes': answerOffer(d.b, true); break;
    case 'offno': if (confirm('Odmítnout nabídku? Vklad se ti vrátí.')) answerOffer(d.b, false); break;
    case 'logref': S.logRows = null; render(); break;
    case 'padj': { const v = parseInt(document.getElementById('pa').value); if (!v||v<1) break;
      try { await updateDoc(doc(db,'users',S.ctx.uid), { points: increment(v * +d.s) }); logA('Body', `${S.users.find(x => x.id === S.ctx.uid)?.name}: ${+d.s > 0 ? '+' : '−'}${v} b`); closeModal(); toast('Body upraveny'); } catch(err){ toast(errTxt(err), true); } break; }
    // nastavení
    case 'cgen': document.getElementById('s_nt').value = 'sazkovka-' + Math.random().toString(36).slice(2,10); break;
    case 'csave': saveSettings(); break;
    case 'ctest': { const topic = document.getElementById('s_nt').value.trim(); if (!topic) { toast('Nejdřív vyplň téma', true); break; }
      const old = S.cfg.ntfyTopic; S.cfg.ntfyTopic = topic; const ok = await ntfy('🎲 Test', 'Notifikace ze sázkovky fungují ✅'); S.cfg.ntfyTopic = old;
      toast(ok ? 'Odesláno ✅ – mrkni do ntfy' : 'Nepodařilo se odeslat – zkontroluj internet / blokátor reklam', !ok);
      if (ok && topic !== (old||'')) toast('Nezapomeň dát „Uložit nastavení“ – bez toho hráči notifikaci neposílají', true); break; }
  }
});
document.addEventListener('keydown', e => { if (e.key==='Enter' && !S.user && document.getElementById('lp')) doLogin(S.authMode==='register'); });
setInterval(() => { if (isAdmin()) housekeeping(); if (S.user && S.profile && !$modal.classList.contains('show')) render(); }, 30000);

/* ---- PWA manifest (ikona na ploše) ---- */
try {
  const mf = { name: APP_NAME, short_name: 'Sázkovka', start_url: location.pathname + location.search, display: 'standalone', background_color: '#0e1013', theme_color: '#0e1013',
    icons: [{ src: new URL('icon.png', location.href).href, sizes: '512x512', type: 'image/png' }] };
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type:'application/manifest+json' })); document.head.appendChild(l);
} catch {}
</script>
</body>
</html>
