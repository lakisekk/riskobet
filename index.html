Object.assign(S, { casG:'wheel', casAmt:20, casChip:10, casBets:[], casStack:[], casBusy:false, casHist:null, casRes:null, casResumed:false, wRot:0, rRot:0, bAng:0, bR:1 });
const RL_ORDER = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const RL_RED = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const rlCol = n => n === 0 ? 'g' : RL_RED.includes(n) ? 'r' : 'b';
const RL_FILL = { g:'#1f9d57', r:'#d63a33', b:'#1b1b19' };
const RB_LAB = { red:'Červená', black:'Černá', even:'Sudá', odd:'Lichá', low:'1–18', high:'19–36' };
const W_COLS = ['#3ddc84', '#6aa8ff', '#ff8a1f', '#ffd400', '#ff5449', '#c58bff', '#f5f3ea'];
const CAS_DEF = () => ({ on:false, wheel:{ segs:[{ m:0, w:14 }, { m:1.5, w:5 }, { m:2, w:3 }, { m:5, w:1 }] }, roul:{ w:[9, ...Array(36).fill(1)] } });
// hranice výsledků na škále 0–999 999 (stejný výpočet dělají pravidla Firebase)
function cumOf(w){ const W = w.reduce((a, b) => a + b, 0), c = [0]; let s = 0;
  w.forEach((x, i) => { s += x; c.push(i === w.length - 1 ? 1000000 : Math.round(1e6 * s / W)); }); return c; }
function casCfg(){
  const c = S.cfg.casino || {}, d = CAS_DEF();
  const wheel = c.wheel?.segs?.length && c.wheel.cum ? c.wheel : { ...d.wheel, m: d.wheel.segs.map(s => s.m), cum: cumOf(d.wheel.segs.map(s => s.w)) };
  const roul = c.roul?.w?.length === 37 && c.roul.cum ? c.roul : { ...d.roul, cum: cumOf(d.roul.w) };
  return { on: !!c.on, wheel, roul };
}
// náhoda = mikrosekundy serverového času zápisu (hráč je neovlivní), promíchané násobením
const rndOf = t => (Math.floor((t?.nanoseconds || 0) / 1000) * 7919) % 1000000;
function pickR(R, cum){ for (let i = 0; i < cum.length - 1; i++) if (cum[i] <= R && R < cum[i + 1]) return i; return cum.length - 2; }
function rbWin(b, n){
  if (b.k === 'n') return b.v === n ? 36 : 0;
  if (n === 0) return 0;
  if (b.k === 'red') return RL_RED.includes(n) ? 2 : 0;
  if (b.k === 'black') return RL_RED.includes(n) ? 0 : 2;
  if (b.k === 'even') return n % 2 === 0 ? 2 : 0;
  if (b.k === 'odd') return n % 2 === 1 ? 2 : 0;
  if (b.k === 'low') return n <= 18 ? 2 : 0;
  if (b.k === 'high') return n >= 19 ? 2 : 0;
  if (b.k === 'doz') return Math.trunc((n - 1) / 12) === b.v ? 3 : 0;
  return (n - 1) % 3 === b.v ? 3 : 0;
}
const casPay = (s, r) => s.g === 'wheel' ? Math.trunc(s.a * s.m[r]) : s.bets.reduce((a, b) => a + b.a * rbWin(b, r), 0);
const fmtX = m => String(+(+m).toFixed(2)).replace('.', ',') + '×';
const pctS = (x, d = 1) => (x * 100).toFixed(d).replace('.', ',') + ' %';
const rbKey = b => b.k + (b.v ?? '');
const rbLabel = b => b.k === 'n' ? String(b.v) : b.k === 'doz' ? ['1–12', '13–24', '25–36'][b.v] : b.k === 'col' ? `${b.v + 1}. sloupec` : RB_LAB[b.k];

// ---------- kreslení ----------
function arcP(r0, r1, a0, a1){
  const p = (r, a) => { const t = (a - 90) * Math.PI / 180; return (150 + r * Math.cos(t)).toFixed(2) + ' ' + (150 + r * Math.sin(t)).toFixed(2); };
  if (a1 - a0 > 180) return arcP(r0, r1, a0, (a0 + a1) / 2) + arcP(r0, r1, (a0 + a1) / 2, a1);
  return `M${p(r1, a0)}A${r1} ${r1} 0 0 1 ${p(r1, a1)}L${p(r0, a1)}A${r0} ${r0} 0 0 0 ${p(r0, a0)}Z`;
}
function wheelSlots(segs){
  const W = segs.reduce((a, s) => a + (s.w > 0 ? s.w : 0), 0), small = W <= 60, P = [];
  segs.forEach((s, j) => { if (!(s.w > 0)) return; const p = small ? s.w : Math.max(1, Math.round(60 * s.w / W));
    for (let k = 0; k < p; k++) P.push({ j, size: s.w / p, pos: (k + .5) / p + j * 1e-6 }); });
  P.sort((a, b) => a.pos - b.pos);
  let a = 0; return P.map(x => { const o = { j: x.j, a0: a / W * 360, a1: (a + x.size) / W * 360 }; a += x.size; return o; });
}
function segColor(segs, j){
  const m = segs[j].m; if (!(m > 0)) return '#262622';
  const ms_ = [...new Set(segs.filter(s => s.m > 0).map(s => s.m))].sort((a, b) => a - b);
  return W_COLS[ms_.indexOf(m) % W_COLS.length];
}
function wheelSvg(w){
  const sl = wheelSlots(w.segs);
  const parts = sl.map(s => { const col = segColor(w.segs, s.j), mid = (s.a0 + s.a1) / 2, len = (s.a1 - s.a0) * Math.PI / 180 * 104;
    const fs = Math.min(17, len * .5), dark = col !== '#262622';
    return `<path d="${arcP(46, 138, s.a0, s.a1)}" fill="${col}" stroke="#000" stroke-width="1.5"/>` +
      (fs >= 7 ? `<text x="150" y="${150 - 104}" transform="rotate(${mid.toFixed(2)} 150 150)" text-anchor="middle" dominant-baseline="middle" font-size="${fs.toFixed(1)}" font-weight="800" fill="${dark ? '#0b0a00' : '#9d9b8f'}">${fmtX(w.segs[s.j].m)}</text>` : ''); }).join('');
  return `<svg class="cwheel" viewBox="0 0 300 300" aria-label="Kolo štěstí">
    <circle cx="150" cy="150" r="147" fill="#0b0a00" stroke="#ffd400" stroke-width="4"/>
    <g id="whg" transform="rotate(${(S.wRot % 360).toFixed(2)} 150 150)">${parts}</g>
    <circle cx="150" cy="150" r="44" fill="#131311" stroke="#ffd400" stroke-width="3"/>
    <text x="150" y="151" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="900" fill="#ffd400" font-stretch="125%">RB</text>
    <path d="M150 30 L137 4 H163 Z" fill="#ffd400" stroke="#000" stroke-width="2"/></svg>`;
}
function roulSlots(w){
  const W = w.reduce((a, b) => a + b, 0); let a = 0;
  return RL_ORDER.map(n => { const o = { n, a0: a / W * 360, a1: (a + w[n]) / W * 360 }; a += w[n]; return o; }).filter(s => s.a1 > s.a0);
}
const BALL = { rim: 132, pocket: 103 };
function roulSvg(r){
  const sl = roulSlots(r.w);
  const parts = sl.map(s => { const mid = (s.a0 + s.a1) / 2, len = (s.a1 - s.a0) * Math.PI / 180 * 119, fs = Math.min(12, len * .62);
    return `<path d="${arcP(95, 128, s.a0, s.a1)}" fill="${RL_FILL[rlCol(s.n)]}" stroke="#c9a400" stroke-width=".8"/>` +
      (fs >= 5 ? `<text x="150" y="${150 - 118}" transform="rotate(${mid.toFixed(2)} 150 150)" text-anchor="middle" dominant-baseline="middle" font-size="${fs.toFixed(1)}" font-weight="800" fill="#f5f3ea">${s.n}</text>` : ''); }).join('');
  const sp = [0, 45, 90, 135].map(a => `<path d="M150 ${150 - 70}V${150 + 70}" transform="rotate(${a} 150 150)" stroke="#c9a400" stroke-width="4" stroke-linecap="round"/>`).join('');
  return `<svg class="cwheel" viewBox="0 0 300 300" aria-label="Ruleta">
    <circle cx="150" cy="150" r="147" fill="#2a1d0e" stroke="#ffd400" stroke-width="4"/><circle cx="150" cy="150" r="137" fill="#1a1208"/>
    <g id="rwg" transform="rotate(${(S.rRot % 360).toFixed(2)} 150 150)">${parts}<circle cx="150" cy="150" r="95" fill="#3a2810" stroke="#c9a400" stroke-width="2"/><circle cx="150" cy="150" r="64" fill="#2a1d0e"/>${sp}<circle cx="150" cy="150" r="16" fill="#ffd400"/></g>
    ${ballEl()}<path d="M150 13 L142 0 H158 Z" fill="#ffd400"/></svg>`;
}
function ballXY(){ const r = BALL.pocket + (BALL.rim - BALL.pocket) * S.bR, t = (S.bAng - 90) * Math.PI / 180; return [150 + r * Math.cos(t), 150 + r * Math.sin(t)]; }
function ballEl(){ const [x, y] = ballXY(); return `<circle id="rball" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="6.5" fill="#fff" stroke="#999" stroke-width="1"/>`; }

// ---------- animace točení ----------
const SPIN = { on:false };
function spinPaint(){
  const w = document.getElementById('whg'); if (w) w.setAttribute('transform', `rotate(${(S.wRot % 360).toFixed(2)} 150 150)`);
  const r = document.getElementById('rwg'); if (r) r.setAttribute('transform', `rotate(${(S.rRot % 360).toFixed(2)} 150 150)`);
  const b = document.getElementById('rball'); if (b) { const [x, y] = ballXY(); b.setAttribute('cx', x.toFixed(2)); b.setAttribute('cy', y.toFixed(2)); }
}
function spinStart(g){
  const s = SPIN; Object.assign(s, { on:true, g, phase:'free', v: g === 'wheel' ? 900 : 420, bv: 620, last: 0 });
  if (g === 'roul') S.bR = 1;
  const step = t => {
    if (!s.on) return;
    const dt = s.last ? Math.min(.05, (t - s.last) / 1000) : 0; s.last = t;
    if (s.phase === 'free') { if (g === 'wheel') S.wRot += s.v * dt; else { S.rRot += s.v * dt; S.bAng -= s.bv * dt; } }
    else {
      const k = Math.min(1, (t - s.t0) / s.D), e = 1 - Math.pow(1 - k, 3);
      if (g === 'wheel') S.wRot = s.r0 + s.dr * e;
      else { S.rRot = s.r0 + s.dr * e; S.bAng = s.b0 + s.db * e; S.bR = k < .55 ? 1 : Math.max(0, 1 - (k - .55) / .32); }
      if (k >= 1) { s.on = false; spinPaint(); s.res(); return; }
    }
    spinPaint(); requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
// zastaví kolo tak, aby pod šipkou nahoře skončil úhel `at` (stupně na kole)
function spinStop(at){
  return new Promise(res => {
    const s = SPIN; if (!s.on) { res(); return; }
    const cur = s.g === 'wheel' ? S.wRot : S.rRot, want = s.g === 'wheel' ? 2.4 : 3.6;
    let dr = (((-at - cur) % 360) + 360) % 360;
    dr += 360 * Math.max(s.g === 'wheel' ? 2 : 1, Math.round((s.v * want / 3 - dr) / 360));
    const D = Math.max(1.8, 3 * dr / s.v) * 1000;
    Object.assign(s, { res, phase:'ease', t0: performance.now(), r0: cur, dr, D });
    if (s.g === 'roul') { const b0 = S.bAng; let db = -(((b0 % 360) + 360) % 360); db -= 360 * Math.max(2, Math.round((s.bv * D / 3000 + db) / 360)); Object.assign(s, { b0, db }); }
  });
}

// ---------- hra ----------
async function casSettle(s, r, pay){
  const bt = writeBatch(db);
  bt.update(doc(db,'cas',s.id), { st:'done', r, pay, done: serverTimestamp() });
  bt.update(doc(db,'users',s.uid), { points: increment(pay), lastCas: s.id });
  await bt.commit();
}
async function casLoad(){
  try { const q = await getDocs(query(collection(db,'cas'), where('uid','==',S.user.uid)));
    S.casHist = q.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => ms(b.t) - ms(a.t)); }
  catch(e){ S.casHist = []; }
}
// dohraje hry, které se nestihly vyhodnotit (zavřená appka, výpadek sítě)
async function casResume(){
  S.casResumed = true; await casLoad();
  const pend = (S.casHist || []).filter(s => s.st === 'spin' && s.t);
  let won = 0;
  for (const s of pend) { const r = pickR(rndOf(s.t), s.cum), pay = casPay(s, r);
    try { await casSettle(s, r, pay); Object.assign(s, { st:'done', r, pay }); won += pay; } catch(e){} }
  if (pend.length) { toast(`Dohráno ${pend.length === 1 ? '1 rozehraná hra' : pend.length + ' rozehraných her'}${won ? `, výhra ${fmtN(won)} b` : ''}`); render(); }
}
async function casSpin(){
  if (S.casBusy) return;
  const C = casCfg();
  if (!C.on) { toast('Kasino je teď zavřené.', true); return; }
  if (S.cfg.suspendAll) { toast('Sázení je teď pozastavené.', true); return; }
  if (isBlocked(me())) { toast('Sázení máš momentálně pozastavené.', true); return; }
  let data;
  if (S.casG === 'wheel') {
    const a = parseInt(S.casAmt) || 0; if (a < 1) { toast('Zadej vklad.', true); return; }
    data = { g:'wheel', a, m: C.wheel.m, cum: C.wheel.cum };
  } else {
    const bets = S.casBets.filter(b => b.a > 0); if (!bets.length) { toast('Polož žeton na stůl.', true); return; }
    data = { g:'roul', a: bets.reduce((x, b) => x + b.a, 0), bets: bets.map(b => b.v === undefined ? { k: b.k, a: b.a } : { k: b.k, v: b.v, a: b.a }), cum: C.roul.cum };
  }
  if (data.a > S.profile.points) { toast(`Tolik bodů nemáš (máš ${fmtN(S.profile.points)} b).`, true); return; }
  S.casBusy = true; S.casRes = null; render(); spinStart(data.g); buzz(15);
  const ref = doc(collection(db,'cas'));
  try {
    const bt = writeBatch(db);
    bt.set(ref, { uid: S.user.uid, name: S.profile.name || '', ...data, t: serverTimestamp(), st:'spin' });
    bt.update(doc(db,'users',S.user.uid), { points: increment(-data.a) });
    await bt.commit();
    const snap = await getDocFromServer(ref), s = { id: ref.id, ...snap.data() };
    const r = pickR(rndOf(s.t), s.cum), pay = casPay(s, r);
    let at;
    if (s.g === 'wheel') { const sl = wheelSlots(C.wheel.segs).filter(x => x.j === r), x = sl[Math.floor(Math.random() * sl.length)];
      at = x.a0 + (x.a1 - x.a0) * (.2 + Math.random() * .6); }
    else { const x = roulSlots(C.roul.w).find(p => p.n === r); at = x.a0 + (x.a1 - x.a0) * (.35 + Math.random() * .3); }
    await spinStop(at);
    await casSettle(s, r, pay);
    Object.assign(s, { st:'done', r, pay });
    S.casHist = [s, ...(S.casHist || [])];
    S.casRes = { g: s.g, r, pay, a: s.a, segs: s.g === 'wheel' ? C.wheel.segs : null };
    if (pay > s.a) { confetti(pay >= s.a * 5 ? 1.3 : .6); buzz([40, 50, 90]); }
    else if (pay > 0) buzz(30); else buzz(70);
  } catch(e){
    SPIN.on = false;
    const cfgErr = e.code === 'permission-denied' && JSON.stringify(casCfg()) !== JSON.stringify(C);
    toast(cfgErr ? 'Bookmaker zrovna změnil nastavení kasina. Zkus to znovu.' : errTxt(e), true);
    S.casResumed = false;
  }
  S.casBusy = false; render();
}
function rBet(k, v){
  if (S.casBusy) return;
  const b = { k }; if (v !== undefined && v !== '') b.v = +v;
  const key = rbKey(b), ex = S.casBets.find(x => rbKey(x) === key);
  if (!ex && S.casBets.length >= 10) { toast('Najednou můžeš vsadit nejvýš na 10 políček.', true); return; }
  const tot = S.casBets.reduce((a, x) => a + x.a, 0) + S.casChip;
  if (tot > S.profile.points) { toast(`Tolik bodů nemáš (máš ${fmtN(S.profile.points)} b).`, true); return; }
  if (ex) ex.a += S.casChip; else S.casBets.push({ ...b, a: S.casChip });
  S.casStack.push({ key, a: S.casChip }); S.casRes = null; buzz(8); render();
}
function rUndo(){
  const l = S.casStack.pop(); if (!l) return;
  const ex = S.casBets.find(x => rbKey(x) === l.key); if (ex) { ex.a -= l.a; if (ex.a <= 0) S.casBets = S.casBets.filter(x => x !== ex); }
  S.casRes = null; render();
}

}
function casHistHtml(){
  const h = (S.casHist || []).filter(s => s.st === 'done').slice(0, 8);
  if (!h.length) return '';
  return `<h2 style="margin-top:22px">Poslední hry</h2><div class="card cas-hist">${h.map(s => {
    const res = s.g === 'wheel' ? `<span class="cx">${fmtX(s.m[s.r])}</span>` : `<span class="rn ${rlCol(s.r)}">${s.r}</span>`;
    const net = s.pay - s.a;
    return `<div class="ch-r">${res}<span class="t"><b>${s.g === 'wheel' ? 'Kolo štěstí' : 'Ruleta'}</b><small>vklad ${fmtN(s.a)} b · ${fmtDate(s.t)}</small></span><b class="${net > 0 ? 'pos' : net < 0 ? 'neg' : ''}">${net > 0 ? '+' : ''}${fmtN(net)} b</b></div>`; }).join('')}</div>`;
}
function casResHtml(){

function casRead(){
  const d = S.ctx?.cas; if (!d) return null;

  d.on = document.getElementById('cs_on').checked;
  d.segs = d.segs.map((s, i) => ({ m: Math.max(0, Math.round((num('cs_m' + i, parseFloat) || 0) * 100) / 100), w: Math.max(0, num('cs_w' + i, v => parseInt(v)) || 0) }));
  d.rw[0] = Math.max(0, parseInt(document.getElementById('cs_z').value) || 0);
  for (let n = 1; n <= 36; n++) d.rw[n] = Math.max(0, parseInt(document.getElementById('cs_n' + n).value) || 0);
  d.ew = parseFloat(String(document.getElementById('cs_ew').value).replace(',', '.')) || 0;
  d.er = parseFloat(String(document.getElementById('cs_er').value).replace(',', '.')) || 0;

}
function rtpRoul(w){
  const W = w.reduce((a, b) => a + b, 0); if (!W) return null;
  const sum = f => { let s = 0; for (let n = 1; n <= 36; n++) if (f(n)) s += w[n]; return s / W; };
  const types = [['Číslo', null], ['Červená', n => RL_RED.includes(n), 2], ['Černá', n => !RL_RED.includes(n), 2], ['Sudá', n => n % 2 === 0, 2], ['Lichá', n => n % 2 === 1, 2],
    ['1–18', n => n <= 18, 2], ['19–36', n => n >= 19, 2], ...[0, 1, 2].map(v => [`${['1–12', '13–24', '25–36'][v]}`, n => Math.trunc((n - 1) / 12) === v, 3]), ...[0, 1, 2].map(v => [`${v + 1}. sloupec`, n => (n - 1) % 3 === v, 3])];
  const nums = []; for (let n = 1; n <= 36; n++) nums.push(36 * w[n] / W);
  return types.map(([t, f, m]) => f ? [t, m * sum(f), m * sum(f)] : [t, Math.min(...nums), Math.max(...nums)]);
}

    case 'isusp': { const it = itemFromKey(d); try { const bt = writeBatch(db); it.rows.filter(isLive).forEach(r => bt.update(doc(db,'markets',r.id), { suspended: d.v === '1' })); await bt.commit(); toast(d.v === '1' ? 'Pozastaveno ' : 'Obnoveno '); } catch(err){ toast(errTxt(err), true); } break; }
    case 'istatus': { const it = itemFromKey(d); try { const bt = writeBatch(db); it.rows.filter(isLive).forEach(r => bt.update(doc(db,'markets',r.id), { status: d.s })); await bt.commit(); toast(d.s === 'closed' ? 'Uzavřeno' : 'Otevřeno'); } catch(err){ toast(errTxt(err), true); } break; }
    case 'isettle': openSettle(itemFromKey(d)); break;
    case 'iedit': { const it = itemFromKey(d); it.type === 'g' ? openGroupForm(it.id) : openSingleForm(it.id); break; }
    case 'idup': { const it = itemFromKey(d); it.type === 'g' ? openGroupForm(it.id, true) : openSingleForm(it.id, true); break; }
    case 'icancel': { const it = itemFromKey(d); if (!confirm('Zrušit sázku? Tikety na ni budou vráceny (u AKO se tahle část nepočítá).')) break;
      try { const n = await settleMarkets(it.rows.filter(isLive).map(r => ({ mid:r.id, win:null }))); logA('Zrušena sázka', `${it.type==='g'?it.title:it.m.title} (${n} tiketů vráceno)`); toast(`Zrušeno (${n} tiketů)`); } catch(err){ toast(errTxt(err), true); } break; }
    case 'idel': { const it = itemFromKey(d); if (!confirm('Smazat sázku z přehledu? (tikety zůstanou)')) break;
      try { const bt = writeBatch(db); it.rows.forEach(r => bt.delete(doc(db,'markets',r.id))); await bt.commit(); } catch(err){ toast(errTxt(err), true); } break; }
    case 'win': { const m = M(S.ctx.mid); if (!confirm(`Výsledek: „${m.options[+d.i].label}"?`)) break;
      try { const n = await settleMarkets([{ mid:m.id, win:+d.i }]); logA('Vyhodnoceno', `${m.title}: ${m.options[+d.i].label} (${n} tiketů)`); closeModal(); toast(`Vyhodnoceno (${n} tiketů)`); } catch(err){ toast(errTxt(err), true); } break; }
    case 'gtog': t.classList.toggle('on'); break;
    case 'gsettlego': { const g = groupById(S.ctx.gid), yes = new Set([...$sheet.querySelectorAll('.chk.on')].map(b => b.dataset.m)), live = g.rows.filter(isLive);
      if (g.exclusive && yes.size > 1 && !confirm('Tahle tabulka má mít ANO jen u jednoho. Opravdu víc?')) break;
      const names = live.filter(r => yes.has(r.id)).map(r => r.rowLabel);
      if (!confirm(names.length ? `ANO: ${names.join(', ')}. Ostatní NE. Potvrdit?` : 'Všude NE. Potvrdit?')) break;
      try { const n = await settleMarkets(live.map(r => ({ mid:r.id, win: yes.has(r.id) ? 0 : 1 }))); logA('Vyhodnoceno', `${g.title}: ANO ${names.join(', ') || 'nikdo'} (${n} tiketů)`); closeModal(); toast(`Vyhodnoceno (${n} tiketů)`); } catch(err){ toast(errTxt(err), true); } break; }
    // formuláře
    case 'rowdel': t.closest('.grow,.optrow').remove(); break;
    case 'gaddone': document.getElementById('grows').insertAdjacentHTML('beforeend', gRowHtml()); break;
    case 'gaddnames': gAdd(document.getElementById('f_names').value.split(/\n|,/).map(s=>s.trim())); document.getElementById('f_names').value=''; break;
    case 'gaddplayers': gAdd(S.users.filter(u=>u.id!==S.user.uid).sort((a,b)=>a.name.localeCompare(b.name,'cs')).map(u=>u.name)); break;
    case 'gaddnums': { const f = parseInt(document.getElementById('f_from').value), to = parseInt(document.getElementById('f_to').value);
      if (isNaN(f)||isNaN(to)||to<f||to-f>100) { toast('Zadej od a do', true); break; } gAdd(Array.from({length:to-f+1},(_,k)=>String(f+k))); break; }
    case 'geven': { const tot = parseNum(document.getElementById('f_tot').value) || 100, rows = [...$sheet.querySelectorAll('#grows .grow')].filter(r => !r.dataset.done);
      if (!rows.length) { toast('Nejdřív přidej řádky', true); break; } rows.forEach(r => { r.querySelector('.rp').value = String(Math.round(tot / rows.length * 10) / 10).replace('.', ','); rowRecalc(r); }); break; }
    case 'gsave': saveGroup(); break;
    case 'oaddone': document.getElementById('orows').insertAdjacentHTML('beforeend', oRowHtml()); break;
    case 'oaddnums': { const f = parseInt(document.getElementById('f_from').value), to = parseInt(document.getElementById('f_to').value);
      if (isNaN(f)||isNaN(to)||to<f||to-f>39) { toast('Zadej od a do (max 40)', true); break; } oAdd(Array.from({length:to-f+1},(_,k)=>String(f+k))); break; }
    case 'oaddplayers': oAdd(S.users.filter(u=>u.id!==S.user.uid).sort((a,b)=>a.name.localeCompare(b.name,'cs')).map(u=>u.name)); break;
    case 'ssave': saveSingle(); break;
    // hráči
    case 'ubets': openUserBets(d.u); break;
    case 'upts': openPoints(d.u); break;
    case 'ulim': openLimits(d.u); break;
    case 'ulsave': saveLimits(); break;
    case 'ulbd': $sheet.querySelectorAll('[data-act=ulbd]').forEach(b => b.classList.toggle('on', b === t)); S.ctx.bd = d.v; break;
    case 'usharp': if (confirm('Nastavit jako ostrého hráče? Limity 30 %, přísnější schvalování a nevýhodný cash-out.')) makeSharp(d.u); break;
    case 'boffer': openOffer(d.b); break;
    case 'offsend': sendOffer(); break;
    case 'offyes': answerOffer(d.b, true); break;
    case 'offno': if (confirm('Odmítnout nabídku? Vklad se ti vrátí.')) answerOffer(d.b, false); break;
    case 'logref': S.logRows = null; render(); break;
    case 'padj': { const v = parseInt(document.getElementById('pa').value); if (!v||v<1) break;
      try { await updateDoc(doc(db,'users',S.ctx.uid), { points: increment(v * +d.s) }); logA('Body', `${S.users.find(x => x.id === S.ctx.uid)?.name}: ${+d.s > 0 ? '+' : '−'}${v} b`); closeModal(); toast('Body upraveny'); } catch(err){ toast(errTxt(err), true); } break; }
    // nastavení
    case 'cgen': document.getElementById('s_nt').value = 'sazkovka-' + Math.random().toString(36).slice(2,10); break;
    case 'csave': saveSettings(); break;
    case 'ctest': { const topic = document.getElementById('s_nt').value.trim(); if (!topic) { toast('Nejdřív vyplň téma', true); break; }
      const old = S.cfg.ntfyTopic; S.cfg.ntfyTopic = topic; const ok = await ntfy('🎲 Test', 'Notifikace ze sázkovky fungují ✅'); S.cfg.ntfyTopic = old;
      toast(ok ? 'Odesláno – mrkni do ntfy' : 'Nepodařilo se odeslat – zkontroluj internet / blokátor reklam', !ok);
      if (ok && topic !== (old||'')) toast('Nezapomeň dát „Uložit nastavení“ – bez toho hráči notifikaci neposílají', true); break; }
  }
});
document.addEventListener('keydown', e => { if (e.key==='Enter' && !S.user && document.getElementById('lp')) doLogin(S.authMode==='register'); });
setInterval(() => { if (isAdmin()) housekeeping(); if (S.user && S.profile && !$modal.classList.contains('show')) render(); }, 30000);

/* ---- PWA manifest (ikona na ploše) ---- */
try {
  const mf = { name: APP_NAME, short_name: 'Riskobet', start_url: location.pathname + location.search, display: 'standalone', background_color: '#000000', theme_color: '#000000',
    icons: [{ src: new URL('icon.png', location.href).href, sizes: '512x512', type: 'image/png' }] };
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type:'application/manifest+json' })); document.head.appendChild(l);
} catch {}

</script>
